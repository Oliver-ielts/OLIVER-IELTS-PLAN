        "And explain how you felt about it"
      ],
      "a": "A time I helped someone was when an older man at a railway station couldn't find the platform for his train. This happened a few months ago, when I was travelling to visit a friend and had arrived earlier than necessary.<br><br>I noticed him looking repeatedly between his ticket and the departure board. He seemed worried, so I asked whether he needed any help. He told me that he didn't travel by train very often and wasn't sure which part of the station he should go to.<br><br>First, I checked the train number on his ticket against the board. Then I showed him the platform number and explained that the boarding gate hadn't opened yet. I didn't want to guess about anything, so we also asked a member of station staff to confirm the information.<br><br>Once we knew where to go, I walked with him to the waiting area. He had a small suitcase, but he said he was comfortable carrying it himself. We found a seat near the gate, and I pointed out where the announcements would appear. Before leaving, I checked that he felt confident about what to do next.<br><br>I felt pleased afterwards because a small amount of my time had made the journey less stressful for him. He thanked me warmly, but I didn't feel that I'd done anything extraordinary. It was simply a chance to <mark class=\"idiom\">lend a hand(帮一把)</mark>. The experience reminded me to notice when people around me might need practical support.",
      "t": "几个月前，我在火车站帮过一位找不到乘车站台的老人。当时我去看朋友，提前到了车站。<br><br>他反复看票和出发信息屏，显得担心。我询问是否需要帮助。他说不常坐火车，不知道去哪里。<br><br>我先核对车次，指出站台号，解释检票还没开始。为避免猜测，我们也向工作人员确认了信息。<br><br>然后我陪他到候车区。他说自己能拿小行李箱，所以我没有擅自接过去。我们找到检票口附近的座位，我说明公告在哪里显示，离开前确认他知道下一步怎么做。<br><br>我很开心，因为一点时间就减轻了他的压力。他热情道谢，但我不觉得自己做了非凡的事，只是顺手帮忙。这提醒我，应该留意身边是否有人需要实际支持。",
      "p3": [
        {
          "q": "Should children be taught to be kind to others?",
          "a": "Yes, because kindness helps children understand that their actions affect others. It can be taught through everyday examples, such as including a classmate or offering practical help. <span class=\"conn\">However</span>, they should also learn boundaries. Being kind doesn't mean agreeing to everything or ignoring their own safety just to <mark class=\"idiom\">keep someone happy(让某人高兴)</mark>.",
          "t": "应该，通过接纳同学和实际帮助等日常示范，理解行为影响。同时学边界，善良不等于事事答应或忽视安全。"
        },
        {
          "q": "Should people be very kind when they help others?",
          "a": "They should be respectful and considerate, because help can feel uncomfortable if it makes someone seem incapable. <span class=\"conn\">For example</span>, asking what is needed is better than taking over immediately. Kindness includes preserving the other person's dignity, not just completing the task or expecting them to <mark class=\"idiom\">show gratitude(表达感激)</mark>.",
          "t": "应尊重体贴，避免让人觉得无能。先问需求比立即接管好，善意也包括维护尊严，而不只做完任务或要求感谢。"
        },
        {
          "q": "Can kids provide any help to parents?",
          "a": "Yes, through age-appropriate tasks such as tidying toys, setting the table or helping prepare simple ingredients with supervision. These tasks let children contribute and practise independence. <span class=\"conn\">But</span> adults should keep expectations reasonable. Helping should be a shared family habit, rather than placing a <mark class=\"idiom\">heavy burden(沉重负担)</mark> on a child.",
          "t": "可以做适龄家务，例如收玩具、摆餐具、在监督下准备简单材料，培养贡献与独立。但要求要合理，不把沉重负担压给孩子。"
        },
        {
          "q": "Should parents give children advice? Why?",
          "a": "Yes, parents can offer experience and help children consider consequences. <span class=\"conn\">However</span>, advice works better when it begins with listening and leaves room for discussion. As children grow, they need more say in their choices. The aim is to guide them towards sound judgement, rather than <mark class=\"idiom\">make every decision for them(替他们决定一切)</mark>.",
          "t": "应给经验、帮助想后果，但先倾听、允许讨论更有效。孩子长大应有更多选择权，目标是培养判断，而非代替所有决定。"
        },
        {
          "q": "What kind of advice should parents give to their children?",
          "a": "They can advise on treating people respectfully, staying safe and managing everyday responsibilities. They can also help children think through difficult choices. <span class=\"conn\">But</span> the advice should fit the situation, not become a lecture about everything. Asking a few questions may help a child <mark class=\"idiom\">arrive at their own conclusion(得出自己的结论)</mark>.",
          "t": "可教尊重、安全、日常责任，帮助想难选择。但要针对情况，少泛泛说教，几个问题可能帮助孩子自己得出结论。"

          "q": "Should parents help their kids with their homework?",

          "t": "应提供指导而非代做，让孩子解释可发现卡点，持续困难可联系老师。作业应支持学习与独立，而非体现家长代劳多少。"
        }

    {

      "describe": "Describe a time when someone talked about something you were not interested in but you kept listening",

      "a": "A time I kept listening to something I wasn't interested in was during dinner with my friend Ben last month. He had recently started collecting model trains and was very excited about a new model he'd bought.<br><br>He began explaining the differences between various engines, the track sizes and the tiny details on the model. I could understand the general idea, but I didn't know enough about the hobby to follow all the technical points. Normally, I wouldn't choose to spend an evening learning about model trains.<br><br><span class=\"conn\">Still</span>, I kept listening because he was clearly enthusiastic and wanted to share something meaningful to him. We'd known each other for years, and he had often listened patiently when I talked about my work. I felt it was fair to <mark class=\"idiom\">return the favour(回报同样的善意)</mark>.<br><br>I didn't pretend to be an expert. I asked simple questions, such as what first attracted him to the hobby and whether he built the models himself. That shifted the conversation towards his personal experience, which I found much more interesting than the technical details.<br><br>At first, I felt a little restless, but gradually I enjoyed seeing how much pleasure the hobby gave him. It reminded me that listening isn't always about sharing the same interest. Sometimes it's about giving someone your attention and understanding why something matters to them. I wouldn't want every conversation to be one-sided, but on that occasion, keeping an <mark class=\"idiom\">open mind(开放的心态)</mark> was worthwhile.",
      "t": "上个月与朋友Ben吃饭时，他讲了我不太感兴趣的模型火车。他刚买了新模型，非常兴奋。<br><br>他解释不同发动机、轨道尺寸和小细节。我能懂大概，但不熟悉这个爱好，所以跟不上技术部分。平时我不会主动花一晚研究模型火车。<br><br>我仍继续听，因为这对他有意义，我们认识多年，他也经常耐心听我的工作。我觉得应该回报同样的关注。<br><br>我没有装专家，而是问他最初为什么喜欢、是否亲手制作等简单问题。这样谈话转向个人体验，比技术细节更吸引我。<br><br>起初有点坐不住，后来却享受看到爱好带给他的快乐。这提醒我，倾听不一定需要共同兴趣，也可以是理解某件事为何对对方重要。虽然不希望每次都单方面说，但这次保持开放心态很值得。",
      "p3": [
        {
          "q": "What kind of topics do young people like to talk about today?",
          "a": "They often discuss entertainment, friendships, study, work and things they've seen online. Some are also interested in social issues or future plans. <span class=\"conn\">However</span>, young people aren't one uniform group. Their conversations reflect their interests and circumstances, and a shared experience can quickly <mark class=\"idiom\">become a talking point(成为话题)</mark>.",
          "t": "常谈娱乐、友情、学习工作和网络内容，也有人关心社会议题与未来。年轻人不是同一群体，话题反映兴趣处境，共同经历也会引出交流。"
        },
        {
          "q": "What would happen if the listener didn’t listen carefully?",
          "a": "They might miss important details, misunderstand the message or respond inappropriately. The speaker may also feel ignored, which can weaken trust. <span class=\"conn\">For example</span>, overlooking an instruction can create extra work later. Careful listening isn't just polite; it helps people <mark class=\"idiom\">stay on the same page(保持理解一致)</mark> about what needs to happen.",
          "t": "可能漏细节、误解、回应不当，让说话者觉得被忽略，削弱信任。漏指令也会增加后续工作，认真倾听能保持理解一致。"
        },
        {
          "q": "How can we tell if a listener is listening carefully?",
          "a": "Relevant questions and accurate responses are stronger signs than eye contact alone. A listener might also summarise the main point to check understanding. <span class=\"conn\">However</span>, people's styles differ, so being quiet doesn't necessarily mean being inattentive. I'd look at the quality of engagement, rather than one <mark class=\"idiom\">outward signal(外在信号)</mark>.",
          "t": "相关问题、准确回应比单看眼神更可靠，也可总结确认。风格不同，安静不等于不专心，应看参与质量，而非单个外在信号。"
        },
        {
          "q": "How can a teacher tell if students are listening in class?",
          "a": "They can ask students to explain an idea, apply it to a new example or discuss it briefly with a partner. Those responses reveal understanding better than simply asking whether everyone is listening. <span class=\"conn\">Also</span>, a confused expression may mean a student needs clarification, not that they're deliberately <mark class=\"idiom\">switching off(不听了)</mark>.",
          "t": "可让学生解释、应用新例、短暂同伴讨论，比问“都在听吗”更能看出理解。困惑表情可能是需要澄清，而非故意走神。"
        },
        {
          "q": "What do you think about talking with people who have different opinions?",
          "a": "It can be useful because it exposes me to reasons I haven't considered. <span class=\"conn\">But</span> the conversation needs mutual respect and a willingness to listen. I don't have to agree in order to understand someone's position. Asking questions may help us <mark class=\"idiom\">find common ground(找到共同点)</mark>, even if the final disagreement remains.",
          "t": "有价值，能听到没考虑过的理由，但须互相尊重、愿意听。理解不要求同意，提问可找到共同点，即使最后仍有分歧。"
        },
        {
          "q": "Do most young people in your country like to talk with elderly people?",
          "a": "Some do, especially with relatives or older people they know well. Others may find it difficult because they expect little shared experience. <span class=\"conn\">However</span>, an interesting conversation can change that assumption. I wouldn't claim most either like or dislike it; openness and the relationship matter more than a simple <mark class=\"idiom\">age divide(年龄划分)</mark>.",
          "t": "有人喜欢，尤其熟悉亲属，也有人预期共同经历少而觉得难。但有趣交流可改变假设，不能说大多数一定喜欢或不喜欢，开放态度和关系更重要。"
        }

      "a": "I'd like to talk about a tall building that really impresses me, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> the Shanghai Tower. It's mainly a place for offices and shops, and it's even got restaurants and <mark class=\"idiom\">viewing decks（观景台）</mark> for tourists.<br><br>It's right <mark class=\"idiom\">in the heart of（位于……中心）</mark> Lujiazui, which is Shanghai's <mark class=\"idiom\">financial district（金融区）</mark>. It stands next to a couple of other famous <mark class=\"idiom\">skyscrapers（摩天大楼）</mark>, <span class=\"conn\">so</span> together they make a pretty stunning <mark class=\"idiom\">skyline（天际线）</mark>.<br><br><span class=\"conn\">As for</span> what it looks like, it's incredibly tall and has this cool <mark class=\"idiom\">twisting shape（扭转的造型）</mark> that <mark class=\"idiom\">spirals up（盘旋而上）</mark> into the sky. The whole thing is covered in glass, <span class=\"conn\">which</span> <mark class=\"idiom\">catches the sunlight（反射阳光）</mark> beautifully, <span class=\"conn\">especially</span> at sunset.<br><br>I'll never forget my first visit, when I shot up to the top in one of the world's <mark class='idiom'>fastest lifts（最快的电梯）</mark> — my ears actually popped on the way up. <span class='conn'>From</span> the observation deck, the whole city <mark class='idiom'>stretched out（铺展开来）</mark> beneath me like a giant living map. <span class='conn'>At night</span>, with all the lights on, the view was simply <mark class='idiom'>out of this world（美得不真实）</mark>.<br><br>What also fascinates me is the clever engineering behind it. I once read that its <mark class='idiom'>twin-layer glass skin（双层玻璃幕墙）</mark> and wind-resistant design make it surprisingly <mark class='idiom'>energy-efficient（节能的）</mark>, which is impressive for something so enormous. <span class='conn'>Whenever</span> friends visit Shanghai from out of town, this is the first place I take them, and they're always <mark class='idiom'>blown away（惊叹不已）</mark>. <span class='conn'>To be fair</span>, the queue for the lift can be painfully long at weekends, but the view from the top more than <mark class='idiom'>makes up for（弥补）</mark> the wait.<br><br>I really like it <span class=\"conn\">because</span> it's not just a building — it's kind of <mark class=\"idiom\">a symbol of（……的象征）</mark> how fast the city has grown. Standing up on the deck and looking down at the whole city always <mark class=\"idiom\">takes my breath away（让我惊叹不已）</mark>. <span class=\"conn\">That's why</span> it's my favourite building in China.",
      "t": "我想谈谈一座很让我惊艳的高楼——上海中心大厦。它主要是个办公和购物的地方，里面甚至还有餐厅和供游客参观的观景台。<br><br>它就在陆家嘴的中心地带，也就是上海的金融区。它旁边还有另外几座著名的摩天大楼，所以它们一起构成了一道相当壮观的天际线。<br><br>说到它的样子，它高得惊人，有一种很酷的、向天空盘旋而上的扭转造型。整栋楼都覆盖着玻璃，能把阳光反射得很漂亮，尤其是在日落时分。<br><br>我永远忘不了第一次去的情景——我乘着世界上最快的电梯之一直冲顶层，上去的路上耳朵都被压得发胀。站在观景台上，整座城市像一幅巨大的活地图般在我脚下铺展开来。到了晚上，万家灯火亮起，那景色简直美得不真实。<br><br>同样让我着迷的，是它背后精巧的工程。我曾读到，它的双层玻璃幕墙和抗风设计让这么庞大的建筑出奇地节能，这很了不起。每次有外地朋友来上海，这都是我带他们去的第一个地方，他们总是惊叹不已。平心而论，周末等电梯的队排得让人头疼，但顶层的景色完全弥补了等待。<br><br>我很喜欢它，因为它不只是一栋楼——它某种程度上是这座城市发展速度的象征。站在观景台上俯瞰整座城市，总能让我惊叹不已。这就是为什么它是我在中国最喜欢的建筑。",

      "a": "I'd like to talk about an interesting video I watched not long ago, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a clip I <mark class=\"idiom\">came across（偶然刷到）</mark> on Douyin one night, while I was <mark class=\"idiom\">scrolling through my phone（刷手机）</mark> before bed.<br><br>The video was about a <mark class=\"idiom\">street musician（街头艺人）</mark> playing in a busy subway station. He was singing an old classic on his guitar, <span class=\"conn\">and</span> <span class=\"conn\">little by little</span> a big crowd <mark class=\"idiom\">gathered around（围拢过来）</mark> him to listen and <mark class=\"idiom\">sing along（跟着唱）</mark>.<br><br>Honestly, I clicked on it just <mark class=\"idiom\">out of curiosity（出于好奇）</mark>, <span class=\"conn\">because</span> the <mark class=\"idiom\">thumbnail（封面图）</mark> looked pretty touching. <span class=\"conn\">Once</span> I started watching, I couldn't stop, <span class=\"conn\">since</span> the whole <mark class=\"idiom\">vibe（氛围）</mark> was so warm and the music was lovely.<br><br>There was one moment that really <mark class='idiom'>got to me（打动了我）</mark> — a little girl walked up and dropped a few coins into his guitar case, and he gave her the warmest smile. <span class='conn'>Scrolling</span> through the comments afterwards, I saw thousands of people saying it had <mark class='idiom'>made their day（让他们一天都开心）</mark>. <span class='conn'>It's amazing</span> how a thirty-second clip can leave such a <mark class='idiom'>lasting impression（持久的印象）</mark>.<br><br>What struck me was how different it felt from the endless stream of <mark class='idiom'>mindless clips（无脑短视频）</mark> I usually scroll past without thinking. Most are forgotten in seconds, <span class='conn'>whereas</span> this one genuinely <mark class='idiom'>stayed with me（萦绕心头）</mark> for days. <span class='conn'>I even</span> looked the musician up afterwards and found out he busks there every weekend to support his family, which made the clip feel even more <mark class='idiom'>down-to-earth（接地气）</mark> and real. <span class='conn'>In a way</span>, it reminded me why I enjoy short videos in the first place.<br><br>It really <mark class=\"idiom\">moved me（打动了我）</mark> and <mark class=\"idiom\">put a smile on my face（让我会心一笑）</mark>. It reminded me that music can <mark class=\"idiom\">bring strangers together（让陌生人聚到一起）</mark>, <span class=\"conn\">even</span> in such an ordinary place. <span class=\"conn\">That's why</span> I saved it and have watched it a few times since.",
      "t": "我想谈谈一个我不久前看的有趣视频——那是我某天晚上睡前刷手机时，在抖音上偶然刷到的一个片段。<br><br>这个视频讲的是一位街头艺人在繁忙的地铁站里表演。他抱着吉他唱着一首老经典，渐渐地，一大群人围拢过来听他唱、还跟着一起唱。<br><br>说实话，我点开它只是出于好奇，因为封面图看着挺打动人的。一旦开始看，我就停不下来了，因为整个氛围太温暖了，音乐也很好听。<br><br>其中有一个瞬间真的打动了我——一个小女孩走上前，往他的吉他盒里放了几枚硬币，他回以最温暖的微笑。后来翻看评论，我看到成千上万的人说这条视频让他们一整天都开心。一段三十秒的短片竟能留下如此持久的印象，真是不可思议。<br><br>让我印象深刻的是，它和我平时不假思索刷过去的那些无脑短视频完全不同。大多数视频几秒钟就被忘掉了，而这条却在我心头萦绕了好几天。我后来还特意去搜了那位街头歌手，发现他每个周末都在那儿卖唱补贴家用，这让这条视频显得更接地气、更真实。某种程度上，它让我想起了自己当初为什么喜欢刷短视频。<br><br>它真的打动了我，让我会心一笑。它提醒我，音乐能让陌生人聚到一起，哪怕是在这样一个再普通不过的地方。这就是为什么我把它收藏了，之后还看了好几遍。",

      "a": "I'd like to talk about a place I found <mark class=\"idiom\">pretty boring（挺无聊的）</mark>, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a small local museum in my hometown. It's a tiny <mark class=\"idiom\">two-storey（两层的）</mark> building on a quiet street in the old part of town.<br><br>I went there with my parents during a public holiday a couple of years ago. They thought it would be <mark class=\"idiom\">educational（有教育意义的）</mark>, <span class=\"conn\">so</span> they <mark class=\"idiom\">kept saying we should go（一直说我们该去）</mark>, <span class=\"conn\">even though</span> I wasn't really interested.<br><br>We spent about an hour walking around, looking at some old farming tools and <mark class=\"idiom\">faded photos（褪色的老照片）</mark>. There wasn't much information to read, <span class=\"conn\">and</span> no fun interactive bits at all, <span class=\"conn\">so</span> we basically just <mark class=\"idiom\">glanced at（匆匆看了一眼）</mark> things and moved on.<br><br>What made it even worse was how silent and empty the place was — we were practically the only visitors, and our footsteps <mark class='idiom'>echoed（回荡）</mark> in the empty halls. <span class='conn'>I kept</span> hoping for something interactive, <span class='conn'>but</span> there was nothing to <mark class='idiom'>keep me engaged（让我提得起兴趣）</mark>. <span class='conn'>After</span> twenty minutes, I was already <mark class='idiom'>counting down the minutes（数着分钟盼着结束）</mark>.<br><br>What made it even more disappointing was that I'd been to a brilliant interactive science museum just months before, so I couldn't help <mark class='idiom'>drawing comparisons（做对比）</mark>. That one had hands-on experiments everywhere, and time just <mark class='idiom'>flew by（飞快流逝）</mark>. <span class='conn'>By contrast</span>, this little place felt <mark class='idiom'>stuck in the past（停留在过去）</mark>, as if nothing had been updated for decades. <span class='conn'>Honestly</span>, with a bit of effort — better lighting, a few interactive displays — it could have been genuinely interesting, because the old tools themselves did have real <mark class='idiom'>historical value（历史价值）</mark>.<br><br>I found it boring <span class=\"conn\">mainly because</span> everything felt <mark class=\"idiom\">old and lifeless（陈旧又没生气）</mark>. The displays were <mark class=\"idiom\">badly laid out（布置得乱七八糟）</mark> and there was nothing to <mark class=\"idiom\">grab your attention（抓住你的注意力）</mark>. <span class=\"conn\">To be honest</span>, I couldn't wait to leave and go grab lunch <span class=\"conn\">instead</span>.",
      "t": "我想谈谈一个我觉得挺无聊的地方——我家乡的一家小型本地博物馆。它是一栋小小的两层建筑，在老城区一条安静的街道上。<br><br>几年前的一个公共假期，我和父母一起去的。他们觉得那里会很有教育意义，所以一直说我们该去看看，尽管我并不太感兴趣。<br><br>我们在里面走了大约一个小时，看了一些旧农具和褪色的老照片。可读的介绍不多，也完全没有什么好玩的互动环节，所以我们基本上就是匆匆看一眼就走了。<br><br>更糟的是，那地方又静又空——我们几乎是唯一的参观者，脚步声在空荡荡的展厅里回荡。我一直盼着能有点互动的东西，但根本没有任何能让我提得起兴趣的内容。二十分钟后，我已经在数着分钟、盼着能赶紧离开了。<br><br>让这次参观更扫兴的是，我几个月前刚去过一家很棒的互动科技馆，所以忍不住做起了对比。那家馆里到处都是动手实验，时间飞快地就过去了。相比之下，这家小馆感觉停留在过去，仿佛几十年都没更新过。说实话，只要稍微用点心——改善灯光、加些互动展品——它本可以相当有意思，因为那些老物件本身其实是有真正历史价值的。<br><br>我觉得它无聊，主要是因为一切都显得陈旧又没生气。展品布置得乱七八糟，也没有任何能抓住你注意力的东西。说实话，我当时只想赶紧离开，去吃个午饭。",

      "a": "I'd like to talk about a time when I got up <mark class=\"idiom\">super early（超级早地）</mark>, which was <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> during a trip to Mount Tai last summer.<br><br>I <mark class=\"idiom\">set my alarm（定了闹钟）</mark> for around three in the morning and started <mark class=\"idiom\">hiking up（徒步上山）</mark> in the dark with a group of friends. We climbed for nearly two hours, using our <mark class=\"idiom\">phone torches（手机手电）</mark> to light the way, <span class=\"conn\">and</span> <span class=\"conn\">finally</span> made it to the top just <mark class=\"idiom\">before dawn（黎明前）</mark>.<br><br>The reason I got up so early was to <mark class=\"idiom\">catch the sunrise（看日出）</mark> from the top. It's said to be one of the most <mark class=\"idiom\">amazing views（壮观的景色）</mark> in China, <span class=\"conn\">so</span> none of us wanted to miss it.<br><br>The climb itself was far harder than I'd expected — my legs were <mark class='idiom'>aching（酸痛）</mark> and the cold mountain air <mark class='idiom'>bit at（刺痛）</mark> my face. <span class='conn'>Every</span> few minutes someone would <mark class='idiom'>cheer the group on（给大家加油打气）</mark> to keep our spirits up. <span class='conn'>By the time</span> we reached the summit, we were exhausted but buzzing with <mark class='idiom'>anticipation（期待）</mark>.<br><br>The sunrise itself was something I'll never forget. As the first light <mark class='idiom'>broke over the horizon（破晓而出）</mark>, the whole crowd around me <mark class='idiom'>fell silent（鸦雀无声）</mark>, and then people started cheering and snapping photos all at once. The sky shifted from deep purple to fiery orange in minutes, and the <mark class='idiom'>sea of clouds（云海）</mark> below us glowed like gold. <span class='conn'>For a few moments</span>, I completely forgot how cold and tired I was. <span class='conn'>Looking back</span>, part of what made it so special was that we'd <mark class='idiom'>earned it（靠努力换来的）</mark> — the painful early start made the reward so much sweeter.<br><br><span class=\"conn\">At first</span> I felt <mark class=\"idiom\">worn out（精疲力竭）</mark> and a bit <mark class=\"idiom\">grumpy（暴躁的）</mark>, <span class=\"conn\">but</span> the moment the sun came up over the clouds, all my tiredness just disappeared. It was absolutely <mark class=\"idiom\">breathtaking（令人惊叹的）</mark>, and I felt it was totally <mark class=\"idiom\">worth it（值了）</mark>.",
      "t": "我想谈谈一次我起得超级早的经历——那是去年夏天我去泰山旅行的时候。<br><br>我把闹钟定在了凌晨三点左右，然后和一群朋友摸黑开始徒步上山。我们用手机手电照路，爬了将近两个小时，终于赶在黎明前到了山顶。<br><br>我之所以起这么早，是为了在山顶看日出。据说那是中国最壮观的景色之一，所以我们谁都不想错过。<br><br>爬山的过程比我想象的要难得多——我的腿酸痛不已，山上冰冷的空气刺痛着我的脸。每隔几分钟就有人给大家加油打气，好让我们保持士气。等我们爬到山顶时，虽然筋疲力尽，却又因满心的期待而兴奋不已。<br><br>日出本身是我永远忘不了的画面。当第一缕光破晓而出时，我周围的人群一下子鸦雀无声，紧接着大家又同时欢呼起来、纷纷拍照。天空在短短几分钟里从深紫变成炽橙，我们脚下的云海像黄金一样闪耀。有那么几秒，我彻底忘了自己有多冷、多累。回头想想，它之所以这么特别，恰恰是因为这是我们靠努力换来的——痛苦的早起让这份回报显得格外甘甜。<br><br>一开始我又累又有点暴躁，但当太阳从云层上方升起的那一刻，我所有的疲惫一下子就消失了。那景象简直令人惊叹，我觉得这一切完全值了。",

          "q": "Do you know anyone who likes to get up early?",

      "a": "The person I'd like to talk about is my grandmother, who is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> someone with <mark class=\"idiom\">a real passion for（对……有真正的热情）</mark> growing plants. She's <mark class=\"idiom\">in her seventies（七十多岁）</mark> now, but she's still active and spends most of her free time in her little garden.<br><br>She mainly grows vegetables, <span class=\"conn\">such as</span> tomatoes, cucumbers and <mark class=\"idiom\">leafy greens（绿叶菜）</mark>, <span class=\"conn\">along with</span> a few flowers to brighten the place up. Her little garden <mark class=\"idiom\">grows loads（产量很高）</mark>, <span class=\"conn\">so</span> she hardly ever needs to buy vegetables from the market.<br><br>She looks after them with so much patience. Every morning she waters the plants, <mark class=\"idiom\">pulls out the weeds（拔草）</mark>, and uses <mark class=\"idiom\">natural fertiliser（天然肥料）</mark> <span class=\"conn\">instead of</span> chemicals. She's picked up most of her tips from years of doing it and a few <mark class=\"idiom\">gardening shows（园艺节目）</mark> on TV.<br><br>What I find really sweet is that she always shares her harvest with the neighbours, often <mark class='idiom'>knocking on doors（挨家敲门）</mark> with a basket of fresh tomatoes. <span class='conn'>Because of this</span>, she's <mark class='idiom'>well-loved（很受爱戴）</mark> on her street, and people often stop by for a chat. <span class='conn'>Seeing</span> how much joy her little garden brings to others, I've realised it's about far more than just growing food.<br><br>I have such fond memories of helping her in the garden as a child, even though I mostly just <mark class='idiom'>got in the way（帮倒忙）</mark>. She'd patiently show me how to <mark class='idiom'>tell the weeds from（区分……与）</mark> the real seedlings, and she always said that plants, like people, need patience and care to <mark class='idiom'>thrive（茁壮成长）</mark>. <span class='conn'>Looking back</span>, those quiet afternoons taught me more about patience than almost anything else in my childhood.<br><br>She loves it <span class=\"conn\">because</span> gardening keeps her healthy and gives her <mark class=\"idiom\">a sense of achievement（成就感）</mark>. Watching the plants grow <mark class=\"idiom\">from tiny seeds（从小小的种子）</mark> brings her a lot of joy. <span class=\"conn\">For her</span>, it's both a hobby and a way to relax.",
      "t": "我想谈的这个人是我的奶奶，她是个对种植植物有着真正热情的人。她现在七十多岁了，但依然很有活力，把大部分空闲时间都花在她那块小菜园里。<br><br>她主要种菜，比如西红柿、黄瓜和各种绿叶菜，还会种几株花来点缀一下。她那块小菜园产量很高，所以她几乎不用去市场买菜。<br><br>她照料这些植物特别有耐心。每天早上她都会浇水、拔草，而且用天然肥料而不是化肥。她的大部分种植小窍门都来自多年的经验，还有几档电视上的园艺节目。<br><br>我觉得特别暖心的一点是，她总把收成分给邻居，常常提着一篮新鲜的西红柿挨家敲门。正因如此，她在那条街上很受爱戴，大家也常顺道来和她聊聊天。看到她那个小菜园给别人带来这么多快乐，我渐渐明白，这早已不只是种菜那么简单了。<br><br>我有很多帮她打理菜园的美好回忆，尽管小时候我多半是在帮倒忙。她会耐心地教我怎么区分杂草和真正的幼苗，还总说植物和人一样，需要耐心和呵护才能茁壮成长。回头想想，那些安静的午后教会我的耐心，比我童年里几乎任何别的事都多。<br><br>她热爱种菜，是因为园艺让她保持健康，也带给她成就感。看着植物从小小的种子一点点长大，让她特别开心。对她来说，这既是爱好，也是一种放松的方式。",
      "p3": [

      "ztitle": "想颁布的新法律",
      "describe": "Describe a new law you would like to introduce in your country",

      "a": "I'd like to introduce a law that <mark class=\"idiom\">puts a strict limit on（严格限制）</mark> <mark class=\"idiom\">overtime work（加班）</mark>, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a law that would stop companies from making employees work <mark class=\"idiom\">crazy long hours（超长工时）</mark>, like the so-called \"996\" culture.<br><br>This law would bring some big changes. Companies would have to stick to a <mark class=\"idiom\">normal eight-hour workday（正常的八小时工作日）</mark>, <span class=\"conn\">and</span> anyone working extra would get <mark class=\"idiom\">paid fairly for it（拿到合理的加班费）</mark>. <span class=\"conn\">As a result</span>, people would have more time to rest and be with their families.<br><br>I reckon this law would be really popular, <span class=\"conn\">at least</span> among ordinary workers. So many people are <mark class=\"idiom\">worn out（累垮了）</mark> by long hours, <span class=\"conn\">so</span> they'd definitely <mark class=\"idiom\">welcome it（举双手欢迎）</mark>. Some bosses, <span class=\"conn\">however</span>, might not be too happy about it.<br><br>The idea came to me after seeing how stressed my friends are at work. A few of them <mark class=\"idiom\">barely have a life outside work（几乎没有工作以外的生活）</mark>, <span class=\"conn\">which</span> made me realise just how serious the problem is.<br><br>I've seen <mark class='idiom'>first-hand（亲眼目睹）</mark> how damaging overwork can be — one of my closest friends ended up so <mark class='idiom'>burnt out（精疲力竭）</mark> that his health seriously suffered. <span class='conn'>A law like this</span> wouldn't just protect people's time; it would send a clear message that employees are human beings, not <mark class='idiom'>machines（机器）</mark>. <span class='conn'>In the long run</span>, rested, happier workers would be more productive too.<br><br>It's also worth mentioning that some companies have already started moving in this direction <mark class='idiom'>of their own accord（主动地）</mark>, offering flexible hours and proper overtime pay, and they've reportedly seen lower <mark class='idiom'>staff turnover（员工流失率）</mark> as a result. <span class='conn'>To me</span>, that proves such a law wouldn't just be good for workers — it would be good for businesses in the long run too.<br><br>Honestly, I feel quite strongly about this. A law like this could really improve people's <mark class=\"idiom\">well-being（幸福感）</mark> and create a healthier <mark class=\"idiom\">work-life balance（工作与生活的平衡）</mark>. <span class=\"conn\">That's why</span> I think it's worth bringing in.",
      "t": "我想推行一部严格限制加班的法律——这部法律会阻止公司让员工工作超长的时间，比如所谓的\"996\"文化。<br><br>这部法律会带来一些大改变。公司必须遵守正常的八小时工作日，任何加班的人都要拿到合理的加班费。这样一来，大家就能有更多时间休息、陪家人。<br><br>我估计这部法律会很受欢迎，至少在普通打工人当中是这样。那么多人都被长工时累垮了，所以他们一定举双手欢迎。不过，一些老板可能就不太高兴了。<br><br>这个想法是我在看到朋友们工作压力多大之后冒出来的。他们当中有几个几乎没有工作以外的生活，这让我意识到这个问题有多严重。<br><br>我曾亲眼目睹过度劳累有多伤人——我一个最要好的朋友最后累到精疲力竭，健康严重受损。这样一部法律不仅能保护人们的时间，更能传递一个明确的信号：员工是人，而不是机器。从长远来看，得到充分休息、更快乐的员工，工作效率反而会更高。<br><br>还值得一提的是，已经有些公司主动朝这个方向转变，提供弹性工时和合理的加班费，据说员工流失率也因此下降了。在我看来，这恰恰证明这样一部法律不仅对员工有益——长远来看对企业也同样有利。<br><br>说实话，我对这件事感触很深。这样一部法律真的能提升人们的幸福感，营造更健康的工作与生活平衡。这就是为什么我觉得它值得被推行。",

      "a": "I'd like to talk about my childhood friend, whose name is Li Ming, who is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> someone that's been my best friend <mark class=\"idiom\">since we were little（从小）</mark>. We're about the same age and grew up in the same neighbourhood.<br><br>We first met when we were around six, <span class=\"conn\">because</span> our families lived <mark class=\"idiom\">in the same building（同一栋楼）</mark>. We went to the same primary school, <span class=\"conn\">so</span> we naturally <mark class=\"idiom\">became close（变得要好）</mark> and did pretty much everything together.<br><br><mark class=\"idiom\">Back then（那时候）</mark>, we used to play football after school, share snacks, and <span class=\"conn\">even</span> study together at weekends. <span class=\"conn\">During</span> the summer holidays, we'd spend whole days <mark class=\"idiom\">riding bikes（骑自行车）</mark> around the neighbourhood. Those were some of the happiest days of my childhood.<br><br>One memory that always makes me smile is the time we built a <mark class='idiom'>makeshift（临时搭的）</mark> tent in his backyard and stayed up half the night telling ghost stories. <span class='conn'>Even though</span> we scared ourselves silly, we couldn't stop laughing. <span class='conn'>No matter</span> how much time passes, we can still <mark class='idiom'>pick up right where we left off（聊起来毫无隔阂）</mark> whenever we meet.<br><br>Even now that we're both adults with busy lives, we still make a point of <mark class='idiom'>keeping in touch（保持联系）</mark>. Just last month, he travelled all the way back to our hometown for my birthday, and within minutes it felt like <mark class='idiom'>no time had passed at all（仿佛从未分开）</mark>. <span class='conn'>That kind of bond</span> — one that survives distance and years — is something I've come to realise is incredibly <mark class='idiom'>rare and precious（难得又珍贵）</mark>.<br><br>What made me like him most was his honesty and <mark class=\"idiom\">sense of humour（幽默感）</mark>. He was always <mark class=\"idiom\">there for me（在我身边支持我）</mark> <span class=\"conn\">whenever</span> I had problems, and he could make me laugh <span class=\"conn\">no matter</span> how bad my day was. <span class=\"conn\">That's why</span> our friendship has lasted so long.",
      "t": "我想谈谈我的发小，他叫李明，从小就是我最好的朋友。我们年纪差不多，又在同一个社区长大。<br><br>我们大概六岁时第一次认识，因为我们两家住在同一栋楼里。我们上了同一所小学，所以自然而然就变得要好，几乎什么都一起做。<br><br>那时候，我们放学后常一起踢球、分享零食，周末甚至还会一起学习。一到暑假，我们会花上一整天在社区里骑自行车。那是我童年里最快乐的一段日子。<br><br>有一段记忆总能让我会心一笑——那次我们在他家后院搭了个临时帐篷，熬到半夜讲鬼故事。虽然把自己吓得不行，却笑个不停。无论过去多久，每次见面我们都能立刻聊起来，毫无隔阂。<br><br>即便如今我们都已成年、各自忙碌，我们依然很在意保持联系。就在上个月，他大老远赶回家乡为我庆生，没几分钟就感觉仿佛我们从未分开过。这样一种能跨越距离和岁月的情谊，我渐渐意识到，是极其难得又珍贵的。<br><br>最让我喜欢他的，是他的真诚和幽默感。每当我遇到麻烦，他总会在我身边支持我；无论我那天过得多糟，他都能把我逗笑。这就是为什么我们的友谊能维持这么久。",

      "a": "The person I'd like to talk about is my cousin, who is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> someone hoping to <mark class=\"idiom\">build a career（发展事业）</mark> in <mark class=\"idiom\">the medical field（医疗行业）</mark>. I've known her my whole life, since we grew up in the same big family.<br><br>She started thinking about becoming a doctor <span class=\"conn\">when</span> she was in high school. Her grandfather got <mark class=\"idiom\">seriously ill（病得很重）</mark> back then, <span class=\"conn\">and</span> watching the doctors look after him really <mark class=\"idiom\">inspired her（激励了她）</mark>.<br><br>Right now she's <mark class=\"idiom\">studying medicine（学医）</mark> at university, and she hopes to become a <mark class=\"idiom\">paediatrician（儿科医生）</mark>. She says she'd love to work in a <mark class=\"idiom\">public hospital（公立医院）</mark> <span class=\"conn\">so</span> she can help as many people as possible.<br><br>What really shows her dedication is that she spends her holidays <mark class='idiom'>volunteering at（在……做志愿者）</mark> a local clinic, just to gain hands-on experience. <span class='conn'>She once</span> told me that even after a twelve-hour shift, seeing a patient <mark class='idiom'>get better（康复好转）</mark> makes it all worth it. <span class='conn'>Hearing</span> her speak with such passion, I've no doubt she'll make a <mark class='idiom'>caring and dedicated（有爱心又敬业的）</mark> doctor.<br><br>I remember one family gathering where she spent the whole evening <mark class='idiom'>patiently explaining（耐心解释）</mark> my grandmother's medication to her, drawing little diagrams so she'd understand. <span class='conn'>In that moment</span>, it really <mark class='idiom'>hit me（让我深有感触）</mark> that she was born for this kind of work. <span class='conn'>At first</span>, some relatives worried medicine would be too demanding, <span class='conn'>but</span> she never <mark class='idiom'>wavered（动摇）</mark>. <span class='conn'>If anything</span>, their doubts only made her more determined to prove she could <mark class='idiom'>handle the pressure（扛住压力）</mark>.<br><br>I think she's <mark class=\"idiom\">drawn to（被……吸引）</mark> this career <span class=\"conn\">because</span> she's always been caring and patient with others. She <span class=\"conn\">also</span> believes being a doctor is a meaningful job that can genuinely <mark class=\"idiom\">save lives（救死扶伤）</mark>. <span class=\"conn\">That's why</span> I really admire her choice.",
      "t": "我想谈谈我的表姐，她是一个希望在医疗行业发展事业的人。我从小就认识她，因为我们是在同一个大家庭里长大的。<br><br>她是在高中时开始考虑当医生的。那时候她的爷爷病得很重，看着医生们照顾他，真正激励了她。<br><br>现在她在大学学医，希望将来成为一名儿科医生。她说她很想在公立医院工作，这样就能帮助尽可能多的人。<br><br>真正体现她投入的，是她会利用假期去本地一家诊所做志愿者，只为积累实践经验。她曾告诉我，哪怕连上十二个小时的班，看到病人康复好转，就觉得一切都值了。听她那么有热情地谈起这些，我毫不怀疑她将来会成为一名既有爱心又敬业的好医生。<br><br>我记得有一次家庭聚会，她整晚都在耐心地给我奶奶讲解她的用药，还画了小图让她看懂。那一刻我深有感触——她天生就是干这行的料。起初，一些亲戚担心学医太辛苦，但她从未动摇。如果说有什么影响，那些质疑反而让她更坚定地想证明自己扛得住压力。<br><br>我觉得她之所以被这份职业吸引，是因为她一直对别人很有爱心、很有耐心。她也相信当医生是一份能真正救死扶伤的有意义的工作。这就是为什么我非常钦佩她的选择。",

      "a": "The person I'd like to talk about is my uncle, who is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> someone with a really <mark class=\"idiom\">successful business（成功的生意）</mark>. He runs a <mark class=\"idiom\">chain of（连锁的）</mark> hotpot restaurants in my hometown.<br><br>Since he's my mum's older brother, I've known him <mark class=\"idiom\">for as long as I can remember（从我记事起）</mark>. We usually catch up at <mark class=\"idiom\">family gatherings（家庭聚会）</mark> during the holidays.<br><br>He started the business about fifteen years ago, <span class=\"conn\">mainly because</span> he'd always been <mark class=\"idiom\">passionate about（热衷于）</mark> cooking. He began with one small restaurant, <span class=\"conn\">and</span> <span class=\"conn\">little by little</span> it grew into several <mark class=\"idiom\">branches（分店）</mark> across the city.<br><br>I still remember how tough the early days were — he once told me that in the first year he <mark class='idiom'>barely broke even（勉强保本）</mark> and worked almost every single day. <span class='conn'>What</span> really sets him apart, though, is how he treats his staff like family, which is <span class='conn'>why</span> many of them have <mark class='idiom'>stuck with him（一直追随他）</mark> for over a decade.<br><br>What I find most inspiring is a piece of advice he once gave me over dinner. He said that in business your <mark class='idiom'>reputation（口碑）</mark> is everything — it takes years to build but only seconds to <mark class='idiom'>destroy（毁掉）</mark>. <span class='conn'>That's why</span>, even when his costs went up, he refused to use cheaper ingredients. <span class='conn'>On top of that</span>, he's incredibly <mark class='idiom'>hands-on（亲力亲为）</mark>, still dropping by his restaurants most evenings to greet regular customers <mark class='idiom'>by name（直呼其名）</mark>. <span class='conn'>I think</span> it's this rare mix of high standards and genuine warmth that has kept his business <mark class='idiom'>thriving（蒸蒸日上）</mark> for all these years.<br><br>I think the business is successful <span class=\"conn\">because</span> he really <mark class=\"idiom\">cares about quality（注重质量）</mark> and treats his customers well. He never <mark class=\"idiom\">cuts corners（偷工减料）</mark> on ingredients, <span class=\"conn\">so</span> people keep coming back. <span class=\"conn\">That's why</span> his restaurants are always <mark class=\"idiom\">packed（座无虚席）</mark>.",
      "t": "我想谈的这个人是我舅舅，他是一个生意非常成功的人。他在我家乡经营着一连串连锁火锅店。<br><br>因为他是我妈妈的哥哥，所以从我记事起我就认识他了。我们通常在假期的家庭聚会上叙叙旧。<br><br>他大约十五年前开始做这门生意，主要是因为他一直热衷于烹饪。他从一家小餐馆起步，渐渐地发展成了遍布全市的好几家分店。<br><br>我还记得创业初期有多艰难——他曾跟我说，第一年几乎天天上班，也只是勉强保本。不过真正让他与众不同的，是他把员工当家人一样对待，这也是为什么很多员工一直追随他十多年。<br><br>最让我深受启发的，是他有次吃饭时给我的一句忠告。他说做生意，口碑就是一切——建立起来要花好多年，毁掉却只要几秒钟。正因如此，哪怕成本上涨，他也拒绝用更便宜的食材。除此之外，他还特别亲力亲为，大多数晚上仍会亲自到各家店里，直呼老顾客的名字打招呼。我觉得，正是这种高标准与真诚热情的难得结合，让他的生意这么多年来一直蒸蒸日上。<br><br>我觉得这门生意之所以成功，是因为他真的很注重质量，也善待顾客。他从不在食材上偷工减料，所以顾客会不断回头。这就是为什么他的店总是座无虚席。",

      "a": "I'd like to talk about a plan I had to change recently, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a weekend trip I'd <mark class=\"idiom\">arranged（安排好的）</mark> with my friends about a month ago.<br><br>We'd planned to go hiking in the mountains, <span class=\"conn\">but</span> the day before, the <mark class=\"idiom\">weather forecast（天气预报）</mark> suddenly turned bad. There were warnings of <mark class=\"idiom\">heavy rain（大雨）</mark>, <span class=\"conn\">so</span> we decided it just wasn't safe to go.<br><br><span class=\"conn\">Instead</span>, we changed our plan and spent the day in the city. We <mark class=\"idiom\">ended up（最后）</mark> visiting a museum and having a nice meal together, <span class=\"conn\">which</span> turned out to be really relaxing.<br><br>The museum we ended up in actually had a fascinating exhibition on ancient ceramics that I'd never have seen otherwise. <span class='conn'>Afterwards</span>, we found a cosy little restaurant and spent hours just <mark class='idiom'>catching up（叙旧聊天）</mark> over good food. <span class='conn'>Looking back</span>, that rainy day gave us something the hike never would have — a chance to slow down and really <mark class='idiom'>talk things through（好好聊聊）</mark>.<br><br>What I remember most is how the four of us <mark class='idiom'>huddled together（挤在一起）</mark> under one umbrella, laughing as we dashed between the museum and the restaurant in the pouring rain. <span class='conn'>Oddly enough</span>, the bad weather brought us closer than a sunny hike probably would have. <span class='conn'>Since then</span>, I've become a lot more <mark class='idiom'>easy-going（随和）</mark> about plans falling through, because I've learned that being able to <mark class='idiom'>roll with the punches（随机应变）</mark> often leads to moments you'd never have planned for. <span class='conn'>In fact</span>, some of my best memories have come from plans that <mark class='idiom'>went sideways（出了岔子）</mark>.<br><br><span class=\"conn\">At first</span> I was a bit disappointed, <span class=\"conn\">since</span> I'd been <mark class=\"idiom\">looking forward to（很期待）</mark> the hike. <span class=\"conn\">But</span> in the end, I realised the change was <mark class=\"idiom\">for the best（反而是好事）</mark>. Safety comes first, <span class=\"conn\">after all</span>.",
      "t": "我想谈谈最近我不得不改变的一个计划——大约一个月前我和朋友们安排好的一次周末出游。<br><br>我们本来计划去山里徒步，但出发前一天，天气预报突然变差。有大雨预警，所以我们觉得去实在不安全。<br><br>于是我们改了计划，在城里度过了这一天。我们最后去逛了博物馆，还一起吃了顿不错的饭，结果发现这样反而很放松。<br><br>我们最后去的那家博物馆，居然有一个关于古代陶瓷的精彩展览，不然我根本没机会看到。之后我们找了家温馨的小餐馆，一边享用美食一边叙旧聊天，待了好几个小时。回头想想，那个雨天反而给了我们徒步给不了的东西——一个慢下来、好好聊聊的机会。<br><br>我印象最深的，是我们四个人挤在一把伞下，冒着倾盆大雨在博物馆和餐馆之间狂奔，一路笑个不停。说来也怪，这场坏天气反而让我们比晴天去徒步更亲近。从那以后，我对计划落空变得随和多了，因为我懂得了，能够随机应变，往往会带来一些你根本计划不出来的时刻。事实上，我不少最美好的回忆，都来自那些出了岔子的计划。<br><br>一开始我有点失望，因为我一直很期待那次徒步。但最后我意识到，这个改变反而是好事。毕竟，安全第一。",

      "a": "I'd like to talk about a time when I worked in a group, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a class project we did in my final year at university.<br><br>I worked with four classmates, <span class=\"conn\">and</span> our task was to design a marketing plan for a local café. I was mainly <mark class=\"idiom\">in charge of（负责）</mark> doing the research and <mark class=\"idiom\">putting together the slides（制作幻灯片）</mark>.<br><br>The biggest problem we faced was that everyone had different ideas, <span class=\"conn\">so</span> <span class=\"conn\">at first</span> it was hard to <mark class=\"idiom\">agree on a direction（统一方向）</mark>. We <span class=\"conn\">also</span> struggled a bit with time, <span class=\"conn\">since</span> everyone was busy with other <mark class=\"idiom\">coursework（课业）</mark>.<br><br>The turning point came when we finally sat down together and let everyone <mark class='idiom'>have their say（畅所欲言）</mark> before voting on a direction. <span class='conn'>Once</span> we'd agreed, things moved much faster, and we even started <mark class='idiom'>bouncing ideas off each other（互相激发灵感）</mark>. <span class='conn'>By the end</span>, what had felt like a stressful clash turned into one of the most <mark class='idiom'>rewarding（有成就感的）</mark> projects I've done.<br><br>One moment that really tested us was when two members <mark class='idiom'>clashed over（在……上起争执）</mark> the final design just two days before the deadline. <span class='conn'>Rather than</span> letting it <mark class='idiom'>blow up（闹大）</mark>, I suggested we each list our concerns on a whiteboard and vote, which quickly <mark class='idiom'>cleared the air（化解了矛盾）</mark>. <span class='conn'>Looking back</span>, that project taught me that teamwork isn't about everyone agreeing — it's about knowing how to <mark class='idiom'>handle disagreements（处理分歧）</mark> calmly. <span class='conn'>Ever since</span>, I've felt far more confident working with people whose ideas <mark class='idiom'>clash with（与……冲突）</mark> my own.<br><br>We worked as a group <span class=\"conn\">because</span> the project was simply too big for one person to <mark class=\"idiom\">handle（应付）</mark>. <span class=\"conn\">In the end</span>, by dividing the tasks and communicating well, we <mark class=\"idiom\">pulled it off（顺利搞定了）</mark> and got a great mark. <span class=\"conn\">That's why</span> I now really value teamwork.",
      "t": "我想谈谈一次我在团队里工作的经历——那是我大学最后一年做的一个课堂项目。<br><br>我和四位同学一组，我们的任务是为一家本地咖啡馆设计一份营销方案。我主要负责做调研和制作幻灯片。<br><br>我们遇到的最大问题是每个人想法都不一样，所以一开始很难统一方向。我们在时间上也有点吃紧，因为大家都忙着别的课业。<br><br>转折点出现在我们终于坐下来、让每个人都先畅所欲言，再投票决定方向的时候。一旦达成一致，事情推进得就快多了，我们甚至开始互相激发灵感。到最后，原本像是一场充满压力的意见冲突，反而变成了我做过的最有成就感的项目之一。<br><br>有一个真正考验我们的时刻，是截止日期前两天，两位组员在最终方案上起了争执。我没有让它闹大，而是建议大家把各自的顾虑写在白板上、然后投票，这很快就化解了矛盾。回头想想，那个项目让我明白，团队合作其实不在于人人意见一致——而在于懂得如何冷静地处理分歧。从那以后，和那些想法与我相左的人共事时，我自信多了。<br><br>我们之所以组队，是因为这个项目对一个人来说实在太大了，应付不来。最后，靠着分工和良好的沟通，我们顺利搞定了，还拿了高分。这就是为什么我现在非常重视团队合作。",

      "a": "I'd like to talk about an important decision I made, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> choosing my <mark class=\"idiom\">major（专业）</mark> when I started university.<br><br>It wasn't an easy decision. I spent weeks <mark class=\"idiom\">looking into（深入了解）</mark> different subjects, talking to teachers and asking people already working in those fields. <span class=\"conn\">In the end</span>, I went with business management, <span class=\"conn\">because</span> it matched both my interests and <mark class=\"idiom\">the job market（就业市场）</mark>.<br><br>Looking back, it <mark class=\"idiom\">turned out（结果证明）</mark> to be a great choice. I really enjoy what I'm studying, <span class=\"conn\">and</span> it's opened up a lot of <mark class=\"idiom\">internship opportunities（实习机会）</mark> for me.<br><br>What finally <mark class='idiom'>tipped the balance（让我下定决心）</mark> was a long chat with a family friend who actually works in the field. He gave me an honest, <mark class='idiom'>behind-the-scenes（幕后真实的）</mark> picture of what the job is really like, both good and bad. <span class='conn'>Thanks to</span> that talk, I felt I was choosing with my eyes wide open, rather than just <mark class='idiom'>following the crowd（随大流）</mark>.<br><br>I won't pretend I never had second thoughts. There was a stretch in my second year when the coursework felt <mark class='idiom'>dry and overwhelming（枯燥又压得人喘不过气）</mark>, and I quietly wondered whether I'd <mark class='idiom'>made the wrong call（选错了）</mark>. <span class='conn'>But</span> once I started landing internships and seeing the theory applied in the real world, those doubts <mark class='idiom'>faded away（烟消云散）</mark>. <span class='conn'>These days</span>, whenever a younger student asks me for advice, I tell them the same thing: <mark class='idiom'>do your homework（做足功课）</mark> before you commit, but once you've decided, <mark class='idiom'>give it your all（全力以赴）</mark> and don't keep looking back.<br><br>This decision was important <span class=\"conn\">because</span> it basically shaped my whole <mark class=\"idiom\">career path（职业道路）</mark>. A wrong choice could have meant years of studying something I disliked. <span class=\"conn\">That's why</span> I'm really glad I <mark class=\"idiom\">took my time（没急着做决定）</mark> with it.",
      "t": "我想谈谈我做过的一个重要决定——也就是上大学时选专业。<br><br>这不是个容易的决定。我花了好几周深入了解不同的专业，找老师聊，还请教了已经在那些领域工作的人。最后我选了工商管理，因为它既符合我的兴趣，也符合就业市场。<br><br>现在回头看，结果证明这是个很棒的选择。我很喜欢自己学的内容，它也为我带来了很多实习机会。<br><br>真正让我下定决心的，是和一位在这个行业工作的家庭朋友的一次长谈。他给我描绘了一幅诚实、幕后的真实图景，告诉我这份工作到底是什么样，好的坏的都有。多亏了那次交流，我才觉得自己是睁大眼睛、想清楚了才做的选择，而不是单纯随大流。<br><br>我不会假装自己从没动摇过。大二有那么一段时间，课程枯燥又压得人喘不过气，我暗暗怀疑自己是不是选错了。但当我开始拿到实习、看到理论如何在现实中应用时，那些疑虑都烟消云散了。如今，每当有学弟学妹来问我建议，我总会跟他们说同一句话：决定之前先做足功课，但一旦定下来，就全力以赴，别再回头张望。<br><br>这个决定之所以重要，是因为它基本上塑造了我整条职业道路。选错的话，可能意味着好几年都在学自己不喜欢的东西。这就是为什么我很庆幸自己当时没急着做决定。",

      "a": "I'd like to talk about a live sports event I really enjoyed, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a professional basketball game I watched a couple of years ago.<br><br>It was a CBA match held at a big <mark class=\"idiom\">arena（体育馆）</mark> in my city. I went on a Saturday evening, <span class=\"conn\">and</span> the whole place was completely <mark class=\"idiom\">packed（挤满人的）</mark> with <mark class=\"idiom\">cheering fans（欢呼的球迷）</mark>.<br><br>I went with a few close friends who are all <mark class=\"idiom\">huge basketball fans（铁杆篮球迷）</mark>. We'd booked the tickets weeks <mark class=\"idiom\">in advance（提前）</mark>, <span class=\"conn\">so</span> we were all really excited about it.<br><br>The best moment came right at the end, when the home team was <mark class='idiom'>trailing by（落后……分）</mark> two points with seconds left on the clock. Their star player hit a <mark class='idiom'>buzzer-beater（压哨绝杀）</mark> three-pointer, and the whole arena <mark class='idiom'>erupted（瞬间沸腾）</mark>. <span class='conn'>Total</span> strangers were hugging and high-fiving, and I found myself screaming along with everyone else.<br><br>Even before the game started, the atmosphere outside the arena was electric — fans in matching jerseys were chanting and vendors were selling team scarves, and you could feel the <mark class='idiom'>buzz in the air（热烈的气氛）</mark>. During halftime there was a cheerleading show and a fan shooting contest, so there was never a dull moment. <span class='conn'>What</span> surprised me most was how the whole crowd <mark class='idiom'>moved as one（如同一体）</mark> — when our team scored, thousands of people jumped up at the exact same instant. <span class='conn'>On the way home</span>, my friends and I couldn't stop <mark class='idiom'>reliving（回味）</mark> the best moments, replaying that final shot over and over. <span class='conn'>It struck me</span> that watching sport live is as much about the shared energy of the crowd as the game itself.<br><br>I loved it <span class=\"conn\">because</span> the atmosphere was absolutely <mark class=\"idiom\">electric（热烈到极点）</mark> — nothing like watching on TV. Being there <mark class=\"idiom\">in person（亲临现场）</mark>, hearing the crowd <mark class=\"idiom\">roar（呐喊）</mark> at every score, gave me goosebumps. <span class=\"conn\">That's why</span> it's a night I'll never forget.",
      "t": "我想谈谈一场我特别享受的现场体育赛事——那是几年前我看的一场职业篮球比赛。<br><br>那是一场在我所在城市一座大体育馆里举行的 CBA 比赛。我是周六晚上去的，整个场馆挤满了欢呼的球迷。<br><br>我和几个铁杆篮球迷的好朋友一起去的。我们提前好几周就订了票，所以大家都非常兴奋。<br><br>最精彩的一刻出现在比赛末段，主队在还剩几秒时落后两分。他们的当家球星投进了一记压哨绝杀三分，整个体育馆瞬间沸腾了。素不相识的陌生人互相拥抱、击掌，我也忍不住跟着大家一起放声呐喊。<br><br>比赛还没开始，场馆外的气氛就已经热烈到极点——穿着统一球衣的球迷在齐声呐喊，小贩在卖球队围巾，你能真切感受到空气里那股热烈的气氛。中场休息时还有啦啦队表演和球迷投篮比赛，全程没有一刻冷场。最让我意外的是，全场观众如同一体——当我们的球队得分时，成千上万人在同一瞬间齐刷刷跳了起来。回去的路上，我和朋友们不停地回味那些最精彩的瞬间，把最后那记绝杀一遍遍重放。我突然意识到，看现场比赛，靠的既是比赛本身，也是全场观众共享的那股能量。<br><br>我之所以爱这场比赛，是因为现场气氛热烈到极点——和在电视上看完全不一样。亲临现场，听到每一次得分时全场的呐喊，让我起了一身鸡皮疙瘩。这就是为什么那是我永远忘不了的一晚。",
      "p3": [
        {
          "q": "Why do some people like to watch sports events?",

        {

          "a": "Most people watch at home on TV or on their phones, since it's the most convenient. Some go to stadiums for the live experience, while others gather in bars or cafés to watch together. It really depends on the occasion and the budget.",

        {

      "a": "I'd like to talk about a food that people eat on special occasions, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> dumplings, or jiaozi, which we eat during Chinese New Year.<br><br>The special occasion is <mark class=\"idiom\">Spring Festival（春节）</mark>, the most important holiday in China. On New Year's Eve, families <mark class=\"idiom\">get together（团聚）</mark> and make dumplings as part of the celebration.<br><br>Making them is quite a process. We mix <mark class=\"idiom\">minced meat（肉馅）</mark> and vegetables for the <mark class=\"idiom\">filling（馅料）</mark>, wrap it in <mark class=\"idiom\">thin dough（薄面皮）</mark>, <span class=\"conn\">and then</span> boil or steam them. The best part is that the whole family makes them together.<br><br>One little tradition I love is that we hide a single clean coin inside one of the dumplings, and <span class='conn'>whoever</span> bites into it is said to have <mark class='idiom'>good fortune（好运）</mark> for the whole year. <span class='conn'>Every year</span>, the whole family gathers round the table, <mark class='idiom'>chatting and laughing（有说有笑）</mark> while the Spring Festival Gala plays in the background.<br><br>Some of my warmest childhood memories are of standing on a stool next to my grandmother, clumsily trying to <mark class='idiom'>pleat the dumplings（捏饺子褶）</mark> while she gently corrected me. Mine always <mark class='idiom'>fell apart（散开）</mark> in the pot, but nobody ever minded. <span class='conn'>Now that</span> I'm older and often away from home, sitting down to a plate of homemade dumplings instantly <mark class='idiom'>takes me back（把我带回）</mark> to those evenings. <span class='conn'>For me</span>, the taste isn't really about the food at all — it's about family, warmth, and <mark class='idiom'>a sense of belonging（归属感）</mark>.<br><br>People eat dumplings at this time <span class=\"conn\">because</span> their shape looks like old Chinese <mark class=\"idiom\">gold ingots（金元宝）</mark>, <span class=\"conn\">so</span> they're <mark class=\"idiom\">a symbol of（……的象征）</mark> wealth and good luck. <span class=\"conn\">More than that</span>, making them together is a lovely way to <mark class=\"idiom\">bond（增进感情）</mark> as a family. <span class=\"conn\">That's why</span> it's such a meaningful tradition.",
      "t": "我想谈谈一种人们在特别场合吃的食物——饺子，也就是我们在春节时吃的 jiaozi。<br><br>这个特别的场合是春节，中国最重要的节日。在除夕夜，家人会团聚在一起，包饺子作为庆祝的一部分。<br><br>包饺子是个挺讲究的过程。我们把肉馅和蔬菜拌在一起做馅，用薄薄的面皮包起来，然后煮或蒸。最棒的部分是全家人一起包。<br><br>我特别喜欢的一个小传统是：我们会在其中一个饺子里藏一枚干净的硬币，据说谁吃到它，这一整年就会有好运。每年全家人都围坐在桌旁，有说有笑，背景音里放着春晚。<br><br>我童年里一些最温暖的记忆，就是站在小板凳上挨着奶奶，笨手笨脚地学着捏饺子褶，她则在一旁轻声纠正我。我包的饺子一下锅总是散开，但从来没人介意。如今我长大了、又常常不在家，坐下来吃一盘家里包的饺子，会立刻把我带回那些夜晚。对我来说，那味道其实跟食物本身没多大关系——它关乎家人、温暖，和一种归属感。<br><br>人们在这个时候吃饺子，是因为它的形状像古代中国的金元宝，所以它是财富和好运的象征。更重要的是，一起包饺子是家人增进感情的好方式。这就是为什么它是一项如此有意义的传统。",
      "p3": [
        {
          "q": "Why are there special foods on special occasions or events?",
          "a": "I think it's mostly about tradition and meaning. Many special foods carry symbolic wishes, like luck or reunion, which makes the occasion feel more meaningful. They also help bring families together and pass culture down through generations.",
          "t": ""
        },
        {
          "q": "What are the differences between everyday food and festival food?",
          "a": "Festival food is usually more special and elaborate. It often takes longer to prepare and carries cultural meaning, whereas everyday food is simpler and focuses on convenience. Festival meals are also typically shared with family and friends.",
          "t": ""
        },
        {
          "q": "Are there any differences between the food people eat today and the food people ate in the past?",
          "a": "Yes, quite a lot. People today have access to a much wider variety of food from all over the world. We also eat more processed and fast food, while in the past meals were simpler and mostly home-cooked with local ingredients.",
          "t": ""

        {
          "q": "Do people today prefer eating at home or in a restaurant?",

          "t": ""

      "ztitle": "擅长学习和说语言的人",

      ],
      "a": "I'd like to talk about a friend of mine called Anna, who is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> <mark class=\"idiom\">amazingly good at（极其擅长）</mark> learning languages. We got to know each other in our first year at university, since we lived in the same <mark class=\"idiom\">dormitory（宿舍）</mark>.<br><br>She learns languages in a really smart way. <span class=\"conn\">Instead of</span> just <mark class=\"idiom\">memorising vocabulary（死背单词）</mark>, she watches foreign films, listens to podcasts and chats with <mark class=\"idiom\">native speakers（母语者）</mark> online. She basically <mark class=\"idiom\">surrounds herself with（让自己沉浸在）</mark> the language.<br><br>She's <mark class=\"idiom\">fluent in（精通）</mark> English and Japanese, <span class=\"conn\">and</span> she's now <mark class=\"idiom\">picking up（开始学）</mark> Korean as well. Honestly, she seems to learn a new language every couple of years.<br><br>I'll never forget travelling with her once and watching her <mark class='idiom'>strike up a conversation（主动攀谈）</mark> with a Japanese tourist as if they were old friends. <span class='conn'>Within minutes</span> they were laughing together, while I just stood there <mark class='idiom'>in awe（佩服得不行）</mark>. <span class='conn'>Watching</span> her, I realised her real gift isn't memory — it's her fearlessness about <mark class='idiom'>making mistakes（犯错）</mark>.<br><br>What's more, her habits have genuinely <mark class='idiom'>rubbed off on（潜移默化地影响）</mark> me. After watching how she learns, I started <mark class='idiom'>following her lead（照着她的方法做）</mark> — switching my phone to English, watching shows without subtitles, and forcing myself to speak even when I make mistakes. <span class='conn'>Funnily enough</span>, my own English improved far faster once I stopped being <mark class='idiom'>afraid of looking silly（怕出丑）</mark>. <span class='conn'>She always says</span> a language is a tool you <mark class='idiom'>pick up by using（在使用中掌握）</mark>, not something you master by sitting and memorising. <span class='conn'>Honestly</span>, that single piece of advice has changed how I approach learning anything new.<br><br>I really admire her for this. Her ability shows that learning a language is more about <mark class=\"idiom\">consistency（持之以恒）</mark> and passion than talent. <span class=\"conn\">That's why</span> she's always been a huge <mark class=\"idiom\">inspiration（激励）</mark> to me.",
      "t": "我想谈谈我的一个朋友，她叫 Anna，极其擅长学语言。我们是大一时认识的，因为住在同一间宿舍。<br><br>她学语言的方法很聪明。她不是单纯死背单词，而是看外语电影、听播客，还在网上和母语者聊天。她基本上是把自己整个沉浸在那门语言里。<br><br>她精通英语和日语，现在还在学韩语。说实话，她好像每隔几年就会学会一门新语言。<br><br>我永远忘不了有一次和她一起旅行，看着她主动和一位日本游客攀谈起来，俩人就像老朋友一样。没几分钟他们就有说有笑，而我只能站在一旁佩服得不行。看着她，我才明白她真正的天赋不是记性好，而是她不怕犯错、敢于张口的那股劲儿。<br><br>更重要的是，她的习惯真的潜移默化地影响了我。看了她的学习方式后，我开始照着她的方法做——把手机调成英文、看剧不开字幕、逼自己开口哪怕会犯错。说来有趣，自从我不再怕出丑，我的英语反而进步得快多了。她总说，语言是一种在使用中掌握的工具，而不是靠枯坐死记就能学会的东西。说实话，单是这一句忠告，就改变了我学任何新东西的方式。<br><br>我真的很钦佩她这一点。她的能力说明，学好一门语言更多靠的是持之以恒和热情，而不是天赋。这就是为什么她一直是给我很大激励的人。",
      "p3": [
        {
          "q": "Are there many people who can speak foreign languages in your country?",
          "a": "Yes, more and more these days. Most young people learn English at school, so a lot of them can communicate at a basic level. In big cities especially, it's becoming quite common to meet people who speak two or more languages.",
          "t": ""

        {
          "q": "Does speaking other languages help at work?",
          "a": "Definitely, it's a big advantage. Being able to speak a foreign language opens up more job opportunities and makes communicating with international clients much easier. In many companies, it can even lead to better pay and promotion.",

        {
          "q": "Do people learn any languages other than English?",

        {
          "q": "Why is it easier for children to learn new things than for adults?",

          "q": "How do people learn new things?",
          "a": "People learn in many different ways. Some prefer reading and studying theory, while others learn best by doing things hands-on. Nowadays, a lot of people also turn to online videos and apps, which make learning more flexible and accessible.",

        },
        {

          "a": "In my opinion, consistency matters most. Practising a little every day is far more effective than cramming occasionally. It also helps a lot to use the language in real situations, since that's how it really sticks.",

    {
      "id": "s26p2_44",
      "tag": "保留题",
      "region": "mainland",
      "emoji": "💻",
      "ztitle": "遇到的科技问题",
      "describe": "Describe a challenging technological problem you faced",
      "shouldsay": [

        "And explain how you solved it"
      ],
      "a": "I'd like to talk about a challenging tech problem I once faced, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> my laptop suddenly <mark class=\"idiom\">crashing（死机崩溃）</mark> right before an important <mark class=\"idiom\">deadline（截止时间）</mark>.<br><br>It happened during my final year at university, late one night while I was finishing an essay in my dorm. The screen just <mark class=\"idiom\">froze（卡死）</mark>, <span class=\"conn\">and then</span> it <mark class=\"idiom\">shut down（关机）</mark> completely and wouldn't turn back on.<br><br>It was really <mark class=\"idiom\">stressful（让人崩溃的）</mark>, <span class=\"conn\">because</span> the essay was due the next morning and I hadn't saved my latest changes. I <mark class=\"idiom\">panicked（慌了）</mark> <span class=\"conn\">at first</span>, thinking I'd lost hours of work.<br><br>Those few hours waiting for it to restart felt like an eternity, and I kept imagining having to <mark class='idiom'>start from scratch（从头再来）</mark>. <span class='conn'>Ever since</span> that night, I've become almost <mark class='idiom'>obsessive about（极度执着于）</mark> backing up my work, saving everything to the cloud automatically. <span class='conn'>In a strange way</span>, that stressful experience taught me a lesson I'll never forget.<br><br>Looking back, the way I <mark class='idiom'>kept my cool（保持冷静）</mark> still surprises me. After the initial panic, I forced myself to <mark class='idiom'>take a deep breath（深吸一口气）</mark> and think logically instead of frantically pressing buttons. I searched online on my phone, found a forum thread describing the exact same issue, and followed the steps one by one. <span class='conn'>When</span> the screen finally <mark class='idiom'>flickered back to life（重新亮起）</mark>, I almost shouted with relief. <span class='conn'>More than the essay</span>, what that night really taught me was how to <mark class='idiom'>stay calm under pressure（在压力下保持冷静）</mark> — a skill that's helped me in plenty of stressful situations since.<br><br>Luckily, I managed to fix it <span class=\"conn\">by</span> searching online for solutions and restarting it in <mark class=\"idiom\">safe mode（安全模式）</mark>. <span class=\"conn\">To my relief</span>, most of my work had been <mark class=\"idiom\">auto-saved（自动保存了）</mark>. <span class=\"conn\">So</span> in the end, I handed the essay in on time.",
      "t": "我想谈谈我曾遇到的一个棘手的科技问题——我的笔记本电脑在一个重要截止时间前突然死机崩溃了。<br><br>那是在我大学最后一年，某天深夜我正在宿舍里赶一篇论文。屏幕一下子卡死了，然后彻底关机，再也开不了机。<br><br>那真的让人很崩溃，因为论文第二天早上就要交，而我还没保存最新的改动。我一开始慌了，以为自己几个小时的努力都白费了。<br><br>等它重启的那几个小时，简直像过了一个世纪，我脑子里一直在想是不是得从头再来。从那晚以后，我对备份文件几乎到了执着的地步，所有东西都会自动存到云端。说来也怪，那次让人崩溃的经历，反倒给我上了一堂永远忘不了的课。<br><br>现在回想，我当时能保持冷静这点，自己都还觉得意外。最初的慌乱过后，我强迫自己深吸一口气、按逻辑思考，而不是一味地乱按键。我用手机上网，找到一个论坛帖子，描述的正是一模一样的问题，于是一步步照着做。当屏幕终于重新亮起的那一刻，我激动得差点喊出声来。比起那篇论文，那一晚真正教会我的，是如何在压力下保持冷静——这项本领后来在许多紧张的情境里都帮到了我。<br><br>幸好，我靠着上网搜解决办法、用安全模式重启，把它修好了。让我松了口气的是，我大部分内容都被自动保存了。所以最后，我还是按时交了论文。",
      "p3": [
        {
          "q": "What are the advantages and disadvantages of AI?",
          "a": "AI has plenty of advantages — it saves time, boosts efficiency and can handle tasks that are too complex for humans. On the downside, it may replace some jobs and make people overly dependent on it. So like any tool, it's really about how we use it.",
          "t": ""
        },
        {
          "q": "Do you think people today should learn about AI technology?",
          "a": "Yes, I'd say it's becoming essential. AI is already part of our daily lives, from phones to workplaces, so understanding it helps people stay competitive. At the very least, knowing the basics keeps you from being left behind.",
          "t": ""
        },
        {
          "q": "Should children learn to use AI?",
          "a": "I think so, but in a balanced way. Learning to use AI tools can boost their creativity and prepare them for the future. However, they should still build basic skills themselves first, so they don't rely on it too heavily.",
          "t": ""
        },
        {
          "q": "How can AI help in our lives?",
          "a": "AI helps in so many ways. It powers things like voice assistants, navigation, online recommendations and even medical diagnosis. Basically, it makes daily tasks faster and more convenient, freeing up our time for more important things.",
          "t": ""
        },

      "a": "I'd like to talk about an advertisement that <mark class=\"idiom\">features（由……出演）</mark> a famous person, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a <mark class=\"idiom\">sportswear（运动服饰）</mark> ad starring a well-known basketball player.<br><br>You can see it pretty much everywhere — on TV, on social media, <span class=\"conn\">and</span> <span class=\"conn\">even</span> on huge <mark class=\"idiom\">billboards（广告牌）</mark> in shopping centres. It seems to <mark class=\"idiom\">pop up（冒出来）</mark> every time a new pair of <mark class=\"idiom\">trainers（运动鞋）</mark> is released.<br><br>The ad shows the athlete training hard <span class=\"conn\">and then</span> pulling off amazing moves <mark class=\"idiom\">on the court（在球场上）</mark>, all <span class=\"conn\">while</span> wearing the brand's shoes. The message is basically that their products can help you <mark class=\"idiom\">push your limits（突破极限）</mark>.<br><br>What makes it so effective, I think, is the slogan at the very end — short, punchy and <mark class='idiom'>sticks in your head（让人念念不忘）</mark>. <span class='conn'>I have to admit</span>, the first time I saw it, I genuinely <mark class='idiom'>felt the urge to（很想）</mark> go out and buy those trainers myself. <span class='conn'>That's</span> the power of good advertising — it sells you a feeling, not just a product.<br><br>It also got me thinking about how powerful <mark class='idiom'>celebrity endorsements（名人代言）</mark> really are. A couple of my friends actually bought the exact shoes from that ad, half-joking that they'd <mark class='idiom'>play better（打得更好）</mark> wearing them. <span class='conn'>Of course</span>, deep down we all know a pair of trainers won't turn us into a pro athlete. <span class='conn'>Still</span>, that's the clever part — the ad sells a dream, not just a product. <span class='conn'>These days</span> I try to <mark class='idiom'>take such ads with a pinch of salt（对这类广告半信半疑）</mark>, enjoying them for what they are while reminding myself what they're really designed to do.<br><br>Honestly, I think it's really well made and quite <mark class=\"idiom\">inspiring（鼓舞人心的）</mark>. Using a famous athlete makes the brand look professional and <mark class=\"idiom\">trustworthy（值得信赖的）</mark>. <span class=\"conn\">That said</span>, I'm aware it's designed to make me spend money, <span class=\"conn\">so</span> I try not to <mark class=\"idiom\">be fooled by（被忽悠）</mark> it.",
      "t": "我想谈谈一个由名人出演的广告——一支由一位知名篮球运动员主演的运动服饰广告。<br><br>你几乎到处都能看到它——电视上、社交媒体上，甚至商场里巨大的广告牌上。似乎每次出新款球鞋，它就会冒出来。<br><br>这个广告展示了这位运动员刻苦训练、然后在球场上做出各种精彩动作，而且全程都穿着这个品牌的鞋。它传达的信息基本上就是：他们的产品能帮你突破极限。<br><br>我觉得它之所以这么有效，关键在于片尾那句广告词——简短、有力，让人念念不忘。我得承认，第一次看到它的时候，我是真的很想立马出门给自己买双那款鞋。这就是好广告的厉害之处——它卖给你的是一种感觉，而不只是一件产品。<br><br>它也让我开始思考，名人代言到底有多大威力。我有几个朋友真的照着那条广告买了同款鞋，还半开玩笑地说穿上它们就能打得更好。当然，我们心里都清楚，一双球鞋并不会把我们变成职业运动员。但这恰恰是它高明的地方——这广告卖的是一个梦，而不只是一件产品。如今我会对这类广告半信半疑，一边欣赏它们本身的精彩，一边提醒自己它们真正的目的是什么。<br><br>说实话，我觉得它做得非常好，也挺鼓舞人心的。用一位知名运动员让这个品牌显得专业又值得信赖。话虽如此，我清楚它就是为了让我花钱设计的，所以我尽量不被它忽悠。",
      "p3": [
        {
          "q": "What are the advantages and disadvantages of advertisements?",
          "a": "On the plus side, ads inform us about new products and help businesses reach customers. On the downside, they can be misleading and push people to buy things they don't really need. So they're useful, but we have to stay critical.",
          "t": ""

        {
          "q": "Why are many advertisements endorsed by celebrities? How useful are they?",
          "a": "Brands use celebrities because their fame and image grab attention instantly and build trust. When fans see their idol using a product, they're more likely to buy it. They can be very effective, though it sometimes backfires if the celebrity gets into a scandal.",

        },

          "q": "What is the most important factor in an advertisement?",
          "a": "In my opinion, the message has to be clear and memorable. No matter how flashy an ad is, it fails if people can't remember the product. Emotional appeal also matters a lot, since ads that make us feel something tend to stick.",

      "a": "I'd like to talk about a place I'd really recommend to others, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> Dali, a beautiful <mark class=\"idiom\">old town（古城）</mark> in Yunnan Province.<br><br>It's <mark class=\"idiom\">in the southwest of（在……的西南部）</mark> China, sitting right between a huge lake and <mark class=\"idiom\">a range of mountains（一片群山）</mark>. The scenery there is absolutely <mark class=\"idiom\">stunning（绝美的）</mark>.<br><br>When I visited, I <mark class=\"idiom\">cycled around（骑行环游）</mark> Erhai Lake, <mark class=\"idiom\">wandered through（闲逛）</mark> the old streets, <span class=\"conn\">and</span> tried lots of <mark class=\"idiom\">local snacks（当地小吃）</mark>. I <span class=\"conn\">also</span> chatted with some friendly locals from the Bai ethnic group, <span class=\"conn\">which</span> was <mark class=\"idiom\">a real highlight（一大亮点）</mark>.<br><br>One evening really <mark class='idiom'>stands out（让我难忘）</mark> — I sat by the lake watching the sun set behind the mountains, with the water turning gold and distant temple bells ringing softly. <span class='conn'>In that moment</span>, I felt completely <mark class='idiom'>at one with（与……融为一体）</mark> nature. <span class='conn'>Even</span> the little guesthouse I stayed in had a cosy courtyard where the owner brewed local tea for guests every night.<br><br>One afternoon really <mark class='idiom'>sums up（概括了）</mark> why I love the place. I wandered into a local market where Bai women in traditional dress were selling fresh flowers, handmade cheese and wild mushrooms, and the whole place was <mark class='idiom'>bursting with colour（色彩缤纷）</mark> and life. <span class='conn'>Unlike</span> some of China's more famous tourist towns, which can feel <mark class='idiom'>overrun and commercialised（被游客挤爆、过度商业化）</mark>, Dali still <mark class='idiom'>holds on to（保留着）</mark> its authentic charm. <span class='conn'>I think</span> that's exactly why it suits travellers who'd rather <mark class='idiom'>soak up the atmosphere（沉浸在氛围里）</mark> than just tick off famous sights.<br><br>I'd recommend it <span class=\"conn\">because</span> it has <mark class=\"idiom\">the perfect mix of（……的完美结合）</mark> natural beauty and rich culture, without being too crowded. It's a great place to <mark class=\"idiom\">slow down（慢下来）</mark> and relax. <span class=\"conn\">That's why</span> I think everyone should visit it at least once.",
      "t": "我想谈谈一个我特别想推荐给别人的地方——大理，云南省一座美丽的古城。<br><br>它位于中国的西南部，正好夹在一个大湖和一片群山之间。那里的景色简直绝美。<br><br>我去的时候，骑车环游了洱海、在古街上闲逛，还尝了很多当地小吃。我还和一些友好的白族当地人聊了聊，这是一大亮点。<br><br>有一个傍晚特别让我难忘——我坐在湖边，看着夕阳落到群山背后，湖水被染成金色，远处的寺庙钟声轻轻回荡。那一刻，我感到自己完全与大自然融为一体。就连我住的那家小客栈也有个温馨的小院子，老板每天晚上都会为客人煮当地的茶。<br><br>有一个下午，恰好概括了我爱这地方的原因。我溜达进一个当地集市，身着传统服饰的白族妇女在卖鲜花、手工奶酪和野生菌，整个市场色彩缤纷、充满生机。不像国内一些更出名的旅游古镇那样被游客挤爆、过度商业化，大理依然保留着它那份原汁原味的魅力。我觉得，这正是它为什么适合那些宁愿沉浸在氛围里、也不愿只是打卡名胜的旅行者。<br><br>我之所以推荐它，是因为它把自然美景和深厚文化完美结合，又不会太拥挤。它是个让你慢下来、放松身心的好地方。这就是为什么我觉得每个人都该去一次。",

      "a": "I'd like to talk about a home I love visiting but wouldn't want to live in, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> my friend's grandparents' house, <mark class=\"idiom\">out in the countryside（在乡下）</mark>.<br><br>It's a traditional <mark class=\"idiom\">courtyard house（带院子的老房子）</mark> with a big garden, <mark class=\"idiom\">surrounded by（被……环绕）</mark> fields and trees. Inside, it's full of old wooden furniture that gives it a really <mark class=\"idiom\">cosy, old-fashioned feel（温馨怀旧的感觉）</mark>.<br><br>I love visiting <span class=\"conn\">because</span> it's so peaceful and <mark class=\"idiom\">a world away from（与……截然不同）</mark> the noisy city. <span class=\"conn\">Whenever</span> I go, I can <mark class=\"idiom\">breathe fresh air（呼吸新鲜空气）</mark>, pick vegetables from the garden, <span class=\"conn\">and</span> just completely <mark class=\"idiom\">switch off（彻底放松）</mark>.<br><br>I particularly love visiting in autumn, when the whole courtyard fills with the smell of <mark class='idiom'>ripe fruit（成熟的果子）</mark> and you can hear nothing but birdsong. <span class='conn'>Last time</span>, we even sat outside in the evening <mark class='idiom'>stargazing（看星星）</mark>, something that's simply impossible back in the city. <span class='conn'>Still</span>, the moment I imagine commuting from there, the dream <mark class='idiom'>quickly fades（很快就破灭了）</mark>.<br><br>What makes the place really special is how it slows everything down. There's no Wi-Fi to speak of, so we spend the evenings playing cards, chatting on the porch, and listening to the grandparents <mark class='idiom'>tell stories from（讲述……的故事）</mark> their youth. <span class='conn'>That said</span>, I'm under no illusions about country living. The nearest hospital is over an hour away, the winters are bitterly cold with no central heating, and there's simply <mark class='idiom'>nothing much to do（没什么可做的）</mark> for a young person. <span class='conn'>So</span> while I treasure these visits, I know my <mark class='idiom'>day-to-day life（日常生活）</mark> belongs in the city.<br><br><span class=\"conn\">However</span>, I wouldn't want to live there long-term, <span class=\"conn\">mainly because</span> it's quite far from everything. There aren't many shops or good <mark class=\"idiom\">transport links（交通连接）</mark> nearby, <span class=\"conn\">so</span> daily life would be pretty <mark class=\"idiom\">inconvenient（不方便的）</mark>. <span class=\"conn\">That's why</span> it's perfect for a short visit but not for living.",
      "t": "我想谈谈一个我很喜欢拜访、但不想住的家——我朋友爷爷奶奶在乡下的房子。<br><br>那是一栋带大花园的传统院落，四周被田野和树木环绕。屋里摆满了老式木家具，给人一种特别温馨、怀旧的感觉。<br><br>我喜欢去那儿，是因为它特别宁静，和喧闹的城市截然不同。每次去，我都能呼吸新鲜空气、从园子里摘菜，整个人彻底放松下来。<br><br>我尤其喜欢在秋天去，那时整个院子里弥漫着成熟果子的香味，除了鸟鸣什么声音都没有。上次我们甚至傍晚坐在外面看星星——这在城市里根本不可能。不过，一想到要从那儿每天通勤，这个美梦很快就破灭了。<br><br>让这地方真正特别的，是它能让一切都慢下来。那儿几乎没有 Wi-Fi，所以我们整晚都在打牌、在门廊上聊天、听爷爷奶奶讲他们年轻时的故事。话虽如此，我对乡村生活并不抱幻想。最近的医院在一个多小时车程外，冬天没有暖气、冷得刺骨，对年轻人来说也实在没什么可做的。所以，尽管我很珍惜每次的造访，我清楚自己的日常生活还是属于城市。<br><br>不过，我不想长期住在那里，主要是因为它离什么都很远。附近没什么商店，也没有便利的交通，所以日常生活会相当不方便。这就是为什么它适合短住，却不适合长居。",

        {

      "a": "I'd like to talk about a book with animals in it, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> a children's classic called Charlotte's Web. The <mark class=\"idiom\">main characters（主角）</mark> are a little pig named Wilbur and a clever spider called Charlotte.<br><br>The story is about the friendship between the pig and the spider. <span class=\"conn\">When</span> Wilbur is <mark class=\"idiom\">in danger of（面临……的危险）</mark> being killed, Charlotte cleverly <mark class=\"idiom\">weaves words into her web（在网上织出文字）</mark> to save his life. It's <mark class=\"idiom\">a touching tale（一个感人的故事）</mark> about loyalty and kindness.<br><br>I first read it when I was a child, <span class=\"conn\">because</span> my teacher recommended it to the whole class. I was immediately <mark class=\"idiom\">drawn in by（被……深深吸引）</mark> the lovely characters and the simple but powerful story.<br><br>The part that has always stayed with me is the ending, which is genuinely <mark class='idiom'>heartbreaking（令人心碎的）</mark> yet beautiful. <span class='conn'>Without</span> giving too much away, Charlotte's <mark class='idiom'>selfless sacrifice（无私的牺牲）</mark> for her friend brought me to tears as a child, and still does. <span class='conn'>It's rare</span> for a simple children's story to carry such a <mark class='idiom'>profound message（深刻的寓意）</mark>.<br><br>What amazes me is how differently the book reads depending on your age. As a child, I simply loved the talking animals and the happy moments on the farm. <span class='conn'>But</span> rereading it as an adult, I picked up on its quieter themes — friendship, loss, and the <mark class='idiom'>circle of life（生命的循环）</mark> — which honestly <mark class='idiom'>hit much harder（更触动人）</mark> now. <span class='conn'>One line</span> about true friendship has genuinely <mark class='idiom'>stuck with me（铭记于心）</mark> over the years. <span class='conn'>I think</span> the mark of a truly great book is exactly this: it <mark class='idiom'>grows with you（伴你一同成长）</mark>, revealing something new each time you return to it.<br><br>I think it's a wonderful book that teaches children about friendship and <mark class=\"idiom\">sacrifice（牺牲）</mark> in a gentle way. <span class=\"conn\">Even</span> as an adult, I find its message really <mark class=\"idiom\">moving（感人的）</mark>. <span class=\"conn\">That's why</span> I'd recommend it to readers of any age.",
      "t": "我想谈谈一本有动物的书——一部儿童经典《夏洛的网》。主角是一只叫威尔伯的小猪和一只聪明的蜘蛛夏洛。<br><br>这个故事讲的是小猪和蜘蛛之间的友谊。当威尔伯面临被宰杀的危险时，夏洛机智地在网上织出文字，救了它的命。这是一个关于忠诚与善良的感人故事。<br><br>我小时候第一次读到它，是因为老师把它推荐给了全班。我立刻被那些可爱的角色，还有这个简单却有力量的故事深深吸引。<br><br>一直让我念念不忘的，是故事的结尾——既令人心碎，又无比美好。不剧透太多，夏洛特为朋友所做的无私牺牲，小时候让我流泪，如今依然如此。一个简单的儿童故事竟能承载如此深刻的关于爱与放手的寓意，实在难得。<br><br>让我惊叹的是，这本书在不同年纪读，感受竟如此不同。小时候，我单纯喜欢会说话的动物和农场里那些快乐的时光。但成年后重读，我才读出它更含蓄的主题——友谊、失去，以及生命的循环——说实话，如今读来更触动人。书里有一句关于真挚友谊的话，这些年我一直铭记于心。我觉得，一本真正伟大的书，标志恰恰在于此：它会伴你一同成长，每次重读都让你发现新的东西。<br><br>我觉得这是一本很棒的书，它用温柔的方式教会孩子什么是友谊和牺牲。即便已经成年，我依然觉得它传达的东西很感人。这就是为什么我会把它推荐给任何年龄的读者。",

      "a": "I'd like to talk about an environmental law, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> the <mark class=\"idiom\">waste-sorting regulation（垃圾分类规定）</mark> that requires people to <mark class=\"idiom\">separate（分开）</mark> their rubbish into different <mark class=\"idiom\">categories（类别）</mark>.<br><br>I first heard about it through the news and social media, <span class=\"conn\">when</span> it was <mark class=\"idiom\">rolled out（推行）</mark> in big cities like Shanghai. There were posters and <mark class=\"idiom\">volunteers（志愿者）</mark> everywhere explaining how to <mark class=\"idiom\">sort waste（给垃圾分类）</mark> properly.<br><br>I'd say the whole of society benefits from it. It <mark class=\"idiom\">reduces pollution（减少污染）</mark>, makes <mark class=\"idiom\">recycling（回收利用）</mark> more efficient, <span class=\"conn\">and</span> protects the environment for <mark class=\"idiom\">future generations（子孙后代）</mark>. The cleaner streets are a benefit everyone can see.<br><br>At home, my family now keeps four separate bins, and at first we were always <mark class='idiom'>second-guessing（拿不准）</mark> which bin each item belonged in. <span class='conn'>Gradually</span>, though, it became <mark class='idiom'>second nature（成了习惯）</mark>. <span class='conn'>What</span> surprised me most was how much less rubbish we actually throw away, since sorting makes you far more aware of <mark class='idiom'>how much you waste（自己浪费了多少）</mark>.<br><br>What I find encouraging is how quickly it has changed people's everyday habits. In our compound, there are now fixed times to <mark class='idiom'>drop off（投放）</mark> rubbish, and I've watched neighbours who once couldn't <mark class='idiom'>care less（毫不在意）</mark> become surprisingly strict about it. <span class='conn'>I'll admit</span> there were some <mark class='idiom'>awkward moments（尴尬时刻）</mark> early on — I was once gently <mark class='idiom'>told off（被说教）</mark> by an elderly volunteer for putting a tea bag in the wrong       "t": "我想谈谈一部环保法律——也就是要求人们把垃圾分成不同类别的垃圾分类规定。<br><br>我最早是通过新闻和社交媒体知道它的，当时它在上海这样的大城市开始推行。到处都是海报和志愿者，教大家怎么正确地给垃圾分类。<br><br>我觉得整个社会都从中受益。它减少了污染，让回收利用更高效，也为子孙后代保护了环境。更干净的街道就是人人都看得见的好处。<br><br>在家里，我们现在摆了四个分开的垃圾桶，一开始总是拿不准每样东西该扔进哪个桶。不过渐渐地，它就成了习惯。最让我意外的是，我们实际扔掉的垃圾少了很多，因为分类会让你更清楚地意识到自己到底浪费了多少。<br><br>让我感到欣慰的，是它如此迅速地改变了人们的日常习惯。在我们小区，现在有固定的投放垃圾时间，我亲眼看着一些原本毫不在意的邻居，变得出奇地严格。我得承认，刚开始有过一些尴尬时刻——我有次因为把茶包扔错了桶，被一位年长的志愿者温和地说教了一番！把现在的街道和几年前一比，差别是真真切切看得见的，这正是最好的证明：一部设计得当的法律，能推动整个社会改变。<br><br>就我个人而言，我非常支持这部法律。虽然一开始要适应它有点麻烦，但为了环境，这显然很值得。这就是为什么我觉得应该有更多地方采用它。",
