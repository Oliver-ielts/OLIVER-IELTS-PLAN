      "a": "I'd like to talk about a time I sent a message but didn't get a reply <mark class=\"idiom\">for ages（很久）</mark>, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> an email I sent to a company when I was <mark class=\"idiom\">applying for（申请）</mark> an internship.<br><br>The email was a job application, with my CV and a <mark class=\"idiom\">cover letter（求职信）</mark> <mark class=\"idiom\">attached（附上）</mark>. I'd spent a lot of time on it, <span class=\"conn\">so</span> I was really hoping to <mark class=\"idiom\">hear back from（收到回复）</mark> them soon.<br><br>Unfortunately, <mark class=\"idiom\">weeks went by（几周过去了）</mark> with <mark class=\"idiom\">complete silence（毫无音讯）</mark>. I almost <mark class=\"idiom\">gave up hope（放弃了希望）</mark>, <span class=\"conn\">but then</span>, about a month later, they <span class=\"conn\">finally</span> replied and invited me for an interview.<br><br>During those weeks, I must have <mark class='idiom'>refreshed my inbox（刷新邮箱）</mark> a hundred times a day, and every notification made my heart <mark class='idiom'>skip a beat（漏跳一拍）</mark>. <span class='conn'>I even</span> started assuming I'd been rejected and began applying elsewhere. <span class='conn'>So</span> when that reply finally <mark class='idiom'>popped up（突然出现）</mark> in my inbox, I could hardly believe my eyes.<br><br>What made the wait even harder was that this was my <mark class='idiom'>dream internship（梦寐以求的实习）</mark>, so a lot was <mark class='idiom'>riding on（取决于）</mark> their answer. To take my mind off it, I threw myself into other applications and tried to <mark class='idiom'>stay productive（保持充实）</mark>. <span class='conn'>When</span> the reply finally came, the interview went well and I ended up <mark class='idiom'>landing the role（拿到了职位）</mark>. <span class='conn'>Looking back</span>, that whole episode taught me a valuable lesson about patience: in the professional world, <mark class='idiom'>no news doesn't always mean bad news（没消息不一定是坏消息）</mark>, and people are often simply busier than you imagine.<br><br><span class=\"conn\">While</span> I was waiting, I felt quite <mark class=\"idiom\">anxious（焦虑的）</mark> and a bit <mark class=\"idiom\">frustrated（沮丧的）</mark>, <span class=\"conn\">since</span> I had no idea what was going on. <span class=\"conn\">But</span> once I got the reply, all that worry <mark class=\"idiom\">turned into（变成了）</mark> excitement. <span class=\"conn\">That's why</span> I've learned to be more patient about these things.",
      "t": "我想谈谈一次我发了消息却很久没收到回复的经历——那是我申请实习时给一家公司发的邮件。<br><br>那封邮件是一份求职申请，附上了我的简历和一封求职信。我在上面花了很多心思，所以特别希望能尽快收到他们的回复。<br><br>遗憾的是，几周过去了，毫无音讯。我几乎放弃了希望，但大约一个月后，他们终于回复了，还邀请我去面试。<br><br>在那几周里，我一天大概要刷新邮箱上百次，每来一条通知都让我的心漏跳一拍。我甚至已经默认自己被拒了，开始投别的公司。所以当那封回复终于出现在我邮箱里时，我简直不敢相信自己的眼睛。<br><br>让等待更煎熬的是，这是我梦寐以求的实习，所以很多事都取决于他们的答复。为了转移注意力，我把自己投入到别的申请里，努力让自己保持充实。回复终于来时，面试很顺利，我最终拿到了那个职位。回头看，整件事让我学到了关于耐心的宝贵一课：在职场里，没消息不一定是坏消息，别人往往只是比你想象的要忙得多。<br><br>等待的那段时间，我相当焦虑、也有点沮丧，因为我完全不知道是什么情况。但一收到回复，所有的担心都变成了兴奋。这就是为什么我学会了对这类事情更有耐心。",

      "a": "I'd like to talk about a long-term goal of mine, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> to open my own little coffee shop one day. I've had this dream for about five years now.<br><br>My dream is to run a <mark class=\"idiom\">cosy, welcoming（温馨好客的）</mark> café where people can relax, read and chat. I want it to feel like <mark class=\"idiom\">a second home（第二个家）</mark> for <mark class=\"idiom\">the local community（本地社区）</mark>, <span class=\"conn\">not just</span> a place to grab a quick coffee.<br><br>To make it happen, I know I need to <mark class=\"idiom\">save up（攒钱）</mark> enough money and <mark class=\"idiom\">gain some real experience（积累一些实战经验）</mark> first. <span class=\"conn\">So</span> I'm planning to work in the industry for a few years and learn how to <mark class=\"idiom\">run a business（经营生意）</mark> properly.<br><br>In my mind, I can already picture every detail — warm wooden tables, shelves full of books, soft jazz playing, and the smell of <mark class='idiom'>freshly ground coffee（现磨咖啡）</mark> in the air. <span class='conn'>I'd love</span> for it to host small events too, like book clubs, so it becomes a real <mark class='idiom'>gathering spot（聚会场所）</mark>. <span class='conn'>Whenever</span> I'm having a stressful day, picturing that little café honestly <mark class='idiom'>keeps me going（支撑着我）</mark>.<br><br>It's not just <mark class='idiom'>a pipe dream（不切实际的空想）</mark> either — I've already started <mark class='idiom'>taking small steps（迈出小步）</mark> towards it. I've begun saving a little each month and even did a short barista course last year, just to <mark class='idiom'>get a feel for（体验一下）</mark> the trade. <span class='conn'>For me</span>, the appeal isn't really about the income; it's the idea of building a warm little corner of the world where people feel <mark class='idiom'>at home（宾至如归）</mark>, and that vision is what keeps me motivated.<br><br>I set this goal <span class=\"conn\">because</span> I've always loved coffee and the <mark class=\"idiom\">warm atmosphere（温馨的氛围）</mark> of cafés. <span class=\"conn\">More than the money</span>, I love the idea of creating a space that makes people happy. <span class=\"conn\">That's why</span> I'm <mark class=\"idiom\">willing to（愿意）</mark> work so hard for it.",
      "t": "我想谈谈我的一个长期目标——有一天开一家属于自己的小咖啡馆。这个梦想我已经怀揣了大约五年。<br><br>我的梦想是经营一家温馨好客的咖啡馆，让人们可以在那里放松、阅读、聊天。我希望它对本地社区来说像第二个家，而不只是一个匆匆喝杯咖啡的地方。<br><br>为了实现它，我知道自己得先攒够钱、积累一些真正的实战经验。所以我打算先在这个行业干几年，学会怎么把生意经营好。<br><br>在我的脑海里，每一个细节我都已经能想象出来——温暖的木桌、摆满书的书架、轻柔的爵士乐，空气中飘着现磨咖啡的香味。我还希望它能举办一些小型活动，比如读书会，让它成为一个真正的聚会场所。每当我过得很累的时候，想象那家小咖啡馆，说实话真的支撑着我走下去。<br><br>它也不只是个不切实际的空想——我其实已经开始朝它迈出小步了。我每个月都存一点钱，去年还上了个短期咖啡师课程，就为了体验一下这一行。对我来说，吸引我的并不是收入，而是亲手打造世界上一个温暖的小角落、让人在那儿感到宾至如归的念头，正是这幅愿景一直激励着我。<br><br>我定下这个目标，是因为我一直热爱咖啡，也喜欢咖啡馆那种温馨的氛围。比起赚钱，我更喜欢\"打造一个让人开心的空间\"这个想法。这就是为什么我愿意为它如此努力。",

      "ztitle": "改变重要想法",
      "describe": "Describe a time when you changed an important opinion of yours",
      "shouldsay": [

        "And explain how you felt about the experience"
      ],
      "a": "I'd like to talk about a time I changed an important opinion, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> <mark class=\"idiom\">my view on（我对……的看法）</mark> what \"success\" really means. This change happened a couple of years ago.<br><br>I used to believe that success was all about earning a lot of money and getting a <mark class=\"idiom\">high-status job（高地位的工作）</mark>. Back then, I <mark class=\"idiom\">judged（评判）</mark> people mostly by how wealthy they were.<br><br>My opinion changed <span class=\"conn\">after</span> I met a few people who earned very little <span class=\"conn\">but</span> seemed genuinely happy and <mark class=\"idiom\">fulfilled（有满足感的）</mark>. I gradually realised that success is more about doing what you love and having <mark class=\"idiom\">good relationships（良好的人际关系）</mark>, not just money.<br><br>One person in particular changed how I think — a former classmate who gave up <mark class='idiom'>a high-paying job（高薪工作）</mark> to become a primary school teacher. <span class='conn'>Although</span> he earns far less now, he told me he's never felt more <mark class='idiom'>content（知足满足）</mark>. <span class='conn'>Hearing</span> that genuinely <mark class='idiom'>shifted my perspective（改变了我的看法）</mark>, and I began questioning what I'd been chasing.<br><br>This shift in thinking has genuinely changed the way I live, not just the way I think. <span class='conn'>For instance</span>, I recently turned down a higher-paying job that would have meant <mark class='idiom'>constant overtime（无休止的加班）</mark> and almost no personal life, something the old me would have <mark class='idiom'>jumped at（迫不及待接受）</mark> without a second thought. <span class='conn'>Instead</span>, I chose a role that gives me time for the people and hobbies I love. <span class='conn'>Honestly</span>, I sleep better and feel far less <mark class='idiom'>weighed down（被压得喘不过气）</mark> these days. <span class='conn'>It just goes to show</span> that redefining success isn't only a nice idea — it can completely <mark class='idiom'>reshape your daily choices（重塑你的日常选择）</mark>.<br><br>Honestly, this change made me feel much more relaxed and positive about life. I stopped <mark class=\"idiom\">putting so much pressure on myself（给自己那么大压力）</mark> to earn more and more. <span class=\"conn\">That's why</span> I now <mark class=\"idiom\">define success（定义成功）</mark> in a much healthier way.",
      "t": "我想谈谈一次我改变重要想法的经历——也就是我对\"成功\"到底意味着什么的看法。这个转变发生在几年前。<br><br>我以前一直认为，成功就是赚很多钱、拥有一份地位很高的工作。那时候，我评判一个人，主要看他有多富有。<br><br>在我遇到几个赚得很少、却看起来真心快乐、很有满足感的人之后，我的看法变了。我慢慢意识到，成功更多关乎做自己热爱的事、拥有良好的人际关系，而不只是金钱。<br><br>有一个人尤其改变了我的想法——一位放弃高薪工作去当小学老师的老同学。虽然他现在挣得少多了，但他告诉我，他这辈子从没感到这么知足过。听到这话，真的改变了我的看法，我开始反思自己一直以来追逐的到底是什么。<br><br>这种想法上的转变，真切地改变了我的生活方式，而不只是思维方式。比如，我最近婉拒了一份薪水更高的工作，那意味着无休止的加班、几乎没有个人生活，换作以前的我，会毫不犹豫地迫不及待接受。相反，我选了一份能给我时间陪伴所爱之人、做喜欢之事的工作。说实话，如今我睡得更好，也不再被压得喘不过气。这恰恰说明，重新定义成功不仅是个动听的想法——它能彻底重塑你的日常选择。<br><br>说实话，这个转变让我对生活轻松、积极了许多。我不再逼着自己一定要越赚越多。这就是为什么我现在用一种健康得多的方式来定义成功。",
      "p3": [
        {
          "q": "When do most children begin to have their own opinions?",
          "a": "I think it usually starts quite early, around the age of five or six. That's when they begin to express their likes and dislikes clearly. By their teenage years, their opinions become much stronger and more independent.",

      "describe": "Describe an environmental law you would like your country to introduce",

      "a": "I'd like to talk about an environmental law I'd love my country to introduce, which is <mark class=\"idiom\">（漂亮、地道、可替换的万能开头句）</mark> <mark class=\"idiom\">a complete ban on（全面禁止）</mark> <mark class=\"idiom\">single-use plastics（一次性塑料）</mark>, like plastic bags, straws and <mark class=\"idiom\">cutlery（餐具）</mark>.<br><br>People should follow this law <span class=\"conn\">because</span> <mark class=\"idiom\">plastic waste（塑料垃圾）</mark> is one of the biggest threats to our environment. It <mark class=\"idiom\">pollutes the oceans（污染海洋）</mark>, harms wildlife <span class=\"conn\">and</span> takes hundreds of years to <mark class=\"idiom\">break down（降解）</mark>. Cutting it out would make a huge difference.<br><br>I think it would be popular with most people, <span class=\"conn\">since</span> <mark class=\"idiom\">environmental awareness（环保意识）</mark> is growing fast. <span class=\"conn\">However</span>, some businesses and shoppers might find it <mark class=\"idiom\">inconvenient（不方便的）</mark> at first, <span class=\"conn\">as</span> they'd need to switch to <mark class=\"idiom\">alternatives（替代品）</mark>.<br><br>I've actually started <mark class='idiom'>cutting down on（减少使用）</mark> plastic in my own life — I carry a reusable cup and always keep a cloth bag in my backpack. <span class='conn'>At first</span> it felt like a hassle, <span class='conn'>but</span> now it's just a habit. <span class='conn'>If</span> a simple law could <mark class='idiom'>nudge millions of people（推动数百万人）</mark> to do the same, the <mark class='idiom'>knock-on effect（连锁效应）</mark> would be enormous.<br><br>What really <mark class='idiom'>drove this home for me（让我深有体会）</mark> was a beach trip last summer, where I was shocked to find the sand <mark class='idiom'>littered with（满是）</mark> plastic bottles and bags washed in by the tide. <span class='conn'>As for</span> the argument that a ban would be inconvenient, I honestly think people <mark class='idiom'>adapt faster than（适应得比……快）</mark> they expect — just look at how quickly we got used to carrying our own shopping bags. <span class='conn'>In my view</span>, a little inconvenience now is nothing compared to the mess we'd be <mark class='idiom'>leaving behind for（留给……）</mark> future generations.<br><br>Personally, I feel really strongly about this. A short-term inconvenience is <mark class=\"idiom\">a small price to pay（很值得付出的小代价）</mark> for <mark class=\"idiom\">a cleaner planet（一个更干净的地球）</mark>. <span class=\"conn\">That's why</span> I believe a law like this is worth introducing as soon as possible.",
      "t": "我想谈谈一部我很希望国家能推行的环保法律——全面禁止一次性塑料制品，比如塑料袋、吸管和餐具。<br><br>人们应该遵守这部法律，因为塑料垃圾是对我们环境最大的威胁之一。它污染海洋、伤害野生动物，而且要花几百年才能降解。把它彻底去掉会带来巨大的改变。<br><br>我觉得它会受到大多数人的欢迎，因为环保意识正在快速增强。不过，一些商家和消费者一开始可能会觉得不方便，因为他们得改用替代品。<br><br>其实我自己生活里已经开始减少塑料的使用了——我会随身带可重复使用的杯子，背包里也总放着一个布袋。一开始觉得有点麻烦，但现在已经成了习惯。如果一部简单的法律能推动数百万人都这么做，那产生的连锁效应将是巨大的。<br><br>真正让我深有体会的，是去年夏天的一次海滩之行，我震惊地发现沙滩上满是被潮水冲上来的塑料瓶和塑料袋。至于禁令会带来不便这个说法，我老实说，人们适应得比自己想象的要快得多——看看我们多快就习惯了自带购物袋就知道了。在我看来，眼下这点小小的不便，跟我们会留给子孙后代的那个烂摊子相比，根本不算什么。<br><br>就我个人而言，我对这件事感触很深。一时的不便，是为一个更干净的地球付出的、很值得的小代价。这就是为什么我相信这样一部法律值得尽快推行。",
      "p3": [
        {
          "q": "How does technology affect the law?",
          "a": "Technology influences the law in many ways. On one hand, it creates new issues that need regulating, like online privacy and fraud. On the other hand, it helps enforce laws better through tools like cameras and data tracking.",

      "shouldsay": [

      ],
      "a": "<mark class=\"idiom\">A piece of local news（本地新闻）</mark> that many people were interested in was about the opening of a new metro line in the city. <mark class=\"idiom\">I first saw it on a local news（本地新闻）</mark> account online, and later I <mark class=\"idiom\">heard people talking about it in my neighbourhood（社区）</mark>.<br><br>The news involved the local government, transport department, construction workers, and of course ordinary residents. The new line connected several residential areas with business districts, <mark class=\"idiom\">so it changed many people's daily commute（每日通勤）</mark>.<br><br>People were interested in it <span class=\"conn\">because</span> transport is closely related to everyday life. <span class=\"conn\">For some residents</span>, the new metro line meant they could save twenty or thirty minutes on the way to work. It also made nearby communities more attractive to live in.<br><br>For my own family, the new line made a real difference, since my father's commute was <mark class='idiom'>cut almost in half（缩短了近一半）</mark>. <span class='conn'>What</span> struck me was how everyone in the neighbourhood seemed to be <mark class='idiom'>buzzing about it（议论纷纷）</mark> for weeks. <span class='conn'>It just goes to show</span> that local news, however small, can have <mark class='idiom'>a direct impact on（对……产生直接影响）</mark> ordinary people's lives.<br><br>What this story really brought home to me is why local news matters so much, even if it never makes the national headlines. <span class='conn'>Unlike</span> distant international events I can do little about, a new metro line directly <mark class='idiom'>shapes（塑造）</mark> the daily rhythm of my own community. <span class='conn'>Because of it</span>, property nearby became more sought-after, small shops around the new stations <mark class='idiom'>sprang up（如雨后春笋般出现）</mark>, and the whole area felt more connected. <span class='conn'>It made me realise</span> that the news closest to home is often the news that <mark class='idiom'>affects us most（对我们影响最大）</mark>.<br><br>I found the news practical and positive. It was not dramatic, <span class=\"conn\">but</span> it affected real people directly. <mark class=\"idiom\">That is why local news（本地新闻）</mark> can sometimes feel more relevant than big international headlines.",
      "t": "一条很多人感兴趣的本地新闻，是关于城市一条新地铁线路开通的。我最早是在一个本地新闻账号上看到的，后来也听到小区里有人讨论。 这条新闻涉及地方政府、交通部门、施工人员，当然也包括普通居民。这条新线路连接了几个居民区和商务区，所以改变了很多人的日常通勤。 人们感兴趣，是因为交通和日常生活关系太密切了。对一些居民来说，新地铁线路意味着上班路上能节省二三十分钟，也让附近社区变得更适合居住。 我觉得这条新闻很实用，也很积极。它并不戏剧化，但直接影响真实的人。这就是为什么本地新闻有时候比国际大新闻更有相关性。<br><br>这件事真正让我深刻体会到，本地新闻为什么如此重要，哪怕它从不会登上全国头条。不像那些遥远、我又几乎无能为力的国际事件，一条新地铁线会直接塑造我自己社区的日常节奏。因为它，附近的房子变得更抢手，新站点周围的小店如雨后春笋般冒了出来，整个片区也感觉更连通了。它让我意识到，离家最近的新闻，往往才是对我们影响最大的新闻。<br><br>对我自己家来说，这条新线路带来了实实在在的改变，因为我爸爸的通勤时间几乎缩短了一半。让我印象深刻的是，街坊邻里好几周都在议论纷纷。这恰恰说明，本地新闻无论多小，都可能对普通人的生活产生直接的影响。",

      "a": "A recent change I made was to stop checking my phone immediately after waking up. I made this change <span class=\"conn\">because</span> I realised that the first twenty minutes of my day were often wasted on messages and social media. It made me feel distracted before I even started working.<br><br>To make the change easier, I put my phone away from my bed and started using a simple alarm clock instead. After getting up, I drink water, open the curtains, and write down the three most important tasks of the day. I only check my phone after that.<br><br><span class=\"conn\">At first</span>, it felt a bit uncomfortable <span class=\"conn\">because</span> checking my phone had become automatic. But after a few days, I noticed that my mornings became calmer and more focused.<br><br>One thing I quickly noticed was that my mind felt far less <mark class='idiom'>cluttered（杂乱）</mark> in the mornings, and I stopped starting my day anxious about other people's posts. <span class='conn'>Instead</span>, I now have a few quiet minutes that feel genuinely my own. <span class='conn'>Funnily enough</span>, breaking such a small habit ended up having a <mark class='idiom'>ripple effect（涟漪般的连锁效应）</mark> on my whole mood.<br><br>Encouraged by how well it worked, I've gradually started extending the same idea to other parts of my day — for example, I now keep my phone out of reach during meals and before sleep too. <span class='conn'>A few friends</span> noticed I seemed more <mark class='idiom'>present（专注当下）</mark> and asked what had changed, and some have even started <mark class='idiom'>giving it a go（试一试）</mark> themselves. <span class='conn'>It's reassuring</span> to know that a tiny tweak to a daily routine can quietly <mark class='idiom'>spread to（蔓延到）</mark> others and improve their days too.<br><br>I feel very positive about this change. It is not a huge life transformation, <span class=\"conn\">but</span> it gives me a better start to the day and reduces unnecessary stress.",
      "t": "我最近做的一个改变是：早上起床后不再立刻看手机。我做这个改变，是因为我发现一天最开始的二十分钟经常被消息和社交媒体浪费掉，还没开始工作就已经分心了。 为了更容易做到，我把手机放远，不放在床边，并改用一个简单闹钟。起床后，我会喝水、拉开窗帘，写下一天最重要的三件事，之后才看手机。 一开始有点不舒服，因为看手机已经变成自动反应。但几天之后，我发现早晨更平静，也更专注了。 我对这个改变很满意。它不是巨大的人生转变，但能让我一天开头更好，也减少不必要的压力。<br><br>因为效果出乎意料地好，我便慢慢把同样的做法延伸到一天里的其他时段——比如，现在吃饭时和睡前我也会把手机放到够不着的地方。几个朋友注意到我似乎更专注当下，就问我有什么变化，有些人甚至也开始自己试一试。看到对日常作息一个小小的调整，能悄悄蔓延到别人身上、也让他们的日子变好，这让我感到很欣慰。<br><br>我很快注意到的一点是，早晨我的脑子不再那么杂乱，也不会一睁眼就因为别人发的动态而焦虑。取而代之的是，现在我能拥有几分钟真正属于自己的安静时光。说来有趣，戒掉这么一个小小的习惯，最后竟对我一整天的情绪产生了涟漪般的连锁效应。",

      "emoji": "🎓",
      "ztitle": "印象深刻的课程",
      "describe": "Describe a course that impressed you a lot",
      "shouldsay": [
        "What the course was about",
        "Where you took the course",
        "What you did during the course",
        "And explain why it impressed you a lot"
      ],
      "a": "A course that impressed me a lot was a short photography course I took at a community centre last summer. It was designed for beginners and focused on taking better pictures with an ordinary phone, so I didn't need to buy expensive equipment.<br><br>The course lasted four Saturday afternoons. During the first lesson, the teacher asked us to photograph the same everyday object from several angles. I expected a lecture about technical settings, but instead we spent most of the time experimenting and comparing the results.<br><br>Later, we practised using natural light, choosing a simple background and deciding what to leave outside the frame. We also went for a short walk near the centre and tried to tell a small story through three photographs. My pictures weren't amazing, but I began to notice details I would normally miss.<br><br>What impressed me most was the teacher's feedback. She didn't just say that a picture was good or bad. She explained what drew her attention and suggested one specific change we could try. That made improvement feel <mark class=\"idiom\">within reach(可以实现)</mark>, even for someone with no artistic background.<br><br>By the end, I had a small collection of photographs I was pleased with and a much clearer idea of how to practise. The course showed me that a memorable class doesn't need to overwhelm students with information. It can simply help them <mark class=\"idiom\">look at things differently(换个角度看事物)</mark> and leave them confident enough to keep learning on their own.",
      "t": "去年夏天，我在社区中心参加过一门让我印象深刻的手机摄影入门课，不需要昂贵设备。<br><br>课程持续四个周六下午。第一节老师让我们从多个角度拍同一个日常物品。我原以为会听技术设置讲解，实际上大部分时间都在尝试、比较。<br><br>后来练习自然光、简洁背景和取景，也在中心附近散步，用三张照片讲小故事。我的照片不算出色，但开始注意以前忽略的细节。<br><br>最打动我的是反馈方式。老师不只说好坏，而是解释注意力被什么吸引，再给一个具体改进。即使没有艺术基础，也觉得进步可实现。<br><br>课程结束时，我有了满意的小作品集，也知道如何继续练习。这说明难忘的课堂不必塞满信息，而是帮助学生换个角度看事物，并自信地继续学习。",
      "p3": [
        {
          "q": "What can we learn from history?",
          "a": "History can show how decisions affected different groups and how societies responded to change. It can also teach us to examine evidence rather than accept a simple story. <span class=\"conn\">However</span>, the past doesn't provide an exact formula for every current problem. It's a useful <mark class=\"idiom\">source of perspective(视角来源)</mark>, not a set of automatic answers.",
          "t": "历史展示决定如何影响不同群体、社会如何面对变化，也教人检验证据。但过去不是当前问题的固定公式，而是提供视角。"
        },
        {
          "q": "What do people need to remember in their daily lives?",
          "a": "People need to remember appointments, responsibilities and practical information such as where they've put important items. Remembering promises matters too, because others depend on them. <span class=\"conn\">But</span> nobody can keep everything in their head. Notes and reminders can reduce the mental load and help people <mark class=\"idiom\">follow through(把答应的事情做到)</mark>.",
          "t": "需记约会、责任、重要物品位置和承诺。但不能全靠脑记，笔记和提醒可减轻负担、帮助落实。"
        },
        {
          "q": "Can technology help people remember things better? How?",
          "a": "Yes, calendars, reminders and searchable notes can help people retrieve information at the right time. <span class=\"conn\">However</span>, storing something doesn't guarantee understanding or recall. For learning, people still need to engage with the material. Technology works best as support, rather than an excuse to <mark class=\"idiom\">stop paying attention(不再认真留意)</mark>.",
          "t": "日历、提醒、可搜索笔记有帮助，但存下来不代表理解或记得。学习仍需投入，技术是辅助，而非不留意的理由。"
        },
        {
          "q": "Which can help people remember things better, words or photos?",
          "a": "It depends on the information. Photos are useful for visual details and personal memories, while words can explain names, reasons and relationships more precisely. <span class=\"conn\">Often</span>, combining them is effective, such as adding a short caption to a picture. The best aid is the one that helps someone <mark class=\"idiom\">make a meaningful link(建立有意义的联系)</mark>.",
          "t": "取决于信息：照片适合视觉细节与回忆，文字能准确解释名称、原因、联系。加短标题等组合方法常有效，关键是建立有意义联系。"
        },
        {
          "q": "Do people like things of memorial significance?",
          "a": "Many do, because an object can connect them with a person, place or period of life. Its financial value may be small while its emotional value is strong. <span class=\"conn\">However</span>, not everyone expresses memories through possessions. Some prefer photographs or stories, so attachment can <mark class=\"idiom\">take different forms(呈现不同形式)</mark>.",
          "t": "很多人喜欢，因为物品连接人物、地点或人生阶段，情感价值可高于价格。但也有人通过照片或故事记忆，依恋有不同形式。"
        },
        {
          "q": "Why do some people have a better memory than others?",
          "a": "Attention, practice and familiarity with the subject can all affect what people remember. Some also use helpful methods, such as grouping information or linking it to something they know. <span class=\"conn\">So</span>, differences aren't necessarily fixed. Improving a learning routine may help someone remember more than simply deciding they have a <mark class=\"idiom\">poor memory(记性不好)</mark>.",
          "t": "注意力、练习、熟悉度和方法都影响记忆。差异不一定固定，改善学习习惯可能比认定自己记性差更有用。"
        }
      ],
      "cat": "经历",
      "sourcePage": 41
    },
    {
      "id": "s26p2_57",
      "tag": "非大陆新题",
      "region": "nonmainland",
      "emoji": "🏙️",
      "ztitle": "想再去一次的城市",
      "describe": "Describe a city that you have been to and would like to visit again",
      "shouldsay": [
        "When you visited it",
        "What you did there",
        "What it was like",
        "And explain why you would like to visit it again"
      ],
      "a": "A city I've visited and would like to return to is Hangzhou. I went there with a friend for a long weekend last spring, mainly because we wanted a change of scene after a busy period at work.<br><br>We spent one morning walking near West Lake, stopping whenever we saw a pleasant view rather than trying to complete a fixed route. We also explored a few quieter streets, visited a small bookshop and tried some local food. In the evening, we found a café and talked for much longer than we'd planned.<br><br>My impression was that the city offered a good balance between urban convenience and places where you could slow down. Some areas were crowded, especially around the best-known sights, but it wasn't difficult to find a quieter corner if we walked a little further. The trees and water made the trip feel quite different from my normal routine.<br><br>I'd like to visit again because three days weren't enough to see everything at a relaxed pace. We had to skip a museum and cut short one walk because of rain. Next time, I'd stay slightly longer and avoid packing too much into each day.<br><br>What attracts me isn't only the famous scenery. It's the feeling that I can <mark class=\"idiom\">take my time(从容慢慢来)</mark> and enjoy ordinary moments there. I'd love to return in a different season, revisit a few favourite spots and discover something new without feeling I have to <mark class=\"idiom\">tick every box(完成所有打卡项目)</mark>.",
      "t": "我去过并想再去的城市是杭州。去年春天，我和朋友利用长周末去换换环境。<br><br>我们在西湖附近走了一上午，看到喜欢的风景就停，不按固定路线赶路。也逛了较安静的街道、小书店，尝试本地食物，晚上在咖啡馆聊了很久。<br><br>城市给我的感觉是便利与慢节奏空间兼具。著名景点人多，但再走远一点就能找到安静角落。树木与水景让旅行不同于日常。<br><br>我想再去，因为三天不足以从容游览。下雨让我们没去成一间博物馆，也缩短了一次散步。下次我会多住几天，少安排一点。<br><br>吸引我的不只是名景，而是可以慢慢享受普通时刻。我想换个季节重访喜爱的地方，也发现新东西，不必完成所有打卡项目。",
      "p3": [
        {
          "q": "What should the government do to improve citizens' safety?",
          "a": "They can maintain lighting, public spaces and reliable transport, and make it easy to report problems. Clear emergency information and accessible support also matter. <span class=\"conn\">However</span>, safety shouldn't depend only on surveillance. Good design and cooperation with residents can help identify practical issues before they <mark class=\"idiom\">get out of hand(变得难以控制)</mark>.",
          "t": "政府可维护照明、公共空间、交通，方便报告问题，并提供清晰应急信息。安全不只靠监控，设计与居民合作也能防止问题扩大。"
        },
        {
          "q": "Are there any changes in your city?",
          "a": "In areas I know, there have been changes to transport, new housing and more digital services. Some improvements make daily tasks easier, while construction can temporarily cause inconvenience. <span class=\"conn\">For me</span>, the useful question is whether change benefits residents, rather than whether a place simply <mark class=\"idiom\">looks more modern(看起来更现代)</mark>.",
          "t": "我熟悉的地区交通、住房和数字服务有变化，有些更便利，施工也可能暂时不便。重点是是否惠及居民，而非只显得现代。"
        },
        {
          "q": "Do you think people in the countryside are friendlier than people in the city?",
          "a": "They may seem friendlier because people are more likely to know one another and have time for familiar conversations. <span class=\"conn\">But</span> friendliness isn't determined by location. City residents may be warm too, even if daily interactions are shorter. I'd avoid turning different routines into a judgement about people's <mark class=\"idiom\">character(品格)</mark>.",
          "t": "乡村可能因熟悉和交流时间多而显得友善，但地点不决定性格。城市居民也可热情，只是交流短，不能用生活方式评判品格。"
        },
        {
          "q": "Do you think it is possible that all of the population move to cities?",
          "a": "I think that's very unlikely. People have different preferences, and rural areas still have important roles and communities. <span class=\"conn\">Also</span>, moving everyone into cities would create huge pressure on housing and services. A more useful goal is improving opportunities in different places, so people don't feel they have to <mark class=\"idiom\">leave by necessity(迫于需要离开)</mark>.",
          "t": "我觉得不太可能，人们偏好不同，乡村有重要功能和社区。全搬入城市会增加住房服务压力，更有用的是改善各地机会，减少被迫离开。"
        },
        {
          "q": "Some people say large cities are suitable for old people. What do you think?",
          "a": "They can be suitable if transport, services and public spaces are accessible. Older people may appreciate being close to facilities and social activities. <span class=\"conn\">However</span>, crowds, high costs or unsuitable housing can make life difficult. The size of a city matters less than whether it supports people's <mark class=\"idiom\">daily independence(日常独立生活)</mark>.",
          "t": "交通服务和空间易用时，城市适合长者，也方便接触设施活动。但拥挤、成本、住房不合适会困难，关键是支持独立生活，而非城市大小。"
        },
        {
          "q": "What's the difference between the city and the countryside?",
          "a": "Cities generally offer denser services, more transport options and a wider range of jobs. The countryside may offer more space, quieter surroundings and different community relationships. <span class=\"conn\">However</span>, conditions vary greatly within each. I'd compare specific places and practical needs instead of assuming one offers a universally better <mark class=\"idiom\">quality of life(生活质量)</mark>.",
          "t": "城市服务密集、交通和工作多，乡村空间与安静可能更好、社区关系不同。但内部差异大，应具体比较，不认为某种一定更优。"
        }
      ],
      "cat": "地点",
      "sourcePage": 41
    },
    {
      "id": "s26p2_58",
      "tag": "非大陆新题",
      "region": "nonmainland",
      "emoji": "🤝",
      "ztitle": "一见且想继续了解的人",
      "describe": "Describe a person you only met once recently and want to know more about",
      "shouldsay": [
        "Who he/she is",
        "When you met him/her",
        "Why you want to know more about him/her",
        "And explain how you feel about him/her"
      ],
      "a": "A person I've only met once recently and would like to know more about is a woman called Anna. I met her about a month ago at a friend's small birthday dinner. She was another guest, and we happened to sit next to each other.<br><br>We started with ordinary conversation about work and how we knew the host. Then I found out that she helps run a community repair workshop, where people bring damaged household items and learn how to repair them with guidance from volunteers. I hadn't heard of that kind of project before.<br><br>What interested me was the way she talked about it. She wasn't trying to sound impressive. She described small successes, mistakes and the satisfaction people felt when they managed to fix something themselves. She also asked about my work and listened carefully, so the conversation felt balanced.<br><br>I'd like to know more about how she started the workshop and what keeps her motivated. I'm curious about the practical side too, such as how the volunteers share their skills and choose which repairs they can handle safely. It sounds like a project that <mark class=\"idiom\">brings people together(让人们聚在一起)</mark> as well as reducing waste.<br><br>I felt comfortable around her because she was thoughtful and approachable. Our conversation ended when the birthday cake arrived, so we didn't get very far. I wouldn't assume we're close friends after one meeting, but I'd be happy to meet her again and perhaps visit a public workshop to <mark class=\"idiom\">see it for myself(亲自了解)</mark>.",
      "t": "大约一个月前，在朋友的小型生日晚餐上，我认识了一位叫Anna的女士，只见过一次，却想继续了解她。<br><br>我们先聊工作和如何认识主人，后来知道她参与运营社区维修工作坊，让人带来损坏家居用品，在志愿者指导下学习维修。我之前没听过这种项目。<br><br>她的讲述很吸引我：不刻意显得厉害，而是谈小成功、失误和参与者亲手修好的满足感。她也认真问我的工作，因此交流很平衡。<br><br>我想知道她如何开始、如何保持动力，也好奇志愿者如何分享技能、判断哪些维修能安全处理。这个项目不仅减少浪费，也让人相聚。<br><br>她体贴、容易接近，让我很舒服。生日蛋糕来时谈话结束，我们还没深入。我不会因为一次见面就认为已是好友，但愿意再次见她，或去公开工作坊亲自了解。",
      "p3": [
        {
          "q": "What should we not talk about when we meet a person for the first time?",
          "a": "It's usually wise to avoid very personal questions about income, relationships or private problems unless the person raises them. Strong assumptions about politics or identity can also make things awkward. <span class=\"conn\">Instead</span>, neutral questions give people room to choose what to share. A first conversation should help them <mark class=\"idiom\">feel comfortable(感到舒服)</mark>, not put them under examination.",
          "t": "初见宜避免收入、关系、私人问题，除非对方主动提起，也别对政治或身份作强假设。中性问题留出分享选择，交流应让人舒服，而非像审问。"
        },
        {
          "q": "What can we do to leave a good impression on people we meet for the first time?",
          "a": "We can be punctual, listen carefully and show genuine interest without dominating the conversation. Remembering a small detail can be more effective than trying to sound impressive. <span class=\"conn\">Also</span>, treating everyone respectfully matters. A good impression comes from making the interaction pleasant and reliable, rather than performing a <mark class=\"idiom\">perfect version of yourself(完美的自己)</mark>.",
          "t": "准时、认真听、真诚关心、不主导谈话有帮助。记住细节比刻意显厉害更有效，也应尊重所有人，而非表演完美。"
        },
        {
          "q": "What qualities make true friends?",
          "a": "Trust, honesty and consideration are essential. True friends can disagree without humiliating one another and offer support without keeping score. <span class=\"conn\">However</span>, friendship also needs reliability in ordinary moments, not only dramatic acts of help. Making time and remembering what matters to someone can <mark class=\"idiom\">strengthen the bond(加强关系)</mark>.",
          "t": "信任、诚实、体贴重要，朋友可分歧而不羞辱、帮助而不计较。日常可靠同样重要，安排时间、记住对方在乎的事能加强关系。"
        },
        {
          "q": "Is it important to have the same hobbies and interests when making friends?",
          "a": "Shared interests make it easier to start conversations and arrange activities. <span class=\"conn\">But</span> they aren't essential for a strong friendship. People with different hobbies can still share values and respect one another. In fact, differences may introduce them to new experiences, as long as both are willing to <mark class=\"idiom\">meet halfway(互相迁就)</mark>.",
          "t": "共同兴趣方便聊天活动，但非深厚友谊的必要条件。爱好不同也可价值相近、互相尊重，愿意迁就时，差异反而带来新体验。"
        },
        {
          "q": "On what occasions do people like to make friends?",
          "a": "People often make friends when they begin school, join a club, start a job or move somewhere new. Shared activities create repeated opportunities to talk. <span class=\"conn\">However</span>, adults may need to make a more deliberate effort because routines are already established. Familiar contact gives a relationship time to <mark class=\"idiom\">grow naturally(自然发展)</mark>.",
          "t": "入学、社团、新工作、搬家都易交友，共同活动创造反复交流。成年人可能要更主动，稳定接触给关系自然发展的时间。"
        },
        {
          "q": "How do people make friends in China?",
          "a": "They often meet through school, work, shared interests or introductions from existing friends. Online groups can also lead to friendships, especially around a hobby. <span class=\"conn\">Still</span>, trust usually develops through repeated interaction rather than one message. The exact approach varies, so I wouldn't describe a single <mark class=\"idiom\">national pattern(全国统一模式)</mark>.",
          "t": "常通过学校、工作、兴趣或朋友介绍认识，线上兴趣群也可交友。但信任需反复互动，方式多样，没有一个全国统一模式。"
        }
      ],
      "cat": "人物",
      "sourcePage": 42
    },
    {
      "id": "s26p2_59",
      "tag": "非大陆新题",
      "region": "nonmainland",
      "emoji": "🎁",
      "ztitle": "送朋友的礼物",
      "describe": "Describe a gift you would like to buy for your friend",
      "shouldsay": [
        "How you knew your friend",
        "How long you have known him/her",
        "How you would choose a gift for him/her",
        "And explain why you would choose that gift for him/her"
      ],
      "a": "A gift I'd like to buy for my friend Alex is a good-quality notebook for his photography ideas. We met at a university club about five years ago, and we've stayed close because we both enjoy walking around the city and discovering small, interesting places.<br><br>Alex is very keen on taking photos. He often notices a location he'd like to return to, but he usually saves the idea in a random note on his phone. Later, it can be difficult for him to find it among all his other messages and lists.<br><br>I'd choose the notebook carefully rather than just buy the first attractive one. It would need to be small enough to fit in his bag, with paper he could write and sketch on comfortably. I'd also look for a simple cover, because he prefers useful objects to things with lots of decoration.<br><br>To make it more personal, I'd write a short message inside and perhaps add a printed photograph from a trip we took together. I wouldn't fill the notebook with my own suggestions, though; the main point would be to give him space for his ideas.<br><br>I'd choose this gift because it connects with something he genuinely enjoys and shows that I've paid attention. It wouldn't be particularly expensive, but I think he would <mark class=\"idiom\">put it to good use(好好利用它)</mark>. <span class=\"conn\">For me</span>, a good present should feel thoughtful and suitable, rather than just make a big impression when it's opened.",
      "t": "我想给朋友Alex买一本优质笔记本，用来记录摄影想法。我们五年前在大学社团认识，都喜欢在城市里散步、发现有趣小地方，因此一直很亲近。<br><br>他喜欢摄影，常发现想再去拍的地点，却把想法随手存在手机里，后来容易淹没在其他信息中。<br><br>我会认真选：要能装进包，纸适合书写和画草图，封面简洁，因为他喜欢实用物品。<br><br>为了增加个人心意，我会在里面写短留言，也许放一张我们旅行时的照片。但不会塞满我的建议，因为主要是留空间给他的想法。<br><br>这份礼物联系他的真正兴趣，也表现我有关注。不一定贵，但他能好好利用。对我来说，好礼物要贴心、适合，而不只是拆开时显得惊人。",
      "p3": [
        {
          "q": "Are there any unlucky things that people should not buy as gifts in your country?",
          "a": "Some people avoid gifts whose names or symbolism suggest separation or bad luck, such as a clock in certain contexts. <span class=\"conn\">However</span>, customs vary, and not everyone follows them. I'd ask someone familiar with the recipient's preferences if I was unsure, rather than assume one tradition applies to <mark class=\"idiom\">every household(每个家庭)</mark>.",
          "t": "有些场合忌送寓意分离或不吉利的礼物，例如钟。但习俗不同，并非人人遵循。不确定时可问了解收礼者的人，不把一个传统套所有家庭。"
        },
        {
          "q": "What do people usually consider when buying gifts?",
          "a": "They consider the recipient's interests, the occasion and their budget. Practicality and personal meaning may matter more than price. <span class=\"conn\">For example</span>, a small item related to a hobby can feel thoughtful. I'd also think about whether it creates inconvenience, because a gift should be something the person can <mark class=\"idiom\">actually enjoy(真正享用)</mark>.",
          "t": "会看兴趣、场合、预算，实用和心意可能比价格重要。爱好相关小物很贴心，也应避免造成不便，让对方真正享受。"
        },
        {
          "q": "Which do people give on traditional festivals, red envelopes or other kinds of gifts?",
          "a": "Both are common in different situations. Red envelopes may be suitable for some family celebrations, while food or other gifts can be more appropriate on other occasions. <span class=\"conn\">So</span>, the relationship and local customs matter. I'd choose something that feels natural to the recipient, rather than follow a <mark class=\"idiom\">one-size-fits-all rule(一刀切规则)</mark>.",
          "t": "不同场合两者都常见。家庭庆祝可能给红包，其他时候送食品或物品。关系和习俗重要，应符合对方，而非固定规则。"
        },
        {
          "q": "Will people feel happy when receiving an expensive gift?",
          "a": "They might, especially if the gift is also useful or meaningful. <span class=\"conn\">But</span> a high price doesn't guarantee happiness. Someone may feel uncomfortable about the cost or think they need to return an equally expensive present. The best gift shows understanding and doesn't leave the recipient feeling <mark class=\"idiom\">under an obligation(有回报压力)</mark>.",
          "t": "可能，尤其同时有用或有意义。但贵不保证开心，也可能让人有等价回礼压力。好礼物体现理解，不制造义务感。"
        },
        {
          "q": "Is it hard to choose a gift?",
          "a": "It can be difficult if you don't know the person's interests or worry about choosing something they already own. <span class=\"conn\">However</span>, paying attention over time helps. A simple question about preferences may be better than guessing. I wouldn't aim for absolute perfection; a thoughtful choice can still <mark class=\"idiom\">hit the mark(选得合适)</mark> without being surprising.",
          "t": "不熟悉兴趣、担心重复时会难。平时留意或简单询问比猜更好，不需绝对完美，体贴的选择不惊喜也可合适。"
        },
        {
          "q": "When do people normally send gifts to others?",
          "a": "People give gifts for birthdays, weddings, festivals and important achievements. They may also bring a small present when visiting someone's home or thanking them for help. <span class=\"conn\">Sometimes</span>, there's no special occasion at all. A gift can simply be a way to show that someone has been <mark class=\"idiom\">on your mind(被你惦记着)</mark>.",
          "t": "生日、婚礼、节日、成就时常送礼，拜访或感谢也会。有时无需特殊场合，只为表达惦记。"

    {
      "id": "s26p2_60",

      "emoji": "🎒",
      "ztitle": "公共场所丢物品",
      "describe": "Describe an occasion that you lost something in public",
      "shouldsay": [

        "When and where you lost it",

        "And explain how you felt about it"
      ],
      "a": "An occasion when I lost something in public was last autumn, when I left my backpack in a café near the railway station. I'd stopped there before catching a train, and I was concentrating on the time because I didn't want to miss it.<br><br>The bag contained a notebook, a charger and a light jacket. Fortunately, my phone and ticket were in my pocket, but losing the notebook would still have been upsetting because it held a lot of work ideas.<br><br>I realised the bag was missing shortly after entering the station. My first reaction was panic, but I stopped and tried to <mark class=\"idiom\">retrace my steps(回想并沿原路查找)</mark>. I remembered putting it on the chair beside me in the café, so I found the café's phone number on my receipt and called.<br><br>A member of staff checked the seating area and said they had put the bag behind the counter. I explained what it looked like and named a couple of things inside to help confirm it was mine. Then I went back to collect it. I still had enough time before the train, although it was closer than I would have liked.<br><br>I felt relieved and grateful, especially because the staff had acted so quickly. The experience taught me to do a brief check whenever I leave a table or seat. Now I try to keep my bag where I can see it, rather than let it <mark class=\"idiom\">slip my mind(被我忘掉)</mark> when I'm in a hurry.",

          "t": "常感担忧、沮丧或尴尬，贵重难替代物品尤其如此。有纪念意义的东西即使便宜也难过。初步情绪过去后，行动能恢复掌控感。"

          "t": "固定位置、离座前检查、少带不必要东西有帮助。但没人时刻专注，简单习惯比不断警告自己或反复怀疑更现实。"

          "t": "奖励可能鼓励报告，尤其寻找费力时。但很多人无偿归还，奖励也不保证成功。清楚信息、联系正确场所可能更有效。"

        {

          "t": "会检查附近、沿路回找、联系工作人员或招领处，贵重物品也可能寻求官方帮助。先确定最后出现的位置，系统查找比慌乱跑更好。"

        {
          "q": "What kinds of things do people usually lose?",
          "a": "Small portable items such as keys, umbrellas, wallets and phones are easy to misplace. Bags may also be left behind when someone stands up quickly or changes transport. <span class=\"conn\">Often</span>, the problem isn't that the item disappeared mysteriously; it was put somewhere unusual and then <mark class=\"idiom\">slipped their mind(被忘记了)</mark>.",
          "t": "钥匙、伞、钱包、手机等小物易丢，起身或换交通时也会忘包。很多时候不是神秘消失，而是放在不常见位置后忘了。"

      "a": "A change that has saved me a lot of time is preparing the following day's work before I go to bed. I used to start each morning by searching for files, checking several messages and deciding what to do first. It didn't feel like much, but those small delays added up.<br><br>Now I spend about ten minutes in the evening making a short plan. I choose the three most important tasks, put the materials I need in one folder and check whether I have any appointments. I also leave my notebook and keys in their usual places so I don't have to look for them when I'm going out.<br><br>The change wasn't technically difficult. The hardest part was remembering to do it when I was tired. To make it easier, I linked it to something I already did every evening: putting my laptop away. Before closing it, I quickly organise the next day's work.<br><br><span class=\"conn\">Of course</span>, I don't plan every minute. Unexpected things still happen, and I leave some space to adjust. The aim is simply to avoid making the same small decisions repeatedly and to <mark class=\"idiom\">get off to a good start(有个顺利的开端)</mark>.<br><br>I feel pleased with this habit because my mornings are calmer and I can begin useful work sooner. It hasn't magically made me productive all the time, but it has removed a lot of unnecessary searching. It's a small change that gives me more <mark class=\"idiom\">breathing room(缓冲余地)</mark> without needing an expensive app or a complicated system.",
      "t": "一个为我节省很多时间的改变，是睡前准备第二天的工作。以前每天早晨找文件、看消息、决定先做什么，看似小事，累积起来却耗时。<br><br>现在我晚上花约十分钟列三个最重要任务，把材料放进一个文件夹，检查约会，并把笔记本和钥匙放回固定位置。<br><br>技术上不难，最难是累时仍记得做。我把它与每天收起电脑联系起来：关机前快速整理下一天。<br><br>我不会安排每一分钟，也给突发情况留空间。目的是减少重复的小决定，让一天有顺利开端。<br><br>这让我满意，因为早晨更平静，也更快开始有效工作。它没有神奇地让我时时高效，但减少了不必要的寻找，以小改变增加了余量，不需要贵应用或复杂系统。",

          "t": "可找重复任务、提前准备、减少频繁切换，明确优先事项。省时不等于去掉所有休息，而是有意识使用，不是全天加速。"

          "t": "父母日常示范很重要，可教规划和准备。学校也能强化，要求须适龄。是共同学习过程，不需父母独自完美完成。"

        {

          "t": "学校可分阶段项目、示范规划、讨论延误原因，给现实期限及调整机会。不只惩罚迟交，而是指导更好方法，把错误变成学习机会。"
        }

<script>
/* ---------------- state ---------------- */
const S = { view:"home", q:"", tag:"all", cat:"all", region:"all", mask:false, done:loadDone() };
function loadDone(){ try{ return JSON.parse(localStorage.getItem("oliver_spk_20260912_done_v1")||"{}"); }catch(e){ return {}; } }
function saveDone(){ try{ localStorage.setItem("oliver_spk_20260912_done_v1",JSON.stringify(S.done)); }catch(e){} }
function isDone(id){ return !!S.done[id]; }
function toggleDone(id){ if(S.done[id]) delete S.done[id]; else S.done[id]=1; saveDone(); }

const main = document.getElementById("main");
const TAGS = ["all","本季新题","保留题","万年老题","非大陆新题"];
const TAGLABEL = {all:"全部状态",本季新题:"本季新题",保留题:"保留题",万年老题:"万年老题","非大陆新题":"非大陆新题"};
const REGIONS = {all:"全部考区",mainland:"大陆题",nonmainland:"非大陆补充题"};
function regionPill(region){ return `<span class="regionpill">${REGIONS[region]||""}</span>`; }
function badgeClass(t){ return t==="本季新题"?"new":t==="保留题"?"keep":t==="万年老题"?"must":"cn"; }
const CATS = ["all","人物","地点","物品","经历","活动"];
const CATSTYLE = {
  人物:{fg:"#C2410C",bg:"rgba(194,65,12,.10)",bd:"rgba(194,65,12,.30)"},
  地点:{fg:"#2563B0",bg:"rgba(37,99,176,.10)",bd:"rgba(37,99,176,.30)"},
  物品:{fg:"#B45309",bg:"rgba(180,83,9,.11)",bd:"rgba(180,83,9,.30)"},
  经历:{fg:"#1F5435",bg:"rgba(31,84,53,.10)",bd:"rgba(31,84,53,.28)"},
  活动:{fg:"#7C3AED",bg:"rgba(124,58,237,.10)",bd:"rgba(124,58,237,.28)"}
};
function catPill(cat){ const c=CATSTYLE[cat]; if(!c) return ""; return `<span class="catpill" style="color:${c.fg};background:${c.bg};border-color:${c.bd}">${cat}</span>`; }
function catCount(c){ return c==="all"?DATA.cue.length:DATA.cue.filter(x=>x.cat===c).length; }

/* ---------------- tabs ---------------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  S.view=t.dataset.view; S.q=""; S.tag="all"; S.cat="all"; render();
});

/* ---------------- render ---------------- */
function render(){
  if(S.view==="home") return renderHome();
  if(S.view==="guide") return renderGuide();
  renderList(S.view); // part1 / cue
}

function controlsHTML(kind){
  const chips = TAGS.map(t=>`<div class="chip ${S.tag===t?'on':''}" data-tag="${t}">${TAGLABEL[t]}</div>`).join("");
  let catRow="";
  if(kind==="cue"){
    const cc = CATS.map(c=>{
      const on=S.cat===c;
      const st=(c!=="all"&&on)?` style="background:${CATSTYLE[c].fg};color:#fff;border-color:transparent"`:"";
      return `<div class="chip cat ${on?'on':''}" data-cat="${c}"${st}>${c==="all"?"全部":c}<span class="cc">${catCount(c)}</span></div>`;
    }).join("");
    catRow=`<div class="catbar"><span class="catbar-label">按类型</span><div class="chips" id="catchips">${cc}</div></div>`;
  }
  const regionRow=`<div class="catbar"><span class="catbar-label">按考区</span><div class="chips" id="regionchips">${Object.entries(REGIONS).map(([r,label])=>`<div class="chip ${S.region===r?'on':''}" data-region="${r}">${label}</div>`).join("")}</div></div>`;
  return `<div class="controls">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchbox" placeholder="搜索题目 / 话题…" value="${escAttr(S.q)}">
    </div>
    <div class="chips" id="chips">${chips}</div>
    ${regionRow}
    ${catRow}
    <div class="masktoggle ${S.mask?'on':''}" id="masktoggle"><span class="switch"></span>遮挡答案 · 自测</div>
  </div>`;
}
function wireControls(filterFn){
  const sb=document.getElementById("searchbox");
  if(sb){ sb.addEventListener("input",()=>{ S.q=sb.value; filterFn(); }); sb.focus({preventScroll:true});
          sb.setSelectionRange(sb.value.length,sb.value.length); }
  const chips=document.getElementById("chips");
  if(chips) chips.addEventListener("click",e=>{const c=e.target.closest(".chip"); if(!c)return; S.tag=c.dataset.tag; render();});
  const regionchips=document.getElementById("regionchips");
  if(regionchips) regionchips.addEventListener("click",e=>{const c=e.target.closest(".chip"); if(!c)return; S.region=c.dataset.region; render();});
  const catchips=document.getElementById("catchips");
  if(catchips) catchips.addEventListener("click",e=>{const c=e.target.closest(".chip"); if(!c)return; S.cat=c.dataset.cat; render();});
  const mt=document.getElementById("masktoggle");
  if(mt) mt.addEventListener("click",()=>{ S.mask=!S.mask; mt.classList.toggle("on",S.mask); });
}

function matchTag(item){ return S.tag==="all"||item.tag===S.tag; }
function matchCat(item){ return S.cat==="all"||item.cat===S.cat; }
function matchQuery(text){ if(!S.q.trim())return true; return text.toLowerCase().includes(S.q.trim().toLowerCase()); }

function renderList(kind){
  const items = kind==="part1"?DATA.part1:DATA.cue;
  main.innerHTML = `<div class="view">${controlsHTML(kind)}<div class="grid" id="grid"></div></div>`;
  const grid=document.getElementById("grid");
  function draw(){
    const list = items.filter(it=>{
      if(!matchTag(it)) return false;
      if(S.region!=="all" && it.region!==S.region) return false;
      if(kind==="cue" && !matchCat(it)) return false;
      const hay = kind==="part1"
        ? it.title+" "+it.items.map(q=>q.q).join(" ")
        : it.ztitle+" "+it.describe+" "+it.p3.map(p=>p.q).join(" ");
      return matchQuery(hay);
    });
    if(!list.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1">没有匹配的结果，换个关键词试试～</div>`; return; }
    grid.innerHTML = list.map(it=>cardHTML(kind,it)).join("");
  }
  draw();
  grid.addEventListener("click",e=>{const c=e.target.closest(".card"); if(!c)return; openDetail(kind,c.dataset.id);});
  wireControls(draw);
}

function cardHTML(kind,it){
  const done=isDone(it.id)?"done":"";
  if(kind==="part1"){
    const sub = it.items[0]? it.items[0].q.replace(/^\d+\.\s*/,'') : "";
    return `<div class="card ${done}" data-id="${it.id}">
      <div class="done-tick">✓</div>
      <span class="em">${it.emoji}</span>
      <h3>${escHTML(it.title)}</h3>
      <div class="sub">${escHTML(sub)}</div>
      <div class="meta"><span class="badge ${badgeClass(it.tag)}">${TAGLABEL[it.tag]}</span>${regionPill(it.region)}
        <span class="count">${it.count} 题</span></div>
    </div>`;
  } else {
    return `<div class="card ${done}" data-id="${it.id}">
      <div class="done-tick">✓</div>
      <span class="em">${it.emoji}</span>
      <h3>${escHTML(it.ztitle||it.describe)}</h3>
      <div class="sub">${escHTML(it.describe)}</div>
      <div class="meta"><span class="badge ${badgeClass(it.tag)}">${TAGLABEL[it.tag]}</span>${regionPill(it.region)}
        ${catPill(it.cat)}
        <span class="count">P3 · ${it.p3.length} 问</span></div>
    </div>`;
  }
}

/* ---------------- detail sheet ---------------- */
const scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet");
scrim.addEventListener("click",closeDetail);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });

function answerBlock(html){
  const m=S.mask?"masked":"";
  return `<div class="answer ${m}"><div class="atext">${html}</div>
    <div class="speech-player"></div>
    <div class="reveal-hint"><span class="ic">👁</span>点击显示参考答案</div></div>`;
}
function transBlock(t){
  if(!t) return "";
  return `<button class="trans-btn">显示中文译文</button><div class="trans">${t}</div>`;
}

/* ---------------- sentence-by-sentence read-aloud ---------------- */
const Speech = {
  supported:"speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  player:null, sentences:[], index:0, status:"idle", token:0, autoAdvance:false, pendingNext:false,
  voices:[], previewButton:null,
  voiceChoice:(()=>{ try{return localStorage.getItem("oliver_spk_voice_v2")||"auto";}catch(e){return "auto";} })()
};

function voiceKey(voice){
  return [voice.voiceURI||voice.name||"",voice.name||"",voice.lang||""].join("|||");
}

function isEnglishVoice(voice){
  return /^en(?:[-_]|$)/i.test(voice.lang||"") || /\bEnglish\b/i.test(voice.name||"");
}

function englishVoiceScore(voice){
  const name=`${voice.name||""} ${voice.voiceURI||""}`.toLowerCase();
  const lang=(voice.lang||"").toLowerCase();
  let score=0;
  if(lang.startsWith("en-gb")) score+=380;
  else if(lang.startsWith("en-ie")) score+=260;
  else if(lang.startsWith("en-au") || lang.startsWith("en-nz")) score+=220;
  else if(lang.startsWith("en-us") || lang.startsWith("en-ca")) score+=170;
  else score+=100;
  if(/\b(natural|neural)\b/.test(name)) score+=1200;
  if(/\b(online|premium|enhanced)\b/.test(name)) score+=650;
  if(/google uk english/.test(name)) score+=900;
  else if(/google us english/.test(name)) score+=760;
  else if(/\bgoogle\b/.test(name)) score+=620;
  if(/\b(libby|sonia|ryan|maisie|serena|daniel|kate|oliver|samantha|ava)\b/.test(name)) score+=420;
  if(voice.localService===false) score+=160;
  if(/\b(desktop|compact|espeak|festival|pico|mbrola)\b/.test(name)) score-=1200;
  return score;
}

function availableEnglishVoices(){
  if(!Speech.supported) return [];
  const current=window.speechSynthesis.getVoices().filter(isEnglishVoice);
  if(current.length) Speech.voices=current;
  return Speech.voices.slice().sort((a,b)=>englishVoiceScore(b)-englishVoiceScore(a) ||
    (a.name||"").localeCompare(b.name||""));
}

function voiceAccent(voice){
  const lang=(voice&&voice.lang||"").toLowerCase();
  if(lang.startsWith("en-gb")) return "英音";
  if(lang.startsWith("en-us")) return "美音";
  if(lang.startsWith("en-au")) return "澳音";
  if(lang.startsWith("en-ca")) return "加音";
  if(lang.startsWith("en-ie")) return "爱尔兰音";
  return "英语";
}

function shortVoiceName(voice){
  let name=(voice&&voice.name||"系统英文音色")
    .replace(/^Microsoft\s+/i,"")
    .replace(/\s*-\s*English\s*\([^)]*\)\s*$/i,"")
    .trim();
  return name||"系统英文音色";
}

function isNaturalVoice(voice){
  if(!voice) return false;
  const name=`${voice.name||""} ${voice.voiceURI||""}`.toLowerCase();
  return !/\b(desktop|compact|espeak|festival|pico|mbrola)\b/.test(name) &&
    (/\b(natural|neural|online|premium|enhanced)\b/.test(name) || /\bgoogle\b/.test(name) ||
      englishVoiceScore(voice)>=760);
}

function voiceOptionLabel(voice){
  return `${voiceAccent(voice)}｜${shortVoiceName(voice)}${isNaturalVoice(voice)?"｜较自然":""}`;
}

function bestEnglishVoice(){
  return availableEnglishVoices()[0]||null;
}

function preferredEnglishVoice(player){
  const voices=availableEnglishVoices();
  const select=player&&player.querySelector(".speech-voice");
  const choice=select?select.value:Speech.voiceChoice;
  if(choice && choice!=="auto"){
    const exact=voices.find(voice=>voiceKey(voice)===choice);
    if(exact) return exact;
  }
  return voices[0]||null;
}

function updateSpeechQuality(player){
  if(!player) return;
  const note=player.querySelector(".speech-quality");
  if(!note) return;
  const voice=preferredEnglishVoice(player);
  if(!voice){
    note.className="speech-quality warn";
    note.textContent="未检测到可选英文音色，将使用系统默认英音。";
  }else if(isNaturalVoice(voice)){
    note.className="speech-quality good";
    note.textContent=`当前：${voiceAccent(voice)} · ${shortVoiceName(voice)}（已避开老式机械音色）`;
  }else{
    note.className="speech-quality warn";
    note.textContent=`当前设备只检测到基础英文音色；可打开菜单逐个试听，换用更自然的音色。`;
  }
}

function populateVoiceSelect(select){
  if(!select) return;
  const voices=availableEnglishVoices();
  const requested=Speech.voiceChoice;
  select.innerHTML="";
  const best=voices[0]||null;
  select.add(new Option(best?`智能优选｜${shortVoiceName(best)}`:"智能优选｜系统默认英音","auto"));
  voices.forEach(voice=>select.add(new Option(voiceOptionLabel(voice),voiceKey(voice))));
  select.value=requested==="auto" || voices.some(voice=>voiceKey(voice)===requested)?requested:"auto";
}

function refreshSpeechVoices(){
  if(!Speech.supported) return;
  Speech.voices=window.speechSynthesis.getVoices().filter(isEnglishVoice);
  sheet.querySelectorAll(".speech-voice").forEach(select=>{
    populateVoiceSelect(select);
    updateSpeechQuality(select.closest(".speech-player"));
  });
}

function setSpeechVoiceChoice(choice){
  const voices=availableEnglishVoices();
  Speech.voiceChoice=choice==="auto" || voices.some(voice=>voiceKey(voice)===choice)?choice:"auto";
  try{localStorage.setItem("oliver_spk_voice_v2",Speech.voiceChoice);}catch(e){}
  sheet.querySelectorAll(".speech-voice").forEach(select=>{
    select.value=Speech.voiceChoice;
    updateSpeechQuality(select.closest(".speech-player"));
  });
}

function resetVoicePreviewButton(){
  if(!Speech.previewButton) return;
  Speech.previewButton.disabled=false;
  Speech.previewButton.textContent="试听音色";
  Speech.previewButton=null;
}

function previewSelectedVoice(player){
  if(!Speech.supported || !player) return;
  cancelSpeech("stopped");
  resetPreviousSpeechPlayer();
  const button=player.querySelector(".speech-preview");
  if(!button) return;
  Speech.token++;
  const token=Speech.token;
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance("Take your time, and speak clearly and naturally.");
  const voice=preferredEnglishVoice(player);
  if(voice) utterance.voice=voice;
  utterance.lang=voice?voice.lang:"en-GB";
  const rate=player.querySelector(".speech-speed");
  utterance.rate=rate?Number(rate.value):0.9;
  utterance.pitch=1;
  Speech.previewButton=button;
  button.disabled=true;
  button.textContent="试听中…";
  const finish=()=>{
    if(token===Speech.token) resetVoicePreviewButton();
  };
  utterance.onend=finish;
  utterance.onerror=finish;
  window.speechSynthesis.speak(utterance);
}

function cleanSpeechText(text){
  let out=(text||"").replace(/\u00a0/g," ");
  // Remove Chinese glosses such as “work overtime（加班工作）” before speaking.
  for(let i=0;i<3;i++){
    out=out.replace(/[（(][^()（）]*[\u3400-\u9fff][^()（）]*[)）]/g,"");
  }
  return out.replace(/[\u3400-\u9fff]+/g,"").replace(/[ \t]+/g," ").replace(/\s*\n\s*/g," ").trim();
}

function splitAnswerSentences(answerText){
  const text=cleanSpeechText(answerText);
  if(!text) return [];
  if(typeof Intl!=="undefined" && Intl.Segmenter){
    try{
      const seg=new Intl.Segmenter("en",{granularity:"sentence"});
      return Array.from(seg.segment(text),x=>x.segment.trim()).filter(Boolean);
    }catch(e){}
  }
  return (text.match(/[^.!?]+(?:[.!?]+["'’”]?)|[^.!?]+$/g)||[text]).map(x=>x.trim()).filter(Boolean);
}

function answerTextForSpeech(atext){
  const clone=atext.cloneNode(true);
  clone.querySelectorAll("br").forEach(br=>br.replaceWith(document.createTextNode("\n")));
  return clone.textContent||"";
}

function speechStatusLabel(){
  if(Speech.status==="speaking") return "正在朗读";
  if(Speech.status==="paused") return "已暂停";
  if(Speech.status==="stopped") return "已停止";
  if(Speech.status==="finished") return "朗读完成";
  return "准备朗读";
}

function updateSpeechPlayer(player){
  if(!player || !player._sentences || !player._sentences.length) return;
  const active=Speech.player===player;
  const index=active?Speech.index:(player._index||0);
  const status=active?Speech.status:"idle";
  player.classList.toggle("speaking",active && status==="speaking");
  const counter=player.querySelector(".speech-counter");
  const line=player.querySelector(".speech-line");
  const state=player.querySelector(".speech-state");
  const pause=player.querySelector(".speech-pause");
  const stop=player.querySelector(".speech-stop");
  if(counter) counter.textContent=`第 ${index+1} / ${player._sentences.length} 句`;
  if(line) line.textContent=player._sentences[index]||"";
  if(state) state.textContent=active?speechStatusLabel():"准备朗读";
  if(pause){
    pause.textContent=active && status==="paused"?"▶ 继续":"⏸ 暂停";
    pause.disabled=!active || !["speaking","paused"].includes(status);
  }
  if(stop) stop.disabled=!active || !["speaking","paused"].includes(status);
  const prev=player.querySelector(".speech-prev");
  const next=player.querySelector(".speech-next");
  if(prev) prev.disabled=index<=0;
  if(next) next.disabled=index>=player._sentences.length-1;
}

function resetPreviousSpeechPlayer(){
  if(!Speech.player) return;
  Speech.player._index=Speech.index;
  const previous=Speech.player;
  Speech.player=null; Speech.sentences=[]; Speech.index=0; Speech.autoAdvance=false; Speech.pendingNext=false;
  updateSpeechPlayer(previous);
}

function cancelSpeech(status="stopped"){
  Speech.token++;
  if(Speech.supported) window.speechSynthesis.cancel();
  resetVoicePreviewButton();
  if(Speech.player){
    Speech.status=status;
    Speech.autoAdvance=false;
    Speech.pendingNext=false;
    updateSpeechPlayer(Speech.player);
  }
}

function speakCurrentSentence(token){
  if(!Speech.supported || !Speech.player || token!==Speech.token) return;
  const sentence=Speech.sentences[Speech.index];
  if(!sentence) return;
  const utterance=new SpeechSynthesisUtterance(sentence);
  const voice=preferredEnglishVoice(Speech.player);
  if(voice) utterance.voice=voice;
  utterance.lang=voice?voice.lang:"en-GB";
  const rate=Speech.player.querySelector(".speech-speed");
  utterance.rate=rate?Number(rate.value):0.9;
  utterance.pitch=1;
  utterance.onstart=()=>{
    if(token!==Speech.token) return;
    Speech.status="speaking";
    updateSpeechPlayer(Speech.player);
  };
  utterance.onend=()=>{
    if(token!==Speech.token || !Speech.player) return;
    if(Speech.autoAdvance && Speech.index<Speech.sentences.length-1){
      Speech.index++;
      Speech.pendingNext=true;
      Speech.player._index=Speech.index;
      updateSpeechPlayer(Speech.player);
      window.setTimeout(()=>{
        if(token===Speech.token && Speech.status!=="paused" && Speech.pendingNext){
          Speech.pendingNext=false;
          speakCurrentSentence(token);
        }
      },260);
    }else{
      Speech.status=Speech.autoAdvance?"finished":"idle";
      Speech.autoAdvance=false;
      Speech.pendingNext=false;
      updateSpeechPlayer(Speech.player);
    }
  };
  utterance.onerror=()=>{
    if(token!==Speech.token || !Speech.player) return;
    Speech.status="stopped";
    Speech.autoAdvance=false;
    Speech.pendingNext=false;
    updateSpeechPlayer(Speech.player);
  };
  window.speechSynthesis.speak(utterance);
}

function startSpeech(player,index,autoAdvance){
  if(!Speech.supported || !player || !player._sentences.length) return;
  if(Speech.player && Speech.player!==player){
    cancelSpeech("stopped");
    resetPreviousSpeechPlayer();
  }else{
    Speech.token++;
    window.speechSynthesis.cancel();
  }
  Speech.player=player;
  Speech.sentences=player._sentences;
  Speech.index=Math.max(0,Math.min(index,Speech.sentences.length-1));
  Speech.player._index=Speech.index;
  Speech.status="speaking";
  Speech.autoAdvance=autoAdvance;
  Speech.pendingNext=false;
  const token=Speech.token;
  updateSpeechPlayer(player);
  speakCurrentSentence(token);
}

function toggleSpeechPause(player){
  if(!Speech.supported || Speech.player!==player) return;
  if(Speech.status==="speaking"){
    window.speechSynthesis.pause();
    Speech.status="paused";
  }else if(Speech.status==="paused"){
    window.speechSynthesis.resume();
    Speech.status="speaking";
    if(Speech.pendingNext){
      Speech.pendingNext=false;
      speakCurrentSentence(Speech.token);
    }
  }
  updateSpeechPlayer(player);
}

function buildSpeechPlayers(){
  sheet.querySelectorAll(".answer").forEach(answer=>{
    const player=answer.querySelector(".speech-player");
    const atext=answer.querySelector(".atext");
    if(!player || !atext) return;
    const sentences=splitAnswerSentences(answerTextForSpeech(atext));
    player._sentences=sentences;
    player._index=0;
    if(!Speech.supported){
      player.innerHTML=`<div class="speech-unsupported">当前浏览器不支持答案朗读，请使用最新版 Chrome、Edge 或 Safari。</div>`;
      return;
    }
    if(!sentences.length){ player.remove(); return; }
    player.innerHTML=`
      <div class="speech-top">
        <button type="button" class="speech-btn primary speech-start">▶ 逐句朗读</button>
        <button type="button" class="speech-btn pause speech-pause" disabled>⏸ 暂停</button>
        <button type="button" class="speech-btn speech-stop" disabled>■ 停止</button>
      </div>
      <div class="speech-settings">
        <label class="speech-field voice">音色
          <select class="speech-voice" aria-label="英文朗读音色">
            <option value="auto">正在载入英文音色…</option>
          </select>
        </label>
        <button type="button" class="speech-btn speech-preview">试听音色</button>
        <label class="speech-field">语速
          <select class="speech-speed" aria-label="朗读语速">
            <option value="0.75">0.75×</option>
            <option value="0.9" selected>0.9×</option>
            <option value="1">1.0×</option>
          </select>
        </label>
        <div class="speech-quality"></div>
      </div>
      <div class="speech-nav">
        <button type="button" class="speech-btn speech-prev" disabled>← 上一句</button>
        <button type="button" class="speech-btn speech-repeat">↻ 重读本句</button>
        <button type="button" class="speech-btn speech-next"${sentences.length===1?" disabled":""}>下一句 →</button>
      </div>
      <div class="speech-now">
        <div class="speech-status"><span class="speech-counter">第 1 / ${sentences.length} 句</span><span class="speech-state">准备朗读</span></div>
        <div class="speech-line">${escHTML(sentences[0])}</div>
      </div>`;
    populateVoiceSelect(player.querySelector(".speech-voice"));
    updateSpeechQuality(player);
    player.querySelector(".speech-start").addEventListener("click",e=>{ e.stopPropagation(); startSpeech(player,0,true); });
    player.querySelector(".speech-pause").addEventListener("click",e=>{ e.stopPropagation(); toggleSpeechPause(player); });
    player.querySelector(".speech-stop").addEventListener("click",e=>{ e.stopPropagation(); cancelSpeech("stopped"); });
    player.querySelector(".speech-preview").addEventListener("click",e=>{ e.stopPropagation(); previewSelectedVoice(player); });
    player.querySelector(".speech-voice").addEventListener("change",e=>{
      e.stopPropagation();
      const wasActive=Speech.player===player && ["speaking","paused"].includes(Speech.status);
      const index=Speech.index, autoAdvance=Speech.autoAdvance;
      setSpeechVoiceChoice(e.target.value);
      if(wasActive) startSpeech(player,index,autoAdvance);
    });
    player.querySelector(".speech-prev").addEventListener("click",e=>{
      e.stopPropagation(); const i=Speech.player===player?Speech.index:player._index; startSpeech(player,i-1,false);
    });
    player.querySelector(".speech-repeat").addEventListener("click",e=>{
      e.stopPropagation(); const i=Speech.player===player?Speech.index:player._index; startSpeech(player,i,false);
    });
    player.querySelector(".speech-next").addEventListener("click",e=>{
      e.stopPropagation(); const i=Speech.player===player?Speech.index:player._index; startSpeech(player,i+1,false);
    });
    player.querySelector(".speech-speed").addEventListener("change",()=>{
      if(Speech.player===player && ["speaking","paused"].includes(Speech.status)){
        startSpeech(player,Speech.index,Speech.autoAdvance);
      }
    });
  });
}

if(Speech.supported){
  refreshSpeechVoices();
  if(window.speechSynthesis.addEventListener){
    window.speechSynthesis.addEventListener("voiceschanged",refreshSpeechVoices);
  }else{
    window.speechSynthesis.onvoiceschanged=refreshSpeechVoices;
  }
}

function openDetail(kind,id){

  let body="";
  if(kind==="part1"){
    body = it.items.map((q,i)=>`
      <div class="qblock">

        ${answerBlock(q.a)}
        ${transBlock(q.t)}

    sheet.innerHTML = sheetHead(it.emoji, it.title, "", it.tag, it.id) +
      `<div class="sheet-body">${markBtn(it.id)}${body}</div>`;
  } else {

    const p3 = it.p3.map((p,i)=>`
      <div class="qblock">
        <div class="qhead"><span class="qmark">${escHTML((p.q.match(/^\d+\)/)||[`${i+1})`])[0])}</span><span>${escHTML(p.q.replace(/^\d+\)\s*/,''))}</span></div>

function sheetHead(em,title,dz,tag,id,cat){

function markBtn(id){

function wireSheet(){

  });
  const md=sheet.querySelector(".mark-done");
  if(md) md.addEventListener("click",()=>{ const id=md.dataset.id; toggleDone(id);
    const d=isDone(id); md.classList.toggle("done",d); md.textContent=d?"✓ 已掌握（点击取消）":"标记为已掌握"; });
}
function closeDetail(){
  cancelSpeech("stopped");
  resetPreviousSpeechPlayer();
  const wasOpen=sheet.classList.contains("open");
  scrim.classList.remove("open"); sheet.classList.remove("open"); document.body.style.overflow="";
  if(wasOpen) render();
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden && Speech.status==="speaking") toggleSpeechPause(Speech.player); });
window.addEventListener("beforeunload",()=>{ if(Speech.supported) window.speechSynthesis.cancel(); });
