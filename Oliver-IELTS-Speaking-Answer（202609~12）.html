<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oliver 雅思口语题库 · 2026·9–12月</title>
<style>
:root{
  --green:#1F5435; --green2:#2E7D55; --green-soft:#3C8A63;
  --gold:#F2B705; --gold-deep:#D99A02;
  --ink:#23312A; --ink-soft:#4A5A52; --muted:#7A8A82;
  --blue:#2563B0; --red:#D14836;
  --idiom:rgba(242,183,5,.30);
  --idiom-line:rgba(217,154,2,.65);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.74);
  --glass-line:rgba(255,255,255,.72);
  --shadow:0 14px 44px -16px rgba(31,84,53,.30);
  --shadow-sm:0 6px 20px -10px rgba(31,84,53,.26);
  --radius:24px; --radius-sm:16px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,"Hiragino Sans GB",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--sans); color:var(--ink); line-height:1.6;
  background:#EAF0EC; min-height:100%;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* ---------- ambient gradient background ---------- */
.bg{position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(120% 90% at 8% 0%, #FCEFD9 0%, transparent 45%),
    radial-gradient(110% 90% at 100% 8%, #FBE7C4 0%, transparent 42%),
    linear-gradient(135deg,#FBF3E4 0%,#F4EAD8 20%,#E9F1E6 50%,#E1EBF4 78%,#DEE8F5 100%);
}
.blob{position:fixed; z-index:-1; border-radius:50%; filter:blur(72px); opacity:.62; pointer-events:none;
  animation:drift 26s ease-in-out infinite;}
.blob.g{width:46vw;height:46vw;left:-10vw;top:-8vw;background:radial-gradient(circle at 40% 40%,#92D4AC,transparent 70%);}
.blob.y{width:40vw;height:40vw;right:-9vw;top:4vh;background:radial-gradient(circle at 50% 50%,#FBDE86,transparent 70%);animation-delay:-8s;}
.blob.b{width:52vw;height:52vw;left:16vw;bottom:-24vh;background:radial-gradient(circle at 50% 50%,#9DC6EF,transparent 70%);animation-delay:-15s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(4vw,3vh) scale(1.08);}66%{transform:translate(-3vw,-2vh) scale(.95);}}

.wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px;}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;padding-top:16px;}
.topbar{
  background:var(--glass); backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--glass-line); border-radius:22px; box-shadow:var(--shadow-sm);
  padding:14px 20px;
}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mark{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--green),var(--green-soft));color:#fff;font-weight:800;font-size:22px;
  box-shadow:0 8px 18px -6px rgba(31,84,53,.55);position:relative;}
.mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:6px;
  background:var(--gold);box-shadow:0 4px 10px -2px rgba(217,154,2,.7);}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--green);line-height:1.15;}
.brand .en{font-size:11.5px;font-weight:700;letter-spacing:.18em;color:var(--green2);text-transform:uppercase;opacity:.85;}
.brand{margin-right:auto;}
.season{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.pill-season{font-size:12px;font-weight:700;color:var(--green);background:rgba(255,255,255,.6);
  border:1px solid var(--glass-line);padding:5px 12px;border-radius:999px;}
.contact{font-size:11.5px;color:var(--muted);font-weight:600;}
.contact b{color:var(--green2);}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.tab{font-size:14px;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.5);padding:9px 18px;border-radius:999px;cursor:pointer;
  transition:.22s;display:flex;align-items:center;gap:7px;}
.tab:hover{background:rgba(255,255,255,.72);transform:translateY(-1px);}
.tab.active{background:linear-gradient(150deg,var(--green),var(--green-soft));color:#fff;border-color:transparent;
  box-shadow:0 8px 18px -6px rgba(31,84,53,.5);}
.tab .em{font-size:15px;}

/* ---------- controls ---------- */
.regionpill{font-size:10px;color:var(--ink-soft);padding:3px 7px;border:1px solid rgba(31,84,53,.16);border-radius:999px;white-space:nowrap;}
.source-note{font-size:12px;color:#78581f;background:rgba(242,183,5,.12);border:1px solid rgba(217,154,2,.25);border-radius:10px;padding:9px 12px;margin:8px 0;}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 18px;}
.search{flex:1;min-width:220px;position:relative;}
.search input{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--ink);
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-line);border-radius:14px;padding:12px 16px 12px 42px;outline:none;transition:.2s;}
.search input:focus{border-color:var(--green-soft);box-shadow:0 0 0 4px rgba(60,138,99,.14);}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{font-size:12.5px;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,.45);
  border:1px solid rgba(255,255,255,.55);padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s;}
.chip:hover{background:rgba(255,255,255,.75);}
.chip.on{background:var(--green);color:#fff;border-color:transparent;}
.catbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;margin-top:-2px;}
.catbar-label{font-size:11px;font-weight:800;color:var(--ink-soft);opacity:.65;letter-spacing:.06em;white-space:nowrap;}
.chip.cat .cc{margin-left:6px;font-size:10px;font-weight:800;opacity:.6;}
.chip.cat.on .cc{opacity:.9;}
.catpill{font-size:11px;font-weight:800;border:1px solid transparent;border-radius:999px;padding:3px 9px;letter-spacing:.04em;white-space:nowrap;}
.masktoggle{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--ink-soft);
  background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.55);padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s;}
.masktoggle:hover{background:rgba(255,255,255,.75);}
.masktoggle.on{background:var(--gold);color:#3a2c00;border-color:transparent;box-shadow:0 6px 14px -6px rgba(217,154,2,.6);}
.switch{width:34px;height:19px;border-radius:999px;background:rgba(0,0,0,.16);position:relative;transition:.2s;flex:none;}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.masktoggle.on .switch{background:rgba(58,44,0,.4);}
.masktoggle.on .switch::after{left:17px;}

/* ---------- grid & cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px;}
.card{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--glass-line);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:20px 20px 18px;cursor:pointer;transition:.26s cubic-bezier(.2,.7,.2,1);position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--green),var(--gold));opacity:0;transition:.26s;}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);background:var(--glass-strong);}
.card:hover::before{opacity:1;}
.card .em{font-size:30px;line-height:1;display:block;margin-bottom:12px;}
.card h3{font-size:16.5px;font-weight:800;color:var(--green);letter-spacing:-.01em;margin-bottom:3px;line-height:1.3;}
.card .sub{font-size:12.5px;color:var(--muted);font-weight:600;font-family:var(--serif);font-style:italic;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em;}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.02em;}
.badge.new{background:rgba(242,183,5,.2);color:var(--gold-deep);}
.badge.keep{background:rgba(37,99,176,.14);color:var(--blue);}
.badge.must{background:rgba(31,84,53,.13);color:var(--green);}
.badge.cn{background:rgba(209,72,54,.13);color:var(--red);}
.count{font-size:12px;font-weight:700;color:var(--ink-soft);margin-left:auto;display:flex;align-items:center;gap:4px;}
.done-tick{position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;
  background:var(--green);display:none;place-items:center;color:#fff;font-size:14px;box-shadow:var(--shadow-sm);}
.card.done .done-tick{display:grid;}
.card.done{background:rgba(233,244,237,.6);}

.empty{text-align:center;padding:70px 20px;color:var(--muted);font-weight:600;}

/* ---------- overview ---------- */
.hero{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--glass-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 32px;margin-bottom:20px;}
.hero h2{font-size:26px;font-weight:800;color:var(--green);letter-spacing:-.02em;margin-bottom:10px;}
.hero p{color:var(--ink-soft);max-width:64ch;font-size:14.5px;}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:24px;}
.stat{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:var(--radius-sm);padding:18px 20px;}
.stat .n{font-size:32px;font-weight:800;color:var(--green);letter-spacing:-.02em;line-height:1;font-feature-settings:"tnum";}
.stat .n small{font-size:15px;font-weight:700;color:var(--green2);margin-left:3px;}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px;}
.legend{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-line);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:24px 28px;margin-bottom:20px;}
.legend h4,.howto h4{font-size:13px;font-weight:800;color:var(--green);letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px;}
.legitems{display:flex;gap:22px;flex-wrap:wrap;}
.legitem{font-size:14px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:8px;}
.swatch{padding:2px 9px;border-radius:7px;font-weight:700;font-size:13.5px;}
.howto{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-line);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:24px 28px;}
.howto ol{padding-left:18px;color:var(--ink-soft);font-size:14px;}
.howto li{margin-bottom:9px;}
.howto b{color:var(--green);}

/* ---------- modal / detail ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(31,46,38,.34);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:.28s;}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(820px,94vw);max-height:90vh;overflow-y:auto;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.7,.2,1);
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.78));
  backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  border:1px solid var(--glass-line);border-radius:26px;box-shadow:0 30px 80px -20px rgba(20,46,33,.5);}
.sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.sheet-head{position:sticky;top:0;z-index:2;padding:22px 28px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.55));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(31,84,53,.08);
  border-radius:26px 26px 0 0;display:flex;align-items:flex-start;gap:14px;}
.sheet-head .em{font-size:34px;line-height:1;flex:none;}
.sheet-head .tt{flex:1;min-width:0;}
.sheet-head h2{font-size:21px;font-weight:800;color:var(--green);letter-spacing:-.01em;line-height:1.25;}
.sheet-head .dz{font-size:14px;color:var(--ink-soft);font-weight:600;font-family:var(--serif);font-style:italic;margin-top:3px;}
.sheet-head .meta{margin-top:10px;}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(255,255,255,.6);
  cursor:pointer;font-size:18px;color:var(--ink-soft);display:grid;place-items:center;transition:.2s;}
.x:hover{background:#fff;color:var(--green);transform:rotate(90deg);}
.sheet-body{padding:8px 28px 30px;}

.mark-done{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:6px 0 18px;
  font-size:13.5px;font-weight:700;padding:11px;border-radius:13px;cursor:pointer;transition:.2s;
  background:rgba(255,255,255,.55);border:1px solid var(--glass-line);color:var(--green);}
.mark-done:hover{background:#fff;}
.mark-done.done{background:var(--green);color:#fff;border-color:transparent;}

/* cue exam card */
.cuecard{background:linear-gradient(160deg,rgba(234,244,255,.85),rgba(245,250,255,.7));
  border:1.5px solid rgba(37,99,176,.22);border-radius:18px;padding:20px 22px;margin-bottom:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px -12px rgba(37,99,176,.4);}
.cuecard .lab{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;opacity:.8;}
.cuecard .desc{font-size:17px;font-weight:800;color:var(--blue);font-style:italic;margin:6px 0 14px;line-height:1.4;}
.cuecard ul{list-style:none;display:flex;flex-direction:column;gap:8px;}
.cuecard li{font-size:14.5px;font-weight:600;color:#2c3f56;padding-left:22px;position:relative;}
.cuecard li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--blue);opacity:.7;}

.qblock{margin-bottom:18px;}
.qhead{font-size:15.5px;font-weight:800;color:var(--blue);line-height:1.4;margin-bottom:8px;
  display:flex;gap:9px;align-items:flex-start;}
.qhead .qmark{flex:none;font-size:11px;font-weight:800;background:rgba(37,99,176,.13);color:var(--blue);
  padding:3px 8px;border-radius:7px;margin-top:2px;letter-spacing:.04em;}
.section-label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green2);
  margin:26px 0 14px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:"";flex:1;height:1px;background:rgba(31,84,53,.15);}

.answer{font-family:var(--serif);font-size:15.5px;line-height:1.8;color:#2a382f;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:16px 18px;position:relative;transition:.22s;}
.answer mark.idiom{background:var(--idiom);box-shadow:inset 0 -.5em 0 var(--idiom);border-radius:3px;padding:0 1px;
  color:#3a2c00;font-weight:600;font-family:var(--sans);font-size:14.5px;}
.answer .conn{color:var(--red);font-weight:700;font-style:normal;}
.answer strong{font-weight:700;color:#1f2c25;}
/* sentence-by-sentence read-aloud player */
.speech-player{font-family:var(--sans);margin-top:14px;padding:12px;
  background:linear-gradient(145deg,rgba(232,244,237,.82),rgba(241,247,244,.68));
  border:1px solid rgba(31,84,53,.14);border-radius:12px;}
.speech-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.speech-btn{font-family:var(--sans);font-size:12px;font-weight:750;line-height:1;
  color:var(--green);background:rgba(255,255,255,.76);border:1px solid rgba(31,84,53,.18);
  border-radius:9px;padding:9px 11px;cursor:pointer;transition:.18s;white-space:nowrap;}
.speech-btn:hover:not(:disabled){background:#fff;transform:translateY(-1px);box-shadow:0 5px 12px -8px rgba(31,84,53,.55);}
.speech-btn.primary{color:#fff;background:var(--green);border-color:var(--green);}
.speech-btn.pause{color:#3a2c00;background:rgba(242,183,5,.28);border-color:rgba(217,154,2,.35);}
.speech-btn:disabled{opacity:.42;cursor:not-allowed;}
.speech-settings{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:7px;margin-top:9px;}
.speech-field{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:750;color:var(--ink-soft);min-width:0;}
.speech-field select{font:inherit;color:var(--green);background:rgba(255,255,255,.82);
  border:1px solid rgba(31,84,53,.18);border-radius:8px;padding:7px 8px;outline:none;}
.speech-field.voice select{width:100%;min-width:0;text-overflow:ellipsis;}
.speech-quality{grid-column:1/-1;font-size:10.5px;line-height:1.45;color:var(--muted);padding-left:1px;}
.speech-quality.good{color:var(--green2);}
.speech-quality.warn{color:#8a5b00;}
.speech-nav{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.speech-nav .speech-btn{padding:8px 10px;}
.speech-now{margin-top:9px;padding:9px 10px;background:rgba(255,255,255,.58);border-radius:9px;
  border-left:3px solid rgba(31,84,53,.32);transition:.18s;}
.speech-player.speaking .speech-now{background:rgba(255,255,255,.88);border-left-color:var(--gold-deep);}
.speech-status{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:10.5px;font-weight:800;color:var(--green2);letter-spacing:.03em;margin-bottom:3px;}
.speech-line{font-family:var(--serif);font-size:13.5px;line-height:1.55;color:#314139;}
.speech-unsupported{font-size:12px;line-height:1.55;color:var(--muted);}
/* masked self-test */
.answer.masked{user-select:none;}
.answer.masked .reveal-hint{display:flex;}
.answer.masked > .atext{filter:blur(7px);opacity:.55;pointer-events:none;}
.answer.masked > .speech-player{display:none;}
.reveal-hint{display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:8px;
  font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--green);cursor:pointer;
  background:rgba(255,255,255,.25);border-radius:14px;}
.reveal-hint .ic{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;}

.trans-btn{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--green2);background:rgba(31,84,53,.07);
  border:1px solid rgba(31,84,53,.12);border-radius:999px;padding:6px 14px;cursor:pointer;margin-top:10px;transition:.2s;
  display:inline-flex;align-items:center;gap:6px;}
.trans-btn:hover{background:rgba(31,84,53,.13);}
.trans{font-family:var(--sans);font-size:14px;line-height:1.75;color:#5b4a50;
  background:rgba(248,228,236,.5);border:1px solid rgba(209,72,54,.14);border-radius:12px;
  padding:13px 16px;margin-top:9px;display:none;}
.trans.show{display:block;animation:fade .25s ease;}
.trans::before{content:"译";font-weight:800;font-size:11px;color:var(--red);background:rgba(209,72,54,.13);
  padding:2px 7px;border-radius:6px;margin-right:8px;}
@keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}

.view{animation:viewin .32s ease;}
@keyframes viewin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

footer{text-align:center;color:var(--muted);font-size:12px;font-weight:600;padding:30px 0 10px;}
footer b{color:var(--green2);}

@media (max-width:640px){
  .wrap{padding:0 14px 60px;}
  .grid{grid-template-columns:1fr 1fr;gap:13px;}
  .card{padding:16px 15px 15px;border-radius:20px;}
  .card .em{font-size:25px;}
  .card h3{font-size:14.5px;}
  .sheet{width:100vw;max-height:92vh;top:auto;bottom:0;left:0;transform:translateY(8%);border-radius:26px 26px 0 0;}
  .sheet.open{transform:translateY(0);}
  .sheet-head{padding:18px 18px 14px;} .sheet-body{padding:6px 18px 26px;}
  .brand h1{font-size:17px;} .season{display:none;}
  .hero{padding:26px 20px;}
  .speech-top{align-items:stretch;}
  .speech-btn{padding:10px 11px;}
  .speech-settings{grid-template-columns:minmax(0,1fr) auto;}
  .speech-field.voice{grid-column:1/-1;}
}

      "a": "An important decision that worked out well for me was joining a small public-speaking course last year. At the time, I was comfortable talking to people individually, but standing in front of a group still made me nervous. I sometimes turned down opportunities because I worried about forgetting what I wanted to say.<br><br>I decided to take the course after a friend invited me to give a short presentation at a community event. I realised that avoiding the problem was only making it bigger. <span class=\"conn\">However</span>, signing up wasn't an easy decision. The classes took place on Saturday mornings, and I wasn't sure whether I wanted to spend both money and my free time on something uncomfortable.<br><br>What helped was visiting a trial lesson. The teacher didn't expect us to be polished speakers. She asked us to tell a simple story, then gave us one practical suggestion at a time. That approach made the challenge feel <mark class=\"idiom\">within reach(可以做到)</mark>. Over the following weeks, I practised regularly and learned to speak from a few key points instead of memorising every word.<br><br><span class=\"conn\">In the end</span>, I gave the presentation and actually enjoyed it. It wasn't flawless, but I could <mark class=\"idiom\">think on my feet(临场应变)</mark> when someone asked a question. I was happy with the result because the decision gave me more than a new skill. It helped me stop letting nervousness <mark class=\"idiom\">hold me back(阻碍我)</mark>.",
      "t": "去年，我做了一个效果很好的重要决定：报名参加小班公众演讲课。那时我能轻松地与人单独交谈，但当众说话仍会紧张，有时因此拒绝机会。<br><br>一位朋友邀请我在社区活动中做简短分享后，我意识到逃避只会让问题扩大。不过课程占用周六上午，还需要花钱，报名并不容易。<br><br>试听课改变了我的想法。老师不要求完美，而是让我们讲简单的故事，每次只给一个实用建议。挑战因此变得可实现。之后几周，我规律练习，学会用要点表达，而不是逐字背诵。<br><br>最后，我完成了分享，甚至享受这个过程。虽然不是毫无瑕疵，但我能应对现场提问。我开心的原因不只是学会了一项技能，而是终于不再让紧张阻碍自己。",

          "q": "Which is better, to make a decision quickly or slowly?",
          "a": "It depends on the consequences. For a small, reversible choice, deciding quickly can prevent unnecessary worry. <span class=\"conn\">However</span>, a decision about a job or a home deserves more thought. I'd compare the options and set a deadline, so careful thinking doesn't turn into endless <mark class=\"idiom\">going back and forth(反复犹豫)</mark>.",
          "t": "这取决于后果。小而可撤回的选择可以快些决定，工作或住房等决定则值得深思。我会比较选项并设期限，避免考虑变成无休止的犹豫。"
        },
        {
          "q": "Do you think most people's decisions are made in their 20s?",
          "a": "People often make major decisions in their twenties, such as choosing a career or a partner. <span class=\"conn\">But</span> I wouldn't say most decisions are confined to that period. People change jobs, move and take on new responsibilities later too. Important choices tend to <mark class=\"idiom\">come in stages(在不同阶段出现)</mark> throughout life.",
          "t": "二十多岁常会决定职业、伴侣等大事，但重要决定不只属于这个时期。后来也会换工作、搬家和承担新责任，人生不同阶段都有重要选择。"

          "t": "人们每天决定穿什么、吃什么、怎么上班，也选择何时回消息或休息。小选择长期会影响生活习惯和消费。建立几个合理的固定做法能让生活更轻松。"

      "a": "I'd like to talk about my cousin Daniel, who completed his first half marathon after several months of training. I know him well because we grew up together, and he has never been the naturally sporty person in our family.<br><br>When he first decided to enter the race, even running for ten minutes was difficult for him. He also had a full-time job, so finding time to train was a challenge. Instead of trying to transform himself overnight, he made a realistic plan and started with short runs three evenings a week.<br><br>I think he succeeded mainly because he was patient and consistent. He kept a simple training diary, joined a beginners' running group and asked more experienced runners for advice. <span class=\"conn\">When</span> he missed a session because of work, he adjusted the plan rather than giving up. He was also sensible enough to rest when he needed to, instead of pushing himself just to impress people.<br><br>On race day, I went to cheer him on. He wasn't trying to win; his goal was to finish at a steady pace. Seeing him cross the line with a huge smile was genuinely moving. All those small efforts had finally <mark class=\"idiom\">paid off(取得回报)</mark>.<br><br>I admire him because he proved that progress doesn't always come from talent. Sometimes it comes from being willing to <mark class=\"idiom\">stick with something(坚持做某事)</mark> when the results are slow. His experience encouraged me to be more patient with my own goals.",
      "t": "我想说的是表哥Daniel。他训练了几个月，完成了人生第一次半程马拉松。我们一起长大，所以我很了解他。他从来不是家里运动天赋最好的那个。<br><br>刚报名时，他连跑十分钟都觉得困难，还要兼顾全职工作。他没有试图一夜之间改变自己，而是制定现实的计划，每周三个晚上进行短距离训练。<br><br>他成功主要靠耐心和持续行动。他记录训练，加入新手跑步群，并向有经验的人请教。工作导致缺练时，他会调整计划，而不是放弃；需要休息时也不会为了表现硬撑。<br><br>比赛当天我去为他加油。他的目标不是夺冠，而是稳定地完成。看到他笑着冲过终点，我非常感动，那些小努力终于有了回报。<br><br>我敬佩他，因为他证明进步不一定来自天赋，也可能来自结果缓慢时仍愿意坚持。这也让我对自己的目标更有耐心。",

        {
          "q": "In which sectors are companies more likely to succeed in China?",

          "t": "我认为解决日常问题的领域可能有机会，例如实用数字服务、教育和环保产品。但热门领域不保证成功，企业仍要有顾客、可靠品质和可行模式，满足真实需求。"

          "t": "信任和明确目的很重要。伤害员工或让顾客失望，短期利润可能无法持续。公平解决投诉能建立忠诚，企业应提供价值、赢得信任，而不只盯着下一笔销售。"

          "t": "金钱可以衡量部分成功，企业尤其需要收入生存。但关系、工作价值和满足感也重要。有的人挣很多却不快乐，因此我不会把金钱和成功完全等同。"

      "a": "A happy person I know is my colleague Emma. We met when we worked on the same teaching project about two years ago, and we still have lunch together quite regularly. She's friendly and energetic, but what I like most is that her happiness doesn't feel forced.<br><br>Emma enjoys small things that other people might overlook. She gets excited about finding a nice café, learning a new guitar chord or making a meal that turns out well. When something good happens, she'll tell us about it with a big smile, and her enthusiasm often <mark class=\"idiom\">rubs off on(感染)</mark> the rest of us.<br><br>One example was a rainy afternoon when our outdoor team activity had to be cancelled. Everyone was a bit disappointed, but Emma suggested an indoor quiz and brought out some snacks she had packed. She didn't pretend the weather was wonderful; she simply helped us make the best of the situation.<br><br><span class=\"conn\">Of course</span>, she has difficult days too. She talks honestly about them and asks for help when necessary. I think that's partly why she seems happy overall: she doesn't expect life to be perfect, and she doesn't spend every day comparing herself with other people.<br><br>Being around her reminds me to <mark class=\"idiom\">appreciate the little things(珍惜小事)</mark> and keep problems in perspective. I wouldn't describe her as constantly cheerful, but she's very good at finding something worthwhile in an ordinary day.",
      "t": "我认识的一位快乐的人是同事Emma。我们两年前合作过一个教学项目，现在还经常一起吃午饭。她友善、有活力，而且快乐并不显得刻意。<br><br>她会欣赏别人容易忽略的小事，比如发现好咖啡馆、学会新吉他和弦，或成功做出一道菜。她会笑着分享，热情也会感染我们。<br><br>有次下雨导致户外团建取消，大家很失望。她建议改成室内问答游戏，还拿出事先准备的零食。她没有假装天气很好，而是帮助大家把当下过好。<br><br>她当然也有困难的日子，会坦诚表达并寻求帮助。她不要求生活完美，也不总拿自己与别人比较，因此总体上很快乐。<br><br>和她相处会提醒我珍惜小事，用合理的尺度看待问题。她不是时时刻刻都兴高采烈，但很会在普通的一天里找到有价值的东西。",

          "t": "人们有联结感、安全感，并能享受当下时，往往最开心。可能是庆祝成就，也可能只是与好友吃饭。快乐不一定是大事件，也来自日常的自在和归属。"

          "t": "音乐、电影和演出能创造共同的快乐，也帮助表达难说出的情绪。社区音乐会可以让邻居相聚。效果不是必然，但容易接触的艺术能改善心情、促进交流。"

          "t": "老师可能注意到孩子变安静、不参加活动等变化，但这些不代表完整情况。应温和询问、倾听，不急于下结论。了解学生有助于发现困难并提供适当支持。"

          "t": "老师应掌握足够信息来保障安全和学习，但持续监视过度了。孩子也需要隐私和选择机会。我赞成明确规则、定期交流，有需要时再加强关注。"

      "a": "I remember watching an interview with a well-known swimmer who had represented his country at major international competitions. I recognised him from televised races, but I knew very little about his life outside the pool.<br><br>I watched the interview on my laptop at home one evening, after a friend shared the video with me. It wasn't mainly about medals or records. The interviewer asked about the less glamorous side of being an athlete, such as repetitive training, disappointment and returning to practice after a poor performance.<br><br>What caught my attention was how calmly the swimmer answered. He didn't present himself as someone who was always motivated or confident. Instead, he described relying on a routine and on people around him when his enthusiasm was low. The interviewer also gave him time to finish his answers, so it felt like a real conversation rather than a quick promotional appearance.<br><br><span class=\"conn\">Before</span> watching it, I tended to imagine successful athletes as completely different from ordinary people. <span class=\"conn\">Afterwards</span>, I could see that they also have doubts and have to <mark class=\"idiom\">take things one step at a time(一步一步来)</mark>. I found that surprisingly reassuring.<br><br>I enjoyed the interview because it showed the person behind the public image. I can't remember every detail, but the overall message <mark class=\"idiom\">stayed with me(让我记忆犹新)</mark>: consistent effort matters even when confidence comes and goes. It made me think more carefully about how I approach my own work.",
      "t": "我记得看过一位知名游泳运动员的采访。他代表国家参加过重要国际比赛，我在电视比赛中认得他，却不了解他泳池之外的生活。<br><br>一位朋友分享视频后，我某天晚上在家用笔记本看了采访。内容主要不是奖牌和纪录，而是反复训练、失望，以及表现不佳后如何重新投入练习。<br><br>我印象最深的是他回答得很平静，没有把自己塑造成永远充满动力的人。他谈到动力不足时如何依靠日常安排和身边的人。采访者也给他充分时间，因此像真正的交流。<br><br>以前我觉得成功运动员与普通人完全不同，看完后发现他们也会怀疑，也要一步一步来。这让我感到宽慰。<br><br>采访展示了公众形象背后的人。虽然细节不全记得，但持续努力的重要性留在了我脑中，也让我重新思考自己的工作方式。",

          "t": "穿着应干净、舒服，符合岗位和环境。正式办公室和创意工作室可能不同。得体穿着能留下好印象，但不能代替相关能力。"
        },
        {
          "q": "Why do we need to attend interviews when applying for jobs?",
          "a": "An interview lets employers explore things a written application can't fully show, such as how someone explains ideas or approaches a problem. It also lets applicants ask about the role. <span class=\"conn\">Ideally</span>, it's a <mark class=\"idiom\">two-way conversation(双向交流)</mark> that helps both sides judge whether the working relationship would suit them.",
          "t": "面试能展示申请材料不易体现的东西，比如解释想法和解决问题的方式，也让应聘者了解岗位。理想面试是双向交流，帮助双方判断是否合适。"
        },
        {
          "q": "What should people do to prepare for a job interview?",
          "a": "They should learn about the organisation, read the job description and prepare examples of relevant experience. Practising answers can help, but memorising every sentence may sound unnatural. <span class=\"conn\">Also</span>, preparing a few genuine questions shows interest. The aim is to <mark class=\"idiom\">know your material(熟悉要表达的内容)</mark> while staying flexible during the conversation.",
          "t": "应了解机构、阅读岗位要求、准备经验实例。练习有帮助，但逐字背诵可能不自然。准备真实问题也能体现兴趣，关键是熟悉内容且能灵活交流。"
        },
        {
          "q": "Why do some people think interviews are a waste of time?",
          "a": "Some interviews repeat information already available in an application or ask vague questions unrelated to the job. Applicants may also feel that a very short meeting can't reveal their ability. <span class=\"conn\">Still</span>, a well-designed interview can be useful if it <mark class=\"idiom\">focuses on what matters(关注重要内容)</mark> and includes realistic discussion of the work.",
          "t": "有些面试重复材料信息，或问与工作无关的模糊问题，短会面也难体现能力。但设计合理、聚焦工作实际的面试仍有价值。"
        },
        {
          "q": "Why do some people dislike being interviewed?",
          "a": "They may worry about being judged or struggle to express themselves under pressure. Others dislike personal questions or feel uncertain about what the interviewer expects. <span class=\"conn\">For example</span>, a capable person may not be a confident speaker. A respectful atmosphere can help them <mark class=\"idiom\">put their best foot forward(展示最好的一面)</mark>.",
          "t": "人们可能担心被评判、承压表达困难，也可能不喜欢私人问题或不清楚期待。有能力的人不一定善于说话，尊重的氛围有助于他们充分表现。"
        },
        {
          "q": "What kinds of people are usually interviewed?",
          "a": "Job applicants are interviewed, but so are athletes, artists, experts and people who have witnessed an event. Journalists may interview ordinary people to understand their experiences. <span class=\"conn\">So</span>, interviews aren't limited to celebrities. They're a way to <mark class=\"idiom\">get a fuller picture(获得更完整的认识)</mark> by hearing directly from someone involved.",
          "t": "应聘者、运动员、艺术家、专家、事件见证者都会受访。记者也采访普通人了解经历，因此采访不只属于名人，而是获得完整认识的方法。"
        }
      ],
      "cat": "经历",
      "sourcePage": 8
    },
    {
      "id": "s26p2_5",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🗂️",
      "ztitle": "有条理的人",
      "describe": "Describe a person you know who is very organized",
      "shouldsay": [
        "Who this person is",
        "What this person usually does to stay organized",
        "In what situations you have noticed this quality",
        "And explain why you think being organized is important to him/her"
      ],
      "a": "My friend Lucy is probably the most organised person I know. We became friends at university, and I first noticed this quality when we worked together on a group presentation. While the rest of us were still exchanging vague ideas, she had already written down the deadline, the main tasks and who was responsible for each one.<br><br>She doesn't use a complicated system. She keeps a calendar for appointments, a short daily list and labelled folders for important files. At the end of each day, she spends a few minutes checking what needs to be done next. That simple habit helps her <mark class=\"idiom\">stay on top of things(掌控事务)</mark>.<br><br>I saw how useful it was when we planned a weekend trip together. She booked the accommodation, kept the tickets in one place and allowed extra time for travelling. <span class=\"conn\">However</span>, she wasn't controlling. She asked what everyone wanted to do and left an afternoon free, so we could change our minds.<br><br>I think organisation matters to her because she dislikes wasting time on avoidable problems. It also gives her room to relax. Once the practical details are sorted out, she can enjoy herself without constantly worrying that she's forgotten something.<br><br>What I admire is the balance she strikes. She's prepared, but she can still <mark class=\"idiom\">go with the flow(顺其自然、灵活应对)</mark> when plans change. Knowing her has taught me that being organised is about reducing unnecessary stress, rather than filling every minute with work.",
      "t": "我的朋友Lucy大概是我认识的最有条理的人。大学做小组展示时，我第一次注意到这一点。大家还在泛泛讨论，她已经列好截止日期、任务和负责人。<br><br>她的系统并不复杂：日历记约会，短清单记当天任务，文件分类保存。每天结束前，她会花几分钟检查下一步，这让她能掌控事务。<br><br>一次周末旅行中，她订住宿、集中保管票据，并给交通留出余量。但她不会控制大家，而是征求意见，也留出一个自由下午。<br><br>对她来说，有条理能减少不必要的麻烦，也让她有空间放松。事情安排妥当后，她不用一直担心遗漏。<br><br>我最欣赏她的平衡：准备充分，也能在计划变化时灵活应对。她让我明白，条理是为了减少压力，而不是把每一分钟都填满工作。",
      "p3": [
        {
          "q": "Do you think it is important for managers to be well organized?",
          "a": "Yes, because a manager's organisation affects the whole team. Clear deadlines, responsibilities and communication can prevent confusion and duplicated work. <span class=\"conn\">However</span>, organisation shouldn't become rigid control. A good manager needs to <mark class=\"idiom\">keep things running smoothly(让事务顺利运行)</mark> while allowing people enough flexibility to respond to unexpected problems.",
          "t": "重要，因为管理者的条理影响整个团队。清晰的期限、职责和沟通能减少混乱和重复工作，但不应变成僵硬控制，还需留出处理意外的灵活空间。"
        },
        {
          "q": "Should parents teach their children to be organized?",
          "a": "Yes, through small tasks such as putting toys away or preparing a schoolbag. Parents should explain the purpose and show the habit themselves. <span class=\"conn\">For example</span>, tidying together is more helpful than simply complaining about a mess. Children can gradually <mark class=\"idiom\">take responsibility(承担责任)</mark> without being expected to behave like perfectly organised adults.",
          "t": "应该，可以从收玩具、整理书包等小事开始。父母应解释原因、以身作则。一起整理比抱怨更有用，孩子可逐步承担责任，不必像成年人一样完美。"
        },
        {
          "q": "What can people do to become more organized?",
          "a": "They can start with a short list of priorities and keep important items in consistent places. Breaking a large task into smaller steps also helps. <span class=\"conn\">However</span>, the system should be simple enough to maintain. An elaborate planner is useless if it creates more work than it saves or becomes <mark class=\"idiom\">hard to keep up with(难以持续)</mark>.",
          "t": "可以列简短优先事项，把重要物品放固定位置，也把大任务拆小。但系统要简单、能持续。复杂计划表若增加负担或难坚持，就失去作用。"
        },
        {
          "q": "Are organized people more likely to be successful at work or in their studies?",
          "a": "Often, because they may meet deadlines and spend less time searching for things. <span class=\"conn\">But</span> organisation alone doesn't guarantee success. Knowledge, creativity, cooperation and opportunity matter too. Someone can have a perfect timetable without doing useful work. Organisation is a tool for <mark class=\"idiom\">making progress(取得进展)</mark>, rather than the final goal.",
          "t": "通常更有机会，因为能按时完成、少花时间寻找。但条理不保证成功，还需知识、创意、合作和机会。完美课表不等于有效工作，条理只是推进目标的工具。"
        },
        {
          "q": "Do you think children should learn to be organized from a young age?",
          "a": "Yes, provided the expectations fit their age. Young children can learn to put books back or follow a simple morning routine. <span class=\"conn\">As</span> they grow, they can plan homework more independently. The aim is to build useful habits step by step, rather than make them feel <mark class=\"idiom\">under constant pressure(一直承受压力)</mark>.",
          "t": "应该，但要求须符合年龄。小孩子可以学归位书本、简单晨间流程，长大后再独立规划作业。目的是逐步建立习惯，而非施加持续压力。"
        },
        {
          "q": "Why is it important for people to be organized?",
          "a": "Organisation reduces avoidable confusion and helps people use time more deliberately. It can also make it easier to keep promises to others. <span class=\"conn\">For example</span>, recording an appointment prevents an unnecessary clash. Being organised gives people more <mark class=\"idiom\">peace of mind(安心感)</mark>, although they still need to accept that not everything can be planned.",
          "t": "条理能减少可避免的混乱，让时间使用更有意识，也帮助守约。记录约会可避免冲突，增加安心感，但仍需接受并非一切都能计划。"
        }
      ],
      "cat": "人物",
      "sourcePage": 9
    },
    {
      "id": "s26p2_6",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🔊",
      "ztitle": "嘈杂地",
      "describe": "Describe a noisy place you have been to",
      "shouldsay": [
        "Where it is",
        "When you went there",
        "What you did there",
        "And explain why you feel it’s a noisy place"
      ],
      "a": "A noisy place I've been to is a busy food court inside a shopping mall near my home. I went there with a friend on a Saturday evening a few months ago, because we wanted a quick meal before watching a film.<br><br>At first, it seemed convenient. There were lots of food stalls, and we could each choose something different. We ordered noodles and found a small table in the middle of the seating area. <span class=\"conn\">But</span> once we sat down, I realised how difficult it was to have a conversation.<br><br>There wasn't just one loud sound. People were talking over each other, chairs were scraping across the floor and staff were calling out order numbers. On top of that, music was playing through the mall's speakers. The combination created a constant <mark class=\"idiom\">wall of noise(一片持续的嘈杂声)</mark>. We had to lean forward and repeat ourselves several times.<br><br>I wouldn't say anyone was deliberately being inconsiderate. The place was crowded, and the hard surfaces seemed to make every sound carry. <span class=\"conn\">Still</span>, after about twenty minutes, I felt quite drained and was ready to leave.<br><br>The food was fine, but the atmosphere wasn't what I wanted that evening. Since then, I've tried to avoid that food court at peak times. If I want to <mark class=\"idiom\">catch up properly(好好叙旧)</mark> with a friend, I'd rather choose a quieter café, even if the meal takes a little longer.",
      "t": "我去过的一个嘈杂地方是家附近商场里的美食广场。几个月前的周六晚上，我和朋友想在看电影前快速吃饭，就去了那里。<br><br>起初觉得很方便，因为摊位很多，可以各点各的。我们买了面条，坐在座位区中间的小桌旁，但很快发现难以聊天。<br><br>声音来自许多方面：人们交谈、椅子摩擦地面、店员喊取餐号码，还有商场音乐。它们混在一起形成持续的噪声，我们得前倾身体、反复重复。<br><br>我不觉得是谁故意不体谅别人。场所拥挤，硬质表面似乎又让声音传播得更远。不过坐了二十分钟后，我已经觉得累了，想离开。<br><br>食物还可以，但氛围不适合那晚。之后我会避开高峰；想好好叙旧时，即使吃饭慢一点，我也更愿意选安静的咖啡馆。",
      "p3": [
        {
          "q": "How can people consider others' feelings when chatting in public?",
          "a": "They can lower their voices, avoid using speakers on their phones and notice whether nearby people are trying to study or rest. <span class=\"conn\">If</span> a conversation will be long or emotional, moving somewhere else may be sensible. Being considerate means adjusting to the setting instead of assuming everyone should <mark class=\"idiom\">put up with(忍受)</mark> the noise.",
          "t": "可以降低音量、不外放手机，并注意周围是否有人学习或休息。长时间或情绪激动的交谈可换地方，体谅别人意味着适应环境，而非要求别人忍受。"
        },
        {
          "q": "How would people usually respond to noises in your country?",
          "a": "Responses vary. Some people ignore brief noise, while others politely ask for the volume to be reduced. If it continues, they may contact staff or a building manager. <span class=\"conn\">Personally</span>, I'd prefer a calm request first, because a confrontation can <mark class=\"idiom\">make matters worse(让情况更糟)</mark> without solving the original problem.",
          "t": "反应不同：有人忽略短暂噪声，有人礼貌请对方降低音量，持续时可能找工作人员或物业。我会先平静请求，避免冲突把事情弄得更糟。"
        },
        {
          "q": "Which area is exposed to noise more, the city or the countryside?",
          "a": "Cities are usually exposed to more constant noise from traffic, construction and dense activity. <span class=\"conn\">However</span>, the countryside isn't always quiet; machinery or a nearby road can be loud too. It depends on the specific location. I'd distinguish occasional sounds from noise that <mark class=\"idiom\">goes on around the clock(日夜不停)</mark>.",
          "t": "城市通常有更多交通、施工和密集活动带来的持续噪声。但乡村也可能有机器或道路噪声，取决于具体地点，还应区分偶发声音与日夜不停的声音。"
        },
        {
          "q": "What kinds of noises are there in our life?",
          "a": "We hear transport noise, building work, household appliances and loud music. Some sounds are unavoidable parts of daily life, while others come from inconsiderate behaviour. <span class=\"conn\">For example</span>, a phone played through speakers on a quiet train can be especially annoying because other passengers have little chance to <mark class=\"idiom\">get away from it(避开它)</mark>.",
          "t": "噪声包括交通、施工、家电和音乐。有些难免，有些来自不体谅他人的行为。例如安静车厢里外放手机很烦，因为其他乘客难以避开。"
        },
        {
          "q": "Should children not be allowed to make noise under any circumstances?",
          "a": "No, that would be unrealistic and unfair. Children naturally make noise when playing or expressing excitement. <span class=\"conn\">However</span>, they can learn that a library or hospital calls for quieter behaviour than a playground. Adults should provide suitable spaces and guidance, rather than expect children to <mark class=\"idiom\">stay silent(保持沉默)</mark> in every situation.",
          "t": "不应该，这不现实也不公平。孩子玩耍、兴奋时自然会出声，但可学习图书馆、医院与操场的区别。成年人应提供合适空间和指导，而非要求一直安静。"
        },
        {
          "q": "Do you think it is good for children to make noise?",
          "a": "Sometimes, yes. Singing, laughing and active play can be positive forms of expression. The issue is the volume, place and effect on others. <span class=\"conn\">For instance</span>, noisy play is more appropriate outside than beside someone who's sleeping. Children should enjoy themselves while gradually learning to <mark class=\"idiom\">read the situation(判断场合)</mark>.",
          "t": "有时是好的，唱歌、笑和玩耍都是积极表达。问题在于音量、地点和影响。户外喧闹玩耍比在睡觉的人旁边合适，孩子可在享受中逐渐学会判断场合。"
        }
      ],
      "cat": "地点",
      "sourcePage": 9
    },
    {
      "id": "s26p2_7",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🌳",
      "ztitle": "喜欢的城市自然之地",
      "describe": "Describe a natural place in your city that you enjoy visiting",
      "shouldsay": [
        "Where it is",
        "What it is like",
        "How often you go there",
        "Who you often go there with",
        "And explain why you enjoy visiting there"
      ],
      "a": "A natural place in my city that I really enjoy visiting is a riverside park about twenty minutes from my home. It's quite long and narrow, with a walking path, plenty of trees and several small areas where people can sit close to the water.<br><br>I usually go there once or twice a month, especially when I've had a busy week. Sometimes I go with a close friend, but I also like going alone. We don't normally plan much; we just walk, find a bench and talk for a while.<br><br>What makes the park special is that it feels separate from the traffic, even though it's still inside the city. As you walk further along the river, you hear more birds and less noise from the road. In the late afternoon, the light on the water is lovely, and the whole place seems to <mark class=\"idiom\">slow down(慢下来)</mark>.<br><br>One visit I remember was after a difficult week at work. I hadn't felt like doing anything, but my friend persuaded me to take a short walk there. We ended up staying for over an hour, and I went home feeling much more settled.<br><br>I enjoy visiting because it gives me a chance to <mark class=\"idiom\">clear my head(理清思绪、放空)</mark> without arranging a big trip. <span class=\"conn\">For me</span>, it's a reminder that I don't always need expensive entertainment or a packed schedule to have a good afternoon. Sometimes a quiet path and some fresh air are enough.",
      "t": "我很喜欢城市里一处离家约二十分钟的河滨公园。它狭长，有步道、树木和靠近水边的座位。<br><br>我通常每月去一两次，尤其工作忙了一周后。有时和好友一起，有时独自去。我们不做复杂安排，只散步、找长椅坐坐、聊天。<br><br>它特别之处在于，虽然在城里，却有远离交通的感觉。沿河走远一点，鸟鸣变多，车声变少。傍晚水面的光很好看，整个地方仿佛慢了下来。<br><br>有次工作特别不顺，我本来什么都不想做，朋友劝我去散步。最后待了一个多小时，回家时心情平静多了。<br><br>我喜欢它，因为不用安排长途旅行就能理清思绪。它提醒我，美好的下午不一定需要昂贵娱乐或排满日程，有时安静的步道和新鲜空气就够了。",
      "p3": [
        {
          "q": "Which is more important, protecting the environment or developing the economy?",
          "a": "I don't think they should always be treated as competing goals. Economic development can support people's lives, but serious environmental damage can undermine those benefits. <span class=\"conn\">So</span>, I'd favour planning that considers both immediate needs and long-term consequences. Growth should be <mark class=\"idiom\">built to last(能够持续)</mark>, rather than achieved by ignoring future costs.",
          "t": "不应总把两者看作冲突目标。经济发展改善生活，严重环境损害却可能削弱收益。因此应兼顾当前需求和长期后果，让增长可以持续。"
        },
        {
          "q": "Do you think staying in a natural place would help change people’s mood?",
          "a": "It can, especially if someone has spent the whole day in a noisy or crowded setting. A walk near trees or water may give them space to think and relax. <span class=\"conn\">However</span>, people differ, and nature isn't a solution to every problem. For many, it's simply a pleasant way to <mark class=\"idiom\">take a breather(喘口气、休息一下)</mark>.",
          "t": "可能有帮助，尤其忙碌嘈杂一天后，树木或水边能提供思考和放松空间。但效果因人而异，也非所有问题的解法，对许多人只是舒服的休息方式。"
        },
        {
          "q": "Do you think there should be many natural places in cities?",
          "a": "Yes, cities need accessible parks, trees and other natural spaces, rather than a single impressive park far from most residents. These places allow people to walk, play and spend time together. <span class=\"conn\">Ideally</span>, they should be maintained well and be <mark class=\"idiom\">within easy reach(方便到达)</mark> for people of different ages and abilities.",
          "t": "需要，应有容易到达的公园、树木和自然空间，而不只一个很远的大公园。它们让人散步、玩耍、相聚，也应维护良好并适合不同年龄与能力的人。"
        },
        {
          "q": "What can governments do to encourage people to spend more time in nature?",
          "a": "They can provide safe walking routes, affordable transport and clear information about nearby green spaces. Community activities may help people feel more comfortable visiting. <span class=\"conn\">Also</span>, maintaining basic facilities matters. People are more likely to return when a place is welcoming and doesn't require them to <mark class=\"idiom\">go out of their way(费很大周折)</mark>.",
          "t": "政府可提供安全步道、便宜交通和清晰信息，也可组织社区活动。基本设施维护同样重要，场所友好、无需费很大周折时，人们更愿意再来。"
        },
        {
          "q": "Do you think people should spend more time in nature?",
          "a": "Many people would probably benefit from making room for outdoor time, particularly if their routines are mostly indoors. <span class=\"conn\">But</span> it doesn't need to mean a difficult expedition. A short visit to a local park can be enough to add variety. The important thing is finding something enjoyable that <mark class=\"idiom\">fits into daily life(融入日常生活)</mark>.",
          "t": "很多长期室内生活的人可以多安排户外时间，但不必是困难的远行。去本地公园短暂走走即可增加变化，关键是找到喜欢又能融入日常的方式。"
        },
        {
          "q": "What kind of people do you think enjoy being in nature?",
          "a": "People who enjoy walking, gardening or observing wildlife may be especially drawn to nature. Others go because they want quiet or time with their family. <span class=\"conn\">Still</span>, it's not limited to one personality type. Even someone who loves city entertainment might enjoy a green space as a <mark class=\"idiom\">change of pace(节奏上的变化)</mark>.",
          "t": "爱散步、园艺、观察动物的人可能尤其喜欢自然，其他人则想安静或陪家人。但不只某类性格的人，即使喜欢城市娱乐，也可能享受换个节奏。"
        }
      ],
      "cat": "地点",
      "sourcePage": 10
    },

        "And explain how you felt after buying it"
      ],
      "a": "A special thing I once saved up for was a good second-hand camera. I'd become interested in photography after borrowing a friend's camera on a trip, and I wanted something that would let me learn more than I could with my phone.<br><br>It wasn't an essential purchase, so I didn't want to take money away from everyday expenses. I checked a few prices, set a target and gave myself about four months to reach it. That made the whole idea feel more manageable.<br><br>I saved by making small changes rather than cutting out everything I enjoyed. I brought lunch from home more often, reduced unnecessary online shopping and put a fixed amount aside at the start of each month. I also kept a simple record so I could see how close I was getting. <span class=\"conn\">When</span> I was tempted to buy something on impulse, I reminded myself what I was <mark class=\"idiom\">working towards(努力争取)</mark>.<br><br>Eventually, I found a camera in good condition at a local shop. The assistant let me test it, which made me feel much more confident about buying it. I was excited, but also quite proud because I'd planned for it patiently.<br><br>The camera felt special partly because of the effort behind it. I still use it on walks and short trips. Saving taught me that delaying a purchase can make it more satisfying, especially when it supports an interest I genuinely want to <mark class=\"idiom\">get into(投入、深入了解)</mark>.",
      "t": "我曾攒钱买过一台品质不错的二手相机。旅行时借用朋友相机后，我对摄影产生兴趣，想比手机拍照学得更深入。<br><br>它不是必需品，所以我不想动用日常生活费用。我比较价格，设定目标，并给自己四个月时间。<br><br>我靠小改变攒钱：多带午饭、减少没必要的网购，每月初固定存一笔，并简单记录进度。想冲动消费时，我会提醒自己正在努力争取什么。<br><br>最后，我在本地店里找到状况良好的相机。店员让我试用，因此购买时更放心。我既兴奋，也为自己耐心执行计划而自豪。<br><br>相机之所以特别，也因为背后的努力。我仍带着它散步、短途旅行。这次经历让我明白，延后购买能增加满足感，尤其物品能支持真正想深入发展的兴趣时。",
      "p3": [
        {
          "q": "Should people spend time on charity, or just money?",
          "a": "Both can help, depending on what an organisation actually needs and what a person can offer. Donated time may bring useful skills, while money can support ongoing work. <span class=\"conn\">For example</span>, someone might volunteer occasionally and also donate a small amount. I'd focus on <mark class=\"idiom\">making a useful contribution(作出有用贡献)</mark>, rather than saying one form is always better.",
          "t": "时间和金钱都能帮助，取决于机构需求与个人能提供什么。志愿时间带来技能，捐款支持运营，也可以两者结合。应关注实际贡献，而非绝对比较。"
        },
        {
          "q": "What kind of things do people usually save money for?",
          "a": "People often save for education, travel, a home or a significant purchase. Some also build a reserve for unexpected expenses. <span class=\"conn\">However</span>, priorities depend on someone's stage of life and circumstances. A student and a parent may have very different goals, even if both are trying to <mark class=\"idiom\">plan ahead(提前规划)</mark>.",
          "t": "人们常为教育、旅行、住房或大额购物存钱，也为意外费用预留。优先事项取决于人生阶段和处境，学生与家长的目标可能很不同。"
        },
        {
          "q": "Is it easier to spend money or save money?",
          "a": "Spending is often easier because it offers an immediate reward, while saving requires patience. Online shopping can make small purchases particularly tempting. <span class=\"conn\">Still</span>, saving may become easier when there's a clear goal and a manageable routine. Seeing progress can help people <mark class=\"idiom\">resist the temptation(抵住诱惑)</mark> to spend without thinking.",
          "t": "花钱往往更容易，因为立即得到回报，存钱需要耐心。网购容易诱惑小额消费，但明确目标和可执行的习惯也会让存钱更容易，进度能增强坚持。"
        },
        {
          "q": "Do you think it is easier to teach teenagers how to manage money when they are around 16 or 17 years old?",
          "a": "It may be easier to explain realistic choices at that age because teenagers can understand planning and compare alternatives. They may also start managing their own spending. <span class=\"conn\">However</span>, the basics can be introduced earlier through simple examples. The lesson should connect with their experience, rather than rely on <mark class=\"idiom\">abstract rules(抽象规则)</mark> alone.",
          "t": "十六七岁能理解规划、比较选项，也可能开始自己管理开支，因此现实选择更好解释。但基础可更早通过简单实例学习，课程应联系经验，而非只有抽象规则。"
        },
        {
          "q": "Should parents teach their children to spend money freely or to save money?",
          "a": "They should teach both thoughtful spending and saving. Children need to learn that money can be used for enjoyment, but there are limits and future needs too. <span class=\"conn\">For example</span>, planning a small purchase can show the trade-off. The aim is to build <mark class=\"idiom\">good judgement(良好的判断力)</mark>, not fear every expense.",
          "t": "应教合理花钱与存钱。消费可以带来享受，也有额度和未来需求。规划一次小购买能展示取舍，目标是判断力，而不是害怕所有开支。"
        },
        {
          "q": "Should schools teach children how to manage money from a young age?",
          "a": "Yes, through age-appropriate activities such as comparing prices or planning a small class event. Those examples make the idea concrete. <span class=\"conn\">However</span>, schools should avoid assuming all children have the same resources at home. Financial education should help them understand choices and <mark class=\"idiom\">think things through(认真考虑)</mark>, rather than judge their families' circumstances.",
          "t": "可以，用比较价格、规划班级小活动等适龄任务，让概念具体。但不能假设家庭条件相同，应帮助理解选择，而非评价家庭处境。"
        }
      ],
      "cat": "经历",
      "sourcePage": 10
    },
    {
      "id": "s26p2_9",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🏊",
      "ztitle": "小时候学到的新技能",
      "describe": "Describe a new skill you learned when you were a child",
      "shouldsay": [
        "What the skill was",
        "Who taught you this skill",
        "How you learned it",
        "And explain how you felt about learning the skill"
      ],
      "a": "A skill I learned as a child was swimming. I was about nine when my parents signed me up for a beginners' class at a local swimming pool. Before that, I liked playing in shallow water, but I was nervous about putting my face under the surface.<br><br>Our instructor was a patient man called Mr Chen. He didn't ask us to swim a whole length straight away. We started by holding the side of the pool, practising breathing and learning how to float. He broke everything into small steps, which helped me <mark class=\"idiom\">build up my confidence(逐步建立信心)</mark>.<br><br>I remember struggling with the timing of breathing and moving my arms. Whenever I got frustrated, he would demonstrate again and ask me to focus on just one thing. I practised twice a week, and my parents made sure I only practised when an instructor or another responsible adult was supervising.<br><br>After several weeks, I managed to swim a short distance without holding on to anything. It probably wasn't very graceful, but I was incredibly pleased. Something that had seemed frightening was starting to feel enjoyable.<br><br>Learning to swim taught me more than the movements themselves. It showed me that progress can be slow at first, and that getting the basics right matters. I still remember the feeling of finally <mark class=\"idiom\">getting the hang of it(掌握窍门)</mark>. It was one of the first times I felt proud of a skill I'd earned through practice.",
      "t": "我小时候学过游泳。大约九岁时，父母给我报了本地泳池的入门班。之前我喜欢浅水区玩耍，却害怕把脸放进水里。<br><br>教练陈老师很有耐心，没有立即要求我们游完整段，而是从扶池边、练呼吸、学漂浮开始，把动作拆成小步骤，让我慢慢建立信心。<br><br>我一直难以协调呼吸和手臂动作。沮丧时，他会再示范，让我一次只关注一点。我每周练两次，练习时都有教练或负责的成年人监督。<br><br>几周后，我终于能不扶任何东西游一小段。动作可能不好看，但我非常开心，原本可怕的事情开始变得有趣。<br><br>这项技能让我理解，进步最初可能很慢，基础很重要。我仍记得终于掌握窍门时的感觉，那是我第一次为通过练习获得的技能自豪。",
      "p3": [
        {
          "q": "Is it important for everyone to have a specialized skill?",
          "a": "A specialised skill can create opportunities and give someone a useful role in a team. <span class=\"conn\">But</span> people also need general abilities, such as communication and learning independently. Not everyone has to become an expert in one narrow field. A balance helps people contribute now and <mark class=\"idiom\">adapt to change(适应变化)</mark> later.",
          "t": "专长能带来机会和团队价值，但沟通、自主学习等通用能力也重要。不必人人都成为狭窄领域专家，平衡能帮助当前贡献和未来适应。"
        },
        {
          "q": "Can a child learn skills from another child?",
          "a": "Yes, especially through games, practical activities and shared interests. A child may understand another child's explanation because they use familiar language. <span class=\"conn\">However</span>, adults may still need to check safety or accuracy. Peer learning works best when children can experiment without being afraid to <mark class=\"idiom\">ask for help(寻求帮助)</mark>.",
          "t": "可以，游戏和共同兴趣尤其适合。同龄人的语言可能更易理解，但成年人仍需关注安全和准确性。能自由尝试、敢求助时，同伴学习更有效。"
        },
        {
          "q": "Do you think it is easier for children to learn new skills than for adults?",
          "a": "Children may have more time to practise and be less worried about making mistakes. <span class=\"conn\">However</span>, adults bring experience, clearer goals and useful learning strategies. The skill itself also matters. I wouldn't say one group always learns faster; motivation and regular practice can <mark class=\"idiom\">tip the balance(改变优势的天平)</mark> in either direction.",
          "t": "孩子可能时间更多、较不怕错，成年人则有经验、明确目标和方法。技能本身也影响学习，不能说一组总更快，动力与规律练习可能改变优势。"
        },
        {
          "q": "What are the differences between the way adults learn and the way children learn?",
          "a": "Children often learn through play, imitation and short practical tasks. Adults may prefer an explanation of the purpose and a clear link to their needs. <span class=\"conn\">Still</span>, both groups benefit from trying things and receiving feedback. The difference is partly in experience, rather than two completely separate <mark class=\"idiom\">ways of learning(学习方式)</mark>.",
          "t": "孩子常通过游戏、模仿和短任务学，成年人更想知道目的及与需求的联系。但两者都需要实践与反馈，差别部分来自经验，并非完全不同的学习方式。"
        },
        {
          "q": "What are the differences between learning in a group and learning by yourself?",
          "a": "Group learning offers feedback, encouragement and different perspectives. Learning alone gives people control over the pace and what they focus on. <span class=\"conn\">For example</span>, someone could practise independently, then join a group to compare methods. Combining the two may help them <mark class=\"idiom\">get the best of both worlds(兼得两者优点)</mark>.",
          "t": "小组提供反馈、鼓励和不同观点，独学则更能控制速度与重点。可先独练，再参加小组交流方法，两者结合能兼得优点。"
        },
        {
          "q": "What skills should children learn before they go to school?",
          "a": "Basic independence matters, such as putting on a coat, tidying belongings and asking for help. Children also benefit from taking turns and expressing their needs. <span class=\"conn\">However</span>, development varies, so expectations should be realistic. The goal is to help them <mark class=\"idiom\">settle into(适应)</mark> school life, not demand advanced academic skills before they arrive.",
          "t": "基本独立能力重要，比如穿外套、整理东西、求助，也包括轮流和表达需要。发展速度不同，期待要合理，目的是适应学校，而非入学前掌握高深知识。"
        }
      ],
      "cat": "经历",
      "sourcePage": 11

    {
      "id": "s26p2_10",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "📸",
      "ztitle": "喜欢拍照的人",
      "describe": "Describe a person you know who really likes taking photos",
      "shouldsay": [
        "Who the person is",
        "When and how you got to know him/her",
        "Where he/she takes photos",
        "And explain how you feel about him/her"
      ],
      "a": "Someone I know who really enjoys taking photos is my friend Alex. We met at a university club about five years ago, and I noticed quite quickly that he almost always had a camera or his phone ready.<br><br>He doesn't only take pictures when he travels. He photographs ordinary things around our city, like a small shop opening in the morning, sunlight coming through a window or people walking beside the river. He also likes taking portraits of friends, but he always checks that they're comfortable with it first.<br><br>What I find interesting is the amount of attention he gives to details. On a walk, I might see a fairly ordinary street, while he notices a reflection in a puddle or the colours of an old doorway. He'll sometimes wait a few minutes for the light to change, rather than take dozens of random pictures.<br><br><span class=\"conn\">However</span>, he's considerate about it. If we're having dinner or talking about something important, he puts the camera away. He also asks before posting a photograph of someone online, so his hobby doesn't <mark class=\"idiom\">get in the way of(妨碍)</mark> other people's enjoyment.<br><br>I feel quite positive about him and his interest. His photos have helped me notice beauty in places I used to walk past without looking. Being around him encourages me to <mark class=\"idiom\">see things in a new light(用新的眼光看事物)</mark>, even though I'm nowhere near as enthusiastic about photography as he is.",
      "t": "我的朋友Alex非常喜欢拍照。五年前我们在大学社团认识，我很快发现他几乎随时准备着相机或手机。<br><br>他不只旅行时拍，也拍城市里的普通场景，比如清晨开门的小店、透窗的阳光、河边行人。他也给朋友拍人像，但会先征求同意。<br><br>我觉得有趣的是他对细节的关注。我眼中普通的街道，他会注意水洼倒影或旧门的颜色。有时他会等光线变化，而不是随便连拍。<br><br>不过他很体谅别人。吃饭或认真聊天时会放下相机，网上发人像前也会问，不让爱好妨碍他人。<br><br>我很欣赏他。他的照片让我看到过去忽略的美，也鼓励我用新的眼光看身边事物，虽然我远没有他那么热爱摄影。",
      "p3": [
        {
          "q": "Some people don't mind others walking into their shot when they're taking photos.",
          "a": "I can understand that attitude because a photograph doesn't always need to be perfectly arranged. An unexpected person can make a scene feel more natural. <span class=\"conn\">However</span>, deliberately blocking someone repeatedly would still be inconsiderate. It depends on whether the photographer welcomes a spontaneous moment or is trying to capture a <mark class=\"idiom\">particular composition(特定构图)</mark>.",
          "t": "我能理解这种态度，因为照片不一定要完美安排。路人可能让画面更自然，但反复故意挡人仍不体贴。取决于摄影者想要随性瞬间还是特定构图。",
          "sourceNote": "雅思哥原文此条为陈述句，完整问句待核对。下方仅示范如何回应这条陈述。"
        },
        {
          "q": "Why do tourists like taking photos while they are travelling?",
          "a": "Photos help tourists remember places and share experiences with people at home. Taking a picture may also encourage them to notice details. <span class=\"conn\">But</span> if photography becomes the only purpose, they can miss the experience itself. Ideally, people should capture a few moments and also <mark class=\"idiom\">take it all in(充分感受现场)</mark>.",
          "t": "照片帮助记住地点、分享经历，也让人关注细节。但如果只为拍照，就可能错过现场体验。理想是记录一些瞬间，同时充分感受当下。"
        },
        {
          "q": "Do you think it’s ok to take photos everywhere?",
          "a": "No. People should respect privacy, safety and the rules of a location. A hospital, a private home or a sensitive exhibition may need restrictions. <span class=\"conn\">Even if</span> photography is allowed, asking before taking a close photograph of someone is considerate. Having a camera doesn't mean having <mark class=\"idiom\">free rein(不受限制的自由)</mark> everywhere.",
          "t": "不行，应尊重隐私、安全和场所规定。医院、私人住宅或敏感展品可能限制拍照。即使允许，近距离拍人前征求同意也更体贴，相机不意味着无限自由。"
        },
        {
          "q": "What kind of photos do people often take?",
          "a": "People often photograph family, friends, food, pets and places they visit. Some also record ordinary details or the progress of a hobby. <span class=\"conn\">So</span>, not every picture is meant to be impressive online. Many are simply a personal record of things someone wants to <mark class=\"idiom\">look back on(以后回顾)</mark>.",
          "t": "人们常拍亲友、食物、宠物和去过的地方，也记录日常细节或爱好进展。并非每张都为网上展示，很多只是个人日后回顾的记录。"
        },
        {
          "q": "Why are some people keen on taking photos?",
          "a": "Some enjoy the creative challenge of framing a scene and working with light. Others value the memories or the chance to share something they noticed. <span class=\"conn\">For example</span>, photographing the same street at different times can be surprisingly interesting. It gives people a reason to <mark class=\"idiom\">pay closer attention(更仔细留意)</mark> to their surroundings.",
          "t": "有人喜欢构图和光线的创作挑战，有人重视回忆或分享发现。同一街道在不同时间拍摄也会有趣，摄影让人更仔细观察环境。"
        },
        {
          "q": "When do people like taking photos?",
          "a": "They often take photos during celebrations, trips and family gatherings, when something feels worth remembering. They may also take one unexpectedly when the light is beautiful or a pet does something funny. <span class=\"conn\">In other words</span>, photography can mark a special event or capture an ordinary moment that <mark class=\"idiom\">stands out(显得特别)</mark>.",
          "t": "庆祝、旅行和家庭聚会时常拍照，也可能因为光好看或宠物有趣而突然拍。摄影既可记录重大活动，也可留下普通生活中特别的一刻。"
        }
      ],
      "cat": "人物",
      "sourcePage": 11

    {
      "id": "s26p2_11",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "👴",
      "ztitle": "尊敬的比你年长的人",
      "describe": "Describe someone who is older than you that you admire",
      "shouldsay": [
        "Who this person is",
        "How you knew this person",
        "What kinds of things you like to do together",
        "And explain how you feel about this person"
      ],
      "a": "An older person I admire is my neighbour, Mr Liu, who is in his late sixties. I first got to know him when I moved into my building and couldn't work out where to collect a parcel. He showed me the way and made me feel welcome without asking lots of personal questions.<br><br>Since then, we've often chatted in the courtyard. We sometimes go for a short walk together, and occasionally he teaches me a little gardening. He grows herbs in containers and seems to know exactly how much attention each plant needs.<br><br>What I admire most is his curiosity. He worked as an engineer before retiring, but he still enjoys learning. When he started using a smartphone, he asked me to show him how to organise photographs. <span class=\"conn\">In return</span>, he helped me repair a loose shelf and explained the process so I could do it myself next time.<br><br>He's also a very patient listener. Once, when I was worried about a change at work, he didn't immediately tell me what I should do. He asked a few sensible questions and helped me <mark class=\"idiom\">see the bigger picture(看到更全面的情况)</mark>.<br><br>I feel comfortable around him because our relationship is based on mutual respect. He doesn't assume young people know nothing, and I don't assume older people are out of touch. Knowing him has shown me how valuable it can be to <mark class=\"idiom\">learn from each other(互相学习)</mark> across different generations.",
      "t": "我敬佩的一位长者是邻居刘先生，他六十多岁。我刚搬进楼里，不知道去哪里取快递，他给我带路，热情却不追问隐私。<br><br>后来我们常在院子里聊天，有时一起短距离散步，他也偶尔教我园艺。他用容器种香草，很懂得每种植物需要怎样照料。<br><br>我最敬佩他的好奇心。退休前是工程师，现在仍喜欢学习。他学用智能手机时，请我教他整理照片；作为交换，他帮我修松动的架子，并解释步骤。<br><br>他也是耐心的倾听者。有次我担心工作变化，他没有立即指挥我，而是通过几个合理的问题，帮我看得更全面。<br><br>我们互相尊重，所以相处很舒服。他不会觉得年轻人什么都不懂，我也不会认为长者跟不上时代。他让我看到不同代际之间互相学习的价值。",
      "p3": [
        {
          "q": "What kinds of things do the elderly remember for a long time?",
          "a": "Older people may remember important relationships, family events and experiences from their youth for a long time. A familiar song or object can bring those memories back. <span class=\"conn\">However</span>, everyone is different, and memory isn't simply determined by age. Experiences with strong <mark class=\"idiom\">personal meaning(个人意义)</mark> are often the ones people enjoy recalling.",
          "t": "长者可能长久记得重要关系、家庭事件和年轻时的经历，熟悉歌曲或物品也能唤起记忆。但因人而异，有强烈个人意义的经历常让人愿意回顾。"
        },
        {
          "q": "What sports are popular among older people?",
          "a": "In places I know, walking, tai chi and gentle group activities are popular with some older people. Others enjoy swimming or cycling. <span class=\"conn\">But</span> preferences and abilities vary greatly, so age alone doesn't tell us what someone can do. Accessible facilities let people choose an activity that <mark class=\"idiom\">suits them(适合自己)</mark>.",
          "t": "在我熟悉的地方，一些长者喜欢散步、太极或温和集体活动，也有人游泳、骑车。但偏好与能力差异很大，方便使用的设施能让大家选择适合自己的活动。"
        },
        {
          "q": "What do old people usually do in their daily life?",
          "a": "Their routines vary. Some work, some help care for family members, and others spend time on hobbies or community activities. <span class=\"conn\">For example</span>, a retired neighbour of mine enjoys gardening and meeting friends. It's important not to assume everyone has the same lifestyle simply because they belong to an <mark class=\"idiom\">older generation(较年长的一代)</mark>.",
          "t": "日常生活不同：有人工作，有人照顾家人，有人做爱好或社区活动。我的退休邻居喜欢园艺和见朋友，不能只因为年龄就假设生活相同。"
        },
        {
          "q": "Why is there a generation gap between the young and the old?",
          "a": "People grow up with different technology, social expectations and experiences, which can shape their views. Misunderstandings become greater when each side assumes its way is the only sensible one. <span class=\"conn\">However</span>, patient conversation can help. Asking why someone thinks differently is a useful way to <mark class=\"idiom\">bridge the gap(缩小隔阂)</mark>.",
          "t": "不同技术、社会期待和经历会影响观念。若都认为只有自己合理，误解更大。耐心交流、询问对方理由能缩小隔阂。"
        },
        {
          "q": "Has old people's life quality improved when compared to the past?",
          "a": "In some respects, it may have improved through better facilities, easier communication and more convenient services. <span class=\"conn\">However</span>, not everyone benefits equally, and some older people feel isolated or struggle with digital systems. I'd judge quality of life by independence, support and social connection, rather than assume progress has <mark class=\"idiom\">reached everyone(惠及所有人)</mark>.",
          "t": "设施、沟通和便利服务可能改善生活，但收益不均，有人孤独或不会用数字系统。应看独立性、支持和社交联结，而非假设进步已惠及所有人。"
        },
        {
          "q": "What can young and old people learn from each other?",
          "a": "Young people can learn practical experience, patience and a longer perspective on problems. Older people may learn new technology or understand changing social habits. <span class=\"conn\">Still</span>, learning goes both ways and depends on the individuals. Mutual respect is essential; neither group should be treated as having <mark class=\"idiom\">all the answers(知道所有答案)</mark>.",
          "t": "年轻人可学经验、耐心和长远视角，长者可学新技术与社会习惯。但取决于个人，互相尊重是基础，没有一组人掌握全部答案。"
        }
      ],
      "cat": "人物",
      "sourcePage": 12
    },
    {
      "id": "s26p2_12",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🛍️",
      "ztitle": "好的购物服务",
      "describe": "Describe a time when you received good service in a shop/store/company",
      "shouldsay": [
        "Where the shop/store/company is",
        "When you went to the shop/store/company",
        "What service you received from the staff",
        "And explain how you felt about the service"
      ],
      "a": "A time I received particularly good service was when I bought a pair of walking shoes at a small sports shop near my home. This was last autumn, a few weeks before a trip that would involve quite a lot of walking.<br><br>I went in with only a rough idea of what I needed. The assistant first asked where I would be walking and whether I usually had any problems with shoe sizes. She listened properly instead of immediately pointing me towards the most expensive pair.<br><br>She brought out several options and gave me time to try them. When I said one pair felt tight at the front, she suggested a different shape rather than insisting it would become comfortable later. She also encouraged me to walk around the shop and compare both feet, which was much more helpful than simply looking in a mirror.<br><br><span class=\"conn\">In the end</span>, I chose a reasonably priced pair. Before I paid, she explained the shop's return conditions clearly and wrote the size on the box so I could find it easily next time. The whole visit took a little longer than I'd expected, but I never felt <mark class=\"idiom\">under pressure(有压力)</mark> to buy.<br><br>I appreciated the service because it was attentive and honest. The shoes worked well on my trip, and the experience made me more likely to return. It showed me that good service means helping customers make a suitable choice, rather than just <mark class=\"idiom\">closing a sale(完成一笔交易)</mark>.",
      "t": "去年秋天，旅行前几周，我在家附近的小运动用品店买步行鞋，得到了特别好的服务。<br><br>我最初只大致知道需求。店员先问我要在哪里走路，以及平常穿鞋是否有尺码问题，而不是马上推荐最贵的。<br><br>她拿来几种鞋，让我充分试穿。我说一双前面紧，她建议换鞋型，没有坚持说穿久了就舒服，还让我在店里走走，比较两脚的感觉。<br><br>最后我选了一双价格合理的。付款前，她清楚解释退换条件，还把尺码写在盒上方便以后查找。虽然比预计花时间长，我却从未感到购买压力。<br><br>我感谢这种认真、诚实的服务。鞋在旅行中很好用，我也愿意再来。这说明好服务是帮助顾客作出适合的选择，而不只是完成销售。",
      "p3": [
        {
          "q": "Can consumption drive economic growth?",
          "a": "Consumption can support businesses and employment because customers' spending becomes income for others. <span class=\"conn\">However</span>, encouraging people to buy more isn't the only path to a healthy economy. The quality and sustainability of that spending matter too. I'd prefer useful products and services that <mark class=\"idiom\">create lasting value(创造持久价值)</mark>, rather than unnecessary waste.",
          "t": "消费能成为企业收入并支持就业，但多买不是经济健康的唯一路径，也要看质量和可持续性。我更赞成创造持久价值，而非制造浪费。"
        },
        {
          "q": "What are the advantages and disadvantages of shopping online?",
          "a": "Online shopping is convenient and makes comparing products easier. <span class=\"conn\">On the other hand</span>, customers can't always judge size or quality from pictures, and returns may take time. Reviews can help, but they aren't perfect. People need clear information and reasonable expectations, rather than buying purely because something <mark class=\"idiom\">looks like a bargain(看起来便宜划算)</mark>.",
          "t": "网购方便、容易比较，但照片不一定反映尺码和品质，退货耗时。评价有帮助却不完美，需要清晰信息和合理期待，而非只看便宜。"
        },
        {
          "q": "What are the differences between online shopping and in-store shopping?",
          "a": "In a shop, customers can examine products, try them and speak to staff directly. Online, they can browse a wider range without travelling. <span class=\"conn\">So</span>, the better option depends on the purchase. I'd rather try unfamiliar shoes in person, but order a familiar everyday item online to <mark class=\"idiom\">save myself a trip(省一趟出门)</mark>.",
          "t": "实体店能查看、试用、问店员，网上选择更多且不用出门。取决于购买内容，陌生款鞋我会亲自试，熟悉日用品可网上买。"
        },
        {
          "q": "Why do some people not like shopping in small shops?",
          "a": "They may expect a limited selection, less predictable prices or unclear return arrangements. Some also feel uncomfortable when staff give them too much attention. <span class=\"conn\">However</span>, those problems don't apply to every small shop. A reliable local business can offer helpful service and <mark class=\"idiom\">build a personal connection(建立个人联系)</mark> with customers.",
          "t": "有人觉得选择少、价格不稳定、退换不清晰，或店员过度关注让人不自在。但并非所有小店如此，可靠本地商家也可提供好服务和熟悉关系。"
        },
        {
          "q": "What are the advantages and disadvantages of shopping in small shops?",
          "a": "Small shops can provide individual attention and a distinctive range of products. They're sometimes more convenient for nearby residents. <span class=\"conn\">But</span> they may have less stock and fewer facilities than larger stores. I think their appeal depends on whether they understand customers and offer something beyond simply being <mark class=\"idiom\">close to home(离家近)</mark>.",
          "t": "小店可能有贴心服务和独特商品，对邻居方便，但库存和设施可能较少。吸引力取决于是否理解顾客、提供超越距离近的价值。"
        },
        {
          "q": "Why are shopping malls so popular in China?",
          "a": "They bring shopping, food and entertainment together, so people can arrange several activities in one visit. They also offer shelter from uncomfortable weather. <span class=\"conn\">For families</span>, that convenience can be attractive. Still, not everyone enjoys them; some prefer outdoor markets or quieter local shops with a more <mark class=\"idiom\">individual character(独特风格)</mark>.",
          "t": "商场把购物、餐饮和娱乐集中，也能避开恶劣天气，适合一家人一次安排多件事。但有人更喜欢户外市场或有特色的安静小店。"
        }
      ],
      "cat": "经历",
      "sourcePage": 12
