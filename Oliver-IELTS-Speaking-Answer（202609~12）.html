    {
      "id": "s26p2_13",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🧵",
      "ztitle": "擅长做手工的人",
      "describe": "Describe a person who is good at making things by hand",
      "shouldsay": [
        "Who this person is",
        "What he/she makes",
        "What materials or technologies he/she uses",
        "And why you think this person is good at making things by hand"
      ],
      "a": "A person who's very good at making things by hand is my aunt Mei. I've known her all my life, but I only began to appreciate her skill properly when she helped me make a handmade present for a friend.<br><br>She mainly makes bags, cushion covers and small fabric decorations. She uses cotton, leftover pieces of cloth, thread and simple tools such as scissors and needles. For some parts she uses a sewing machine, but much of the detailed finishing is done by hand.<br><br>What impresses me is that she can take something ordinary and turn it into something useful. A few months ago, she used fabric from an old shirt to make a small travel pouch. She measured carefully, chose a matching lining and added a strong zip. The final result looked much neater than anything I could have bought on impulse.<br><br>I think she's good at it because she's patient and has a <mark class=\"idiom\">good eye for detail(善于留意细节)</mark>. She checks the stitching and isn't afraid to undo a section if it doesn't sit properly. <span class=\"conn\">At the same time</span>, she's creative enough to experiment with colours and shapes.<br><br>Watching her work has made me value handmade objects more. They involve thought, time and practice that aren't always obvious at first glance. I also like that she gives old materials a <mark class=\"idiom\">new lease of life(新的生命)</mark>, rather than throwing them away as soon as their original use is over.",
      "t": "擅长手工的人是我的阿姨Mei。我从小认识她，但直到她帮我制作送朋友的礼物，才真正欣赏她的技能。<br><br>她主要做包、靠垫套和布艺小装饰，用棉布、剩余布料、线、剪刀和针。有些地方用缝纫机，细节收尾则经常手缝。<br><br>她很会把普通材料变成实用物品。几个月前，她把旧衬衫的布做成旅行收纳袋，仔细量尺寸、选内衬、加牢固拉链，成品非常整齐。<br><br>她手艺好，因为有耐心、关注细节。缝线不合适时，愿意拆开重做，同时也会尝试新的配色和形状。<br><br>看她工作让我更珍惜手工物品，它们背后有不易察觉的时间、思考和练习。我也喜欢她赋予旧材料新生命，而不是用完原来的功能就丢弃。",
      "p3": [
        {
          "q": "Does art, like music or theater, have an impact on society?",
          "a": "Yes, art can shape how people discuss experiences, emotions and social issues. A song or play may make a subject easier to relate to than an abstract argument. <span class=\"conn\">However</span>, people interpret art differently. Its value often lies in opening a conversation and encouraging people to <mark class=\"idiom\">see another perspective(看到另一种视角)</mark>.",
          "t": "艺术能影响人们讨论经历、情绪和社会问题。歌曲或戏剧可能比抽象论证更易理解，但解读不同，价值常在于开启交流、提供新视角。"
        },
        {
          "q": "Is it good to have creative people in a team?",
          "a": "Yes, because they may suggest alternatives when the usual approach isn't working. <span class=\"conn\">But</span> creativity needs to be combined with listening and practical judgement. A team also needs people who can organise and carry out ideas. The strongest result often comes when different abilities <mark class=\"idiom\">complement one another(互相补充)</mark>.",
          "t": "有创意的人可提出新方案，但也需倾听和实际判断。团队还需要组织与执行者，不同能力互补时通常效果最好。"
        },
        {
          "q": "What impact can artistic buildings have on society?",
          "a": "They can give a place a recognisable identity and encourage interest in design or culture. A welcoming building may also bring people together. <span class=\"conn\">However</span>, appearance shouldn't come at the expense of accessibility or usefulness. An artistic building works best when it both attracts attention and <mark class=\"idiom\">serves a purpose(发挥实际作用)</mark>.",
          "t": "有艺术性的建筑可建立地方形象、激发设计文化兴趣，也能让人相聚。但不能牺牲使用便利与可达性，最好既美观又实用。"
        },
        {
          "q": "Do children these days still like doing arts and crafts?",
          "a": "Many do, although their interests vary and screens compete for their attention. Making something tangible can still be satisfying, especially when children can choose the design. <span class=\"conn\">For example</span>, a handmade card lets them express a personal idea. The activity is more appealing when it leaves room for <mark class=\"idiom\">their own imagination(自己的想象力)</mark>.",
          "t": "很多孩子仍喜欢，尽管兴趣不同、屏幕会分散注意力。亲手做出实物很有满足感，尤其能自主设计时。活动留出想象空间会更吸引人。"
        },
        {
          "q": "Why do some children enjoy making things by hand?",
          "a": "They enjoy seeing an idea turn into a real object and feeling that they made it themselves. Using different materials can also be interesting. <span class=\"conn\">However</span>, children shouldn't always have to copy one perfect example. Experimenting and making small mistakes can give them a stronger <mark class=\"idiom\">sense of achievement(成就感)</mark> than simply following instructions.",
          "t": "把想法变成实物、尝试材料都令人快乐。不必总复制完美范例，尝试和小失误可能比机械跟步骤更有成就感。"
        },
        {
          "q": "Do you think art classes are important for children?",
          "a": "Yes, they give children another way to express ideas and practise looking carefully. They can also offer a break from subjects with only one expected answer. <span class=\"conn\">But</span> the emphasis should be on exploration and participation, not comparing whose picture is best. A supportive class helps children <mark class=\"idiom\">develop confidence(建立自信)</mark> as well as skills.",
          "t": "重要，艺术给孩子另一种表达方式，培养观察，也让他们暂时离开只有标准答案的学科。应重探索、参与，不比谁画得最好，让课堂建立技能和信心。"
        }
      ],
      "cat": "人物",
      "sourcePage": 13

    {
      "id": "s26p2_14",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🌙",
      "ztitle": "和朋友度过的愉快夜晚",
      "describe": "Describe an enjoyable evening you had with your friends",
      "shouldsay": [
        "When and where it was",
        "What you did",
        "Who you spent the evening with",
        "And explain why it was enjoyable"
      ],
      "a": "An evening I really enjoyed was a small dinner at my friend Lucy's flat last winter. There were four of us, all old university friends, and we hadn't been together in the same place for several months.<br><br>We decided to cook instead of going to a restaurant. Lucy prepared the ingredients, and each of us took responsibility for one dish. I made a simple noodle salad, while the others cooked soup, vegetables and a dessert. There were a couple of minor disasters, including a slightly burnt piece of bread, but that just gave us more to laugh about.<br><br>After dinner, we cleared the table and played a word game. Nobody was particularly competitive, so it quickly turned into a conversation about school memories and the funny things that had happened since we last met. We also put our phones away for most of the evening, which helped us <mark class=\"idiom\">be fully present(全心投入当下)</mark>.<br><br>What made it enjoyable wasn't expensive food or an elaborate plan. It was the chance to relax with people who knew me well. I didn't have to make a good impression or think carefully about everything I said. We could simply <mark class=\"idiom\">be ourselves(做真实的自己)</mark>.<br><br>I left quite late, feeling lighter than I had when I arrived. It reminded me that friendships need actual time together, and that an ordinary evening can become memorable when everyone contributes and nobody is in a hurry.",
      "t": "去年冬天，我在Lucy家度过了一个特别愉快的晚餐夜晚。四位大学老友已经好几个月没有聚齐。<br><br>我们没有去餐厅，而是一起做饭。Lucy准备材料，每个人负责一道菜。我做了简单面条沙拉，其他人做汤、蔬菜和甜点。略微烤焦的面包反而增加了笑料。<br><br>饭后我们收拾桌子，玩文字游戏，很快聊起学校回忆和分别以来的趣事。大部分时间都把手机放下，更投入地相处。<br><br>开心的原因不是昂贵食物或复杂安排，而是和熟悉的人放松。我不用刻意留下好印象，也不用斟酌每句话，可以做自己。<br><br>我很晚才离开，心情比来时轻松。这提醒我，友谊需要真实的相处时间；只要每个人参与、没人急着走，普通的夜晚也能令人难忘。",
      "p3": [
        {
          "q": "Why do people need friends?",
          "a": "Friends provide companionship, honest feedback and support during difficult periods. They also help people enjoy ordinary activities and feel understood. <span class=\"conn\">Of course</span>, friendship involves giving as well as receiving. A strong relationship grows when both people make time and show interest, rather than only <mark class=\"idiom\">reach out(联系对方)</mark> when they need something.",
          "t": "朋友提供陪伴、诚恳反馈和支持，也让日常活动更快乐。但友谊需要双方付出、安排时间和关注，而不只在有需求时联系。"
        },
        {
          "q": "Do older people prefer spending time with family or with friends?",
          "a": "It varies with the person and the stage of life. Some older people spend much of their time with family, while others have close friendships that are equally important. <span class=\"conn\">For someone</span> living alone, regular contact with friends may provide a valuable <mark class=\"idiom\">support network(支持网络)</mark>. I wouldn't assume family always takes priority.",
          "t": "因人和人生阶段而异。有些长者多陪家人，有些友谊同样重要。独居者尤其可能依靠朋友支持，不能假设家庭永远优先。"
        },
        {
          "q": "Do young people prefer spending time with family or with friends?",
          "a": "Many young people enjoy spending time with friends because they share interests and similar experiences. <span class=\"conn\">However</span>, family can still be a major source of support. The preference may change depending on the activity: they might celebrate a traditional festival with relatives but choose friends for a <mark class=\"idiom\">casual night out(轻松的晚间聚会)</mark>.",
          "t": "年轻人常因共同兴趣而喜欢陪朋友，但家庭仍是重要支持。偏好随活动变化，例如节日陪亲属、普通晚上约朋友。"
        },
        {
          "q": "What are the differences between young people’s leisure time activities and those of old people?",
          "a": "Young people may choose more activities involving new experiences or larger social groups, while some older people prefer familiar hobbies and quieter settings. <span class=\"conn\">Still</span>, that's only a tendency, not a rule. Free time, resources and personal interests can matter more than age, and many activities are <mark class=\"idiom\">shared across generations(不同代际都喜欢的)</mark>.",
          "t": "年轻人可能更爱新体验和大群体，一些长者偏好熟悉爱好与安静环境。但并非规则，时间、资源和兴趣可能比年龄更重要，很多活动跨代共享。"
        },
        {
          "q": "What can we do to bring family members closer together?",
          "a": "Regular meals, shared activities and thoughtful conversations can help. The activity doesn't have to be expensive; cooking together may work better than a formal outing. <span class=\"conn\">Also</span>, people need to listen without immediately judging one another. Feeling respected makes it easier to <mark class=\"idiom\">open up(敞开心扉)</mark> and spend time together willingly.",
          "t": "一起吃饭、活动、认真交流都有帮助，不必昂贵，一起做饭可能比正式出游更好。也要不急于评判地倾听，让人感到尊重，更愿意敞开心扉。"
        },
        {
          "q": "How do people get along in a big family?",
          "a": "They need clear communication, respect for different routines and a fair way to share responsibilities. Larger families may also need more privacy than people expect. <span class=\"conn\">For example</span>, agreeing on household tasks can prevent repeated arguments. Getting along doesn't mean agreeing on everything; it means learning to <mark class=\"idiom\">work through differences(处理分歧)</mark>.",
          "t": "大家庭需要清晰沟通、尊重不同作息、公平分担，也要隐私。明确家务可减少争吵，和睦不是事事一致，而是能处理分歧。"
        }
      ],
      "cat": "经历",
      "sourcePage": 13
    },
    {
      "id": "s26p2_15",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "📱",
      "ztitle": "浪费时间的活动",
      "describe": "Describe an activity you do regularly that you think is a waste of time",
      "shouldsay": [
        "What it is",
        "When you usually do it",
        "Why you do it",
        "And explain why you think it is a waste of time"
      ],
      "a": "An activity I do regularly that often feels like a waste of time is scrolling through short videos on my phone. It usually happens in the evening, when I've finished work and tell myself that I'll watch just a couple of clips before doing something else.<br><br>I start because it's easy and doesn't require much effort. After a busy day, I don't always feel like reading a long article or starting a proper hobby. The problem is that one video leads to another, and I can lose track of how long I've been looking at the screen.<br><br>Last week, for example, I picked up my phone while waiting for dinner to cook. I intended to check one message, but I ended up scrolling until my food was ready, and then continued while eating. Afterwards, I couldn't remember much of what I'd watched. That made the whole thing feel rather <mark class=\"idiom\">empty and repetitive(空洞而重复)</mark>.<br><br>I don't think all online entertainment is useless. A funny video can be a genuine break. <span class=\"conn\">However</span>, when I'm watching automatically rather than choosing what I want to see, it doesn't really help me relax or leave me with anything worthwhile.<br><br>I'm trying to change the habit by setting a short limit and putting my phone away afterwards. I still slip up sometimes, but I'm more aware of it now. I'd rather <mark class=\"idiom\">make room for(腾出时间给)</mark> a walk, a conversation or something I actually enjoy than let an algorithm decide my evening.",
      "t": "我经常做、却觉得浪费时间的活动是刷手机短视频。通常在晚上下班后，我会想先看两条，再做别的。<br><br>开始刷是因为轻松，不需要努力。忙了一天后，我不总想读长文章或认真做爱好。但一条接着一条，我很容易忘记时间。<br><br>上周做饭等待时，我本来只想看一条消息，却一直刷到饭好，吃饭时还继续。之后几乎想不起看了什么，因此觉得空洞而重复。<br><br>我不认为所有网上娱乐都无用，有趣的视频也能让人休息。但自动往下刷，而不是主动选择内容时，它既不能真正放松，也没留下多少价值。<br><br>我正尝试设时间限制，之后把手机放下。虽然仍会失误，但已有意识。我更愿意给散步、聊天或真正喜欢的活动腾时间，而不是让算法决定夜晚。",
      "p3": [
        {
          "q": "Why do some people refuse to abide by rules?",
          "a": "Some don't understand the purpose of a rule, while others think it is unfair or unlikely to be enforced. A few simply put their own convenience first. <span class=\"conn\">So</span>, clear explanations and consistent treatment matter. People are more likely to cooperate when rules are reasonable and everyone is expected to <mark class=\"idiom\">play their part(尽自己的责任)</mark>.",
          "t": "有人不懂规则目的，有人觉得不公平或不会执行，也有人只顾方便。清楚解释与一致对待很重要，规则合理且人人负责时更易合作。"
        },
        {
          "q": "What kinds of things make people feel pressured?",
          "a": "Deadlines, financial worries and high expectations can create pressure. People may also feel stressed when they lack control or receive conflicting demands. <span class=\"conn\">For example</span>, being asked to complete several urgent tasks at once can be overwhelming. The problem often comes from not having enough <mark class=\"idiom\">room to manoeuvre(调整的余地)</mark>.",
          "t": "期限、金钱担忧和高期待会带来压力，缺乏控制、要求冲突也会。例如多个任务同时急迫，缺少调整余地就容易不堪重负。"
        },
        {
          "q": "Will you continue doing something when you are aware that it’s a waste of time?",
          "a": "Sometimes I might continue out of habit, particularly if the activity offers easy entertainment. <span class=\"conn\">But</span> once I notice the pattern, I try to decide whether it's actually helping me rest. If not, setting a limit or changing the setting can help me <mark class=\"idiom\">break the cycle(打破循环)</mark> rather than just feel guilty afterwards.",
          "t": "有时会因习惯继续，尤其轻松娱乐。但发现后我会判断是否真的休息到，若没有，就设限制或换环境，打破循环而非事后内疚。"
        },
        {
          "q": "How do you balance life and work?",
          "a": "I try to set realistic priorities and leave some time that isn't filled with work. I also make plans with friends, so relaxation doesn't disappear from my schedule. <span class=\"conn\">Of course</span>, busy periods happen, but they shouldn't become the permanent <mark class=\"idiom\">default setting(常态)</mark>. Boundaries are easier to maintain when expectations are clear.",
          "t": "我设现实优先事项，留非工作时间，也安排见朋友，避免休息被挤走。忙碌时期会有，但不应永远如此。期待清晰时更容易保持边界。"
        },
        {
          "q": "Is it good to have a daily routine?",
          "a": "Usually, because it reduces small decisions and helps people make time for important tasks. <span class=\"conn\">However</span>, a routine should allow for changing needs and unexpected events. If it becomes too rigid, it can feel like another source of pressure. I'd aim for a dependable structure with some <mark class=\"idiom\">built-in flexibility(预留的灵活空间)</mark>.",
          "t": "通常好，能减少小决定、安排重要任务。但应适应变化与意外，过于僵硬会增加压力。理想是可靠结构中留灵活空间。"
        },
        {
          "q": "Do you think stress is important in people's lives?",
          "a": "A little pressure can sometimes encourage people to prepare or finish a task. <span class=\"conn\">But</span> constant stress isn't something I'd deliberately seek. People differ in how much pressure they can manage. The useful question is whether it helps them act or leaves them feeling <mark class=\"idiom\">unable to cope(无法应对)</mark>, rather than assuming more is better.",
          "t": "适度压力有时促使准备和完成，但不应追求持续压力。承受能力不同，应看它帮助行动还是让人无法应对，而非越多越好。"
        }
      ],
      "cat": "活动",
      "sourcePage": 14
    },
    {
      "id": "s26p2_16",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "👥",
      "ztitle": "拥挤地方",
      "describe": "Describe a crowded place you went to",
      "shouldsay": [
        "Where it was",
        "When you went there",
        "Who you went there with",
        "What you did there"
      ],
      "a": "A crowded place I went to was a popular weekend market in the centre of my city. I visited it with two friends on a Sunday afternoon last spring, because one of them wanted to buy a handmade birthday gift.<br><br>We knew it might be busy, but we hadn't expected such a large number of people. The market was held along a fairly narrow pedestrian street, with stalls on both sides. There were families, tourists and people who had simply stopped to have a look while passing through.<br><br>At first, the atmosphere was quite enjoyable. We looked at some ceramics, bought drinks and listened to a musician near the entrance. <span class=\"conn\">But</span> as we moved further in, it became difficult to walk without stopping every few steps. A queue outside a food stall almost blocked the street, and we had to wait before we could <mark class=\"idiom\">make our way through(穿过去)</mark>.<br><br>We stayed close together so we wouldn't lose one another. My friend eventually found a small handmade mug, and we decided to leave rather than spend another hour browsing. We then went to a quieter café nearby and could finally talk properly.<br><br>I was glad we'd visited, because the stalls were interesting and the market had a lively character. <span class=\"conn\">Still</span>, the crowd made the experience more tiring than relaxing. If I go again, I'll choose an earlier time. I'd like to enjoy the same place with a little more <mark class=\"idiom\">room to move(活动空间)</mark>.",
      "t": "去年春天一个周日下午，我和两位朋友去市中心热门的周末市场，其中一位想买手工生日礼物。<br><br>我们知道会忙，但没料到那么多人。市场设在较窄的步行街，两边是摊位，有家庭、游客和路过的人。<br><br>起初很开心，我们看陶瓷、买饮料，还听入口附近的音乐。但深入后几乎走几步就要停，食物摊的队伍差点堵住整条路。<br><br>我们靠近彼此，以免走散。朋友终于买到手工杯后，就不再继续逛，而是去附近安静咖啡馆，终于能好好聊天。<br><br>摊位有趣，市场也很热闹，所以我很高兴去过。不过拥挤让它更累而非放松。下次我会早一点去，希望有更多活动空间。",
      "p3": [
        {
          "q": "Do you think it is a good trend to have more big cities?",
          "a": "Large cities can offer jobs, services and cultural opportunities. <span class=\"conn\">However</span>, their growth needs careful planning, or congestion and housing pressure can outweigh the benefits. I'd prefer improving transport and public facilities alongside expansion. A city should become more <mark class=\"idiom\">liveable(宜居的)</mark>, not simply larger on a map.",
          "t": "大城市提供工作、服务和文化，但扩张须有规划，否则拥堵和住房压力可能超过好处。应同步改善交通设施，目标是更宜居，而非只增大面积。"
        },
        {
          "q": "Do you think there are some people who enjoy crowded places?",
          "a": "Yes, some people enjoy the energy of busy markets, festivals or concerts. Being surrounded by others can make an event feel exciting. <span class=\"conn\">But</span> enjoying a crowd occasionally doesn't mean wanting every daily journey to be crowded. The experience depends on whether people have chosen it and feel <mark class=\"idiom\">comfortable and secure(舒适、安全)</mark>.",
          "t": "有人喜欢市场、节庆、音乐会的活力，但偶尔享受人群不等于每天都想拥挤。是否自主选择、是否舒服安全会影响体验。"
        },
        {
          "q": "Why do people go to crowded places?",
          "a": "They may go because the place offers something popular, convenient or unusual. Sometimes they have little choice, such as using a busy station. <span class=\"conn\">So</span>, crowding doesn't always mean everyone enjoys the atmosphere. People may accept discomfort because the activity or service is <mark class=\"idiom\">worth the effort(值得付出这份努力)</mark>.",
          "t": "可能因为热门、方便或独特，也可能没选择，例如繁忙车站。因此拥挤不代表人人喜欢，只是活动或服务值得忍受不便。"
        },
        {
          "q": "Will people use bikes more or less in cities in the future?",
          "a": "It could go either way. Safe routes and convenient parking may encourage cycling, especially for short trips. <span class=\"conn\">However</span>, dangerous traffic or poor connections may put people off. I'd expect more cycling in cities that make it practical, rather than assume technology or environmental awareness alone will <mark class=\"idiom\">drive the change(推动改变)</mark>.",
          "t": "两种都有可能。安全路线和停车会鼓励短程骑车，危险交通和衔接差则让人退缩。要让骑车实际可行，不能只靠技术或环保意识。"
        },
        {
          "q": "Will there be more or less green space in cities in the future?",
          "a": "That depends on planning decisions. Development can remove green space, but cities can also protect parks and create smaller gardens within built-up areas. <span class=\"conn\">Ideally</span>, green space should grow alongside the population. I'd pay attention to access and quality, not only the total area, so residents can actually <mark class=\"idiom\">make use of it(使用它)</mark>.",
          "t": "取决于规划。建设可能占绿地，也可保护公园、增加小花园。最好随人口同步增长，也要看可达性和质量，让居民真正能用。"
        },
        {
          "q": "Which cities are overcrowded in your country?",
          "a": "Parts of major cities such as Beijing and Shanghai can feel very crowded, especially around transport hubs at peak times. <span class=\"conn\">However</span>, the whole city isn't equally busy. I'd be cautious about calling a place overcrowded without considering housing, services and local conditions, rather than judging only by a <mark class=\"idiom\">busy street(繁忙街道)</mark>.",
          "t": "北京、上海等大城市部分区域，尤其高峰交通节点，会很拥挤。但全城并不相同，应看住房、服务和具体条件，而非只凭繁忙街道判断。"
        }
      ],
      "cat": "地点",
      "sourcePage": 14
    },
    {
      "id": "s26p2_17",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "📜",
      "ztitle": "学习并喜欢历史的人",
      "describe": "Describe a person who learns history and loves history",
      "shouldsay": [
        "Who this person is",
        "How he/she learns history",
        "Why he/she loves history",
        "And explain how you feel about him/her"
      ],
      "a": "A person I know who loves learning history is my friend Ben. We met at university, where we were studying different subjects, but we became friends after joining the same reading group. History isn't his job; it's an interest he follows in his own time.<br><br>He learns in several ways. He reads books written for general readers, visits museums and occasionally listens to talks. What I like is that he doesn't rely on just one dramatic video online. If something sounds surprising, he looks for other sources before treating it as a fact.<br><br>He's particularly interested in everyday life in the past. He wants to know how people travelled, what they ate and how ordinary families dealt with change. <span class=\"conn\">For him</span>, history isn't simply a list of rulers and battles. It's a way of understanding people whose circumstances were different from ours.<br><br>Once, we visited a local museum together. I would probably have walked past a display of old household objects, but he helped me think about what those objects suggested about people's routines. He didn't lecture me; he asked questions that made the display more interesting.<br><br>I admire his curiosity and his willingness to admit when he doesn't know something. Being around him has made me <mark class=\"idiom\">look beyond the surface(透过表面看问题)</mark> and notice the history of familiar places. He has shown me that studying the past can <mark class=\"idiom\">bring the present into focus(让当下变得更清晰)</mark>, rather than just fill your head with dates.",
      "t": "我的朋友Ben喜欢学习历史。我们大学专业不同，因为同一个读书小组成为朋友。历史不是他的职业，而是业余兴趣。<br><br>他读面向普通读者的历史书，参观博物馆，偶尔听讲座。他不会只依赖网上一段戏剧化视频；遇到惊人的说法，会找其他来源核对。<br><br>他尤其关心过去的日常生活，比如交通、饮食，以及普通家庭如何面对变化。历史对他不是统治者和战争的清单，而是理解不同处境中的人。<br><br>有次一起逛本地博物馆，我本来会略过旧生活用品，他却通过提问，让我思考这些东西反映了怎样的日常。<br><br>我欣赏他的好奇心和承认不知道的态度。他让我透过表面看熟悉的地方，也明白学习过去能帮助理解当下，而不只是记日期。",
      "p3": [
        {
          "q": "Besides big historical events, what else is important when learning history?",
          "a": "Everyday life matters too, including work, food, family relationships and the experiences of ordinary people. These details help explain how larger events affected society. <span class=\"conn\">Also</span>, students should learn how historical claims are supported. Knowing how to examine evidence is more useful than simply accepting a <mark class=\"idiom\">single version of events(单一叙事)</mark>.",
          "t": "日常生活也重要，包括工作、食物、家庭与普通人经历，能解释大事件如何影响社会。还应学习检验证据，而非只接受单一叙事。"
        },
        {
          "q": "Do you think people should learn ancient history before learning modern history?",
          "a": "A chronological approach can make connections easier to follow, but it isn't the only useful method. Starting with a familiar modern issue may create interest, then lead students back to earlier events. <span class=\"conn\">For me</span>, the key is helping them understand relationships between periods, rather than enforcing one <mark class=\"idiom\">fixed order(固定顺序)</mark>.",
          "t": "按时间学便于理解联系，但不是唯一方法。熟悉的现代议题也可引出更早历史。关键是理解时期之间的关系，而非强制固定顺序。"
        },
        {
          "q": "Is it important to learn how people in the past lived their lives?",
          "a": "Yes, because it shows that history involves real people dealing with practical problems. Learning about homes, work or childhood can make the past more understandable. <span class=\"conn\">It also</span> helps us question the idea that today's routines are the only possible ones. That gives learners a broader <mark class=\"idiom\">frame of reference(参照视野)</mark>.",
          "t": "重要，因为历史是实际生活中的人应对问题。了解住房、工作、童年让过去更易理解，也提醒我们今天的生活方式不是唯一可能。"
        },
        {
          "q": "How do children learn history before they attend school?",
          "a": "They may hear family stories, look at old photographs or visit a local museum with adults. Simple stories about how things used to be can introduce the idea of the past. <span class=\"conn\">At that stage</span>, curiosity matters more than remembering dates. Familiar objects help children <mark class=\"idiom\">make a connection(建立联系)</mark> with something they haven't experienced.",
          "t": "入学前可听家庭故事、看旧照片、随大人逛博物馆。简单讲述过去即可启蒙，此时好奇比记日期重要，熟悉物品帮助建立联系。"
        },
        {
          "q": "At what age do you think people should begin to learn history?",
          "a": "It can begin quite early through stories and personal memories, while more formal study can develop as children grow. <span class=\"conn\">However</span>, the material should suit their understanding. A young child may grasp the history of a toy more easily than a complex political conflict. There's no need to <mark class=\"idiom\">rush the process(操之过急)</mark>.",
          "t": "可以较早从故事和个人记忆开始，正式学习逐步发展。内容应符合理解力，玩具历史可能比政治冲突容易，不必急。"
        },
        {
          "q": "Do you think children should begin learning history from an early age?",
          "a": "Yes, if it is introduced in an engaging and age-appropriate way. It can help children understand change and develop interest in people beyond their immediate world. <span class=\"conn\">But</span> early learning shouldn't mean memorising long lists. Questions, stories and visits can make history <mark class=\"idiom\">come alive(鲜活起来)</mark> without turning it into a heavy academic burden.",
          "t": "可以，方式须有趣、适龄，帮助理解变化和其他人。但不是背长清单，问题、故事、参观能让历史鲜活，而不增加沉重负担。"
        }
      ],
      "cat": "人物",
      "sourcePage": 14
    },
    {
      "id": "s26p2_18",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "👩‍🏫",
      "ztitle": "教你新技能的人",
      "describe": "Describe a person who taught you a new skill",
      "shouldsay": [
        "Who this person was",
        "What the skill was",
        "How you learned it",
        "And explain how you felt about this person"
      ],
      "a": "A person who taught me a useful new skill was my friend Lucy. About a year ago, she showed me how to use a spreadsheet to organise the timetable for a small teaching project. I had used spreadsheets before, but mainly as a place to type information, so I didn't know how much time the basic functions could save.<br><br>We sat down with a real example from my work. Lucy first helped me separate the information into clear columns, such as the date, the class and the teacher. Then she showed me how to sort the rows and use a simple formula to count the number of sessions.<br><br>What made her teaching effective was that she didn't take over the keyboard for the whole lesson. She demonstrated one step, then asked me to repeat it and explain what I was doing. <span class=\"conn\">If</span> I made a mistake, we looked at it together instead of starting everything again. That helped the process <mark class=\"idiom\">sink in(真正理解、记住)</mark>.<br><br>Afterwards, I practised on another timetable by myself. I still had to check my notes, but I could complete the task much faster and spot clashes more easily.<br><br>I felt grateful to Lucy because she treated my beginner questions seriously. She made a technical skill feel approachable and encouraged me to <mark class=\"idiom\">learn by doing(通过实践学习)</mark>. Since then, I've used the same method in other areas of my work, so one short lesson has turned out to be surprisingly valuable.",
      "t": "大约一年前，朋友Lucy教我用电子表格安排一个小型教学项目的时间表。我以前只把表格当作输入信息的地方，不知道基础功能能省这么多时间。<br><br>我们用实际工作例子练习。她先帮我把日期、课程、教师分成清晰的列，再教我排序，以及用简单公式统计课次。<br><br>她不会一直替我操作，而是演示一步，让我重复并解释。出错时一起查看，而不是全部重来，这让我真正理解。<br><br>之后我独立做另一份课表，虽然仍要查笔记，但速度更快，也更容易发现时间冲突。<br><br>我很感谢她，因为她认真对待初学者的问题，让技术技能变得易于接近，并鼓励我通过实践学习。后来我在其他工作中也用了这套方法，一次短课因此非常有价值。",
      "p3": [
        {
          "q": "Why is self-discipline important when learning a new skill?",
          "a": "Learning often includes repetitive practice and moments when progress is hard to see. Self-discipline helps people continue without relying on excitement every day. <span class=\"conn\">However</span>, it should include realistic goals and rest, rather than constant pressure. A manageable routine makes it easier to <mark class=\"idiom\">stay the course(坚持下去)</mark> over time.",
          "t": "学习有重复练习和看不到进步的阶段，自律帮助不靠每天兴奋也能继续。但要有现实目标和休息，可持续的安排比持续施压更好。"
        },
        {
          "q": "What are the differences between learning from a teacher and learning by oneself?",
          "a": "A teacher can explain mistakes, provide feedback and choose a useful sequence of tasks. Learning alone gives more freedom but requires judging information and checking progress yourself. <span class=\"conn\">Ideally</span>, people can combine both: get guidance on difficult points, then practise independently. That supports confidence without creating too much <mark class=\"idiom\">dependence on others(对他人的依赖)</mark>.",
          "t": "老师能纠错、反馈、安排顺序，独学更自由，但需自己判断信息与进度。两者结合，难点求指导、之后独练，能建立信心并减少依赖。"
        },
        {
          "q": "How do adults learn a new skill?",
          "a": "Adults often choose skills connected to work, a hobby or a practical need. They may use courses, tutorials and advice from more experienced people. <span class=\"conn\">Because</span> their time is limited, regular short sessions can be more realistic than occasional long ones. Applying the skill quickly helps the learning <mark class=\"idiom\">stick(被真正记住)</mark>.",
          "t": "成年人常学与工作、爱好或需求相关的技能，使用课程、教程或请教。有时间限制时，规律短练更现实，及时应用有助于记住。"
        },
        {
          "q": "How can parents and teachers teach children new skills?",
          "a": "They can demonstrate clearly, divide the task into small steps and let children try it themselves. Feedback should be specific and encouraging. <span class=\"conn\">For example</span>, showing what to change is more helpful than saying something is wrong. Adults should give enough support while allowing children to <mark class=\"idiom\">work things out(自己琢磨解决)</mark>.",
          "t": "可以清楚示范、拆小步骤、让孩子操作，反馈要具体且鼓励。说明如何改比只说错更有用，应支持但保留自己解决的空间。"
        },
        {
          "q": "Where can children learn new skills?",
          "a": "They can learn at school, at home, in clubs and through community activities. Friends and relatives can also share skills. <span class=\"conn\">However</span>, access isn't equal, so affordable local opportunities matter. Children shouldn't have to attend an expensive course every time they want to <mark class=\"idiom\">try something new(尝试新事物)</mark>.",
          "t": "学校、家庭、社团、社区都能学，亲友也能教。但资源不均，平价本地机会很重要，不应每次尝新都依赖昂贵课程。"
        },
        {
          "q": "Why should children learn new skills?",
          "a": "New skills help them explore interests, become more independent and experience progress through effort. They can also create opportunities to cooperate with others. <span class=\"conn\">But</span> children don't need to collect achievements constantly. Learning is valuable when it builds curiosity and confidence, rather than simply adding another item to a <mark class=\"idiom\">long list of expectations(长长的要求清单)</mark>.",
          "t": "新技能帮助探索兴趣、独立、体验努力后的进步，也创造合作机会。但不需不停积累成就，学习应建立好奇与信心，而非增加要求清单。"
        }
      ],
      "cat": "人物",
      "sourcePage": 15
    },
    {
      "id": "s26p2_19",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🎬",
      "ztitle": "不喜欢的电影",
      "describe": "Describe a movie/film you don’t like",
      "shouldsay": [
        "When you watched it",
        "Where you watched it",
        "What it was about",
        "And explain why you don’t like it"
      ],
      "a": "A film I didn't enjoy was a science-fiction action movie I watched at home last month. A friend had recommended it, and the trailer looked exciting, so I rented it online one Friday evening when I had no other plans.<br><br>The story followed a group of people trying to stop a powerful machine from controlling their city. On paper, that sounded interesting. I normally enjoy films that combine an unusual idea with believable characters, so I expected to get quite involved.<br><br><span class=\"conn\">Unfortunately</span>, the film spent much more time on explosions and chase scenes than on developing the people in the story. Important decisions happened very quickly, and I couldn't understand why some characters changed their minds. The dialogue also explained things that were already obvious on screen, which made it feel rather unnatural.<br><br>The visual effects were impressive, and I can understand why someone who mainly wanted a fast-moving spectacle might like it. <span class=\"conn\">But</span> they weren't enough to <mark class=\"idiom\">keep me engaged(让我保持投入)</mark>. By the middle of the film, I was checking how much time was left instead of wondering what would happen next.<br><br>I finished it because I hoped the ending would bring everything together, but it didn't really do that for me. I wouldn't say it was the worst film ever made; it simply didn't suit my taste. It reminded me that a strong story matters more to me than a large budget or <mark class=\"idiom\">eye-catching effects(吸引眼球的特效)</mark>.",
      "t": "上个月，我在家看了一部不喜欢的科幻动作片。朋友推荐过，预告也很刺激，所以某个没安排的周五晚上，我在线租来看。<br><br>故事是一群人试图阻止强大的机器控制城市。听起来有趣，我也喜欢有新颖想法和可信人物的电影，因此原本很期待。<br><br>可惜电影大部分时间在展示爆炸和追逐，却没有发展人物。重要决定发生得很快，我不明白人物为什么改主意；对白还反复解释画面已经说明的事。<br><br>特效很厉害，我能理解想看快节奏场面的人会喜欢。但它不足以让我投入，看到中间我已经在查看剩余时长。<br><br>我坚持看完，希望结尾能把故事整合好，但并没有打动我。它不是最差的电影，只是不合口味。这提醒我，扎实故事比大制作和醒目特效更重要。",
      "p3": [
        {
          "q": "Do people’s movie preferences change as they get older?",
          "a": "They often do, because people's experiences and interests change. Someone who mainly enjoyed action films as a child may later appreciate slower stories or different themes. <span class=\"conn\">However</span>, it's not a fixed pattern. People can develop new tastes while still enjoying old favourites, so preferences don't simply <mark class=\"idiom\">change overnight(一夜之间改变)</mark>.",
          "t": "口味常随经历和兴趣改变，但不是固定规律。可以发展新喜好，也保留旧爱，不会简单地一夜改变。"
        },
        {
          "q": "Should documentary films be completely truthful?",
          "a": "Documentaries should aim for accuracy and avoid misleading viewers. <span class=\"conn\">However</span>, every film involves selection and editing, so it can't present every detail of reality. Filmmakers should be clear about reconstruction and uncertainty. The important thing is to help viewers distinguish evidence from interpretation, rather than <mark class=\"idiom\">blur the line(模糊界线)</mark> between them.",
          "t": "纪录片应准确、不误导，但取舍和剪辑不可能呈现全部现实。重现与不确定性应说明，帮助区分证据和解读，而非混淆。"
        },
        {
          "q": "Can movies help people better understand the cultural background of a country?",
          "a": "Yes, films can show language, family life, customs and social concerns in a vivid way. <span class=\"conn\">But</span> one film can't represent a whole country, and fiction may exaggerate things. I'd treat it as a starting point for curiosity, then look for other perspectives to <mark class=\"idiom\">fill in the gaps(补充缺失部分)</mark>.",
          "t": "能生动展示语言、家庭、习俗和社会关切，但一部电影不代表全国，虚构也会夸张。应作为好奇的起点，再用其他视角补充。"
        },
        {
          "q": "Are movies more likely to help people become more creative than books?",
          "a": "I wouldn't say so generally. Movies offer powerful images and sound, while books ask readers to imagine much of the scene themselves. <span class=\"conn\">Both</span> can inspire new ideas. Creativity probably depends more on how actively someone responds to the story than on the medium alone. Simply watching or reading passively may have <mark class=\"idiom\">limited value(有限的作用)</mark>.",
          "t": "不一定。电影有画面声音，书要求读者想象，两者都能启发。创意更取决于主动回应故事，而非媒介；被动观看或阅读作用有限。"
        },
        {
          "q": "What are the differences between watching movies at home and in a cinema?",
          "a": "At home, people control the timing, can pause and usually spend less. A cinema offers a large screen, stronger sound and fewer household distractions. <span class=\"conn\">However</span>, it can be expensive or noisy if other viewers are inconsiderate. I'd choose according to the film and whether I want a <mark class=\"idiom\">shared experience(共同观影体验)</mark>.",
          "t": "在家可暂停、自由安排、成本较低，影院屏幕音效好、少家务干扰，但也可能贵或受他人噪声影响。我会按电影和是否想共享体验选择。"
        },
        {
          "q": "What kinds of movies are the most popular in China?",
          "a": "Comedies, action films and family stories seem to attract a broad audience, although tastes vary a lot. Some viewers also enjoy animation, documentaries or smaller independent films. <span class=\"conn\">So</span>, I wouldn't reduce popularity to one genre. A film's story, reputation and timing can matter as much as its <mark class=\"idiom\">category label(类型标签)</mark>.",
          "t": "喜剧、动作、家庭故事似乎受众广，但口味多样，也有人爱动画、纪录片和独立电影。不能只看类型，故事、口碑和上映时机也影响吸引力。"
        }
      ],
      "cat": "物品",
      "sourcePage": 15
    },
    {
      "id": "s26p2_20",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🚌",
      "ztitle": "不喜欢的短途旅行",
      "describe": "Describe a short trip you often take but do not like",
      "shouldsay": [
        "Where you go",
        "When you go there",
        "Why you go there",
        "And explain why you do not like the trip"
      ],
      "a": "A short trip I often take but don't particularly enjoy is the journey to a printing shop on the other side of town. I go there roughly twice a month to collect teaching materials, because the shop can produce the booklets in the format I need.<br><br>The journey takes about forty minutes each way. I usually take the bus and then walk for another ten minutes. That isn't especially long, but the bus route passes through a busy junction, so the actual travel time can be quite unpredictable.<br><br>What I dislike is that the trip is mostly waiting rather than doing anything interesting. Sometimes I arrive at the bus stop just after a bus has left. Once I reach the shop, there may be another queue, even when I've ordered in advance. It can feel as though a simple collection takes up <mark class=\"idiom\">half the afternoon(半个下午)</mark>.<br><br><span class=\"conn\">Also</span>, carrying a heavy bag of booklets home isn't much fun, particularly in hot weather or rain. I don't mind walking when I'm exploring somewhere, but this journey follows the same route every time and doesn't give me much to look forward to.<br><br>I still make the trip because the materials are important and the staff do good work. I'm trying to organise larger orders less often, so I can <mark class=\"idiom\">cut down on(减少)</mark> the number of journeys. If the shop offered a reliable delivery option, I'd happily use it. That would make this routine task much easier to fit around my other work.",
      "t": "我经常进行但不喜欢的短途行程，是去城另一边的印刷店取教学材料。大约每月两次，因为那家店能按我需要的格式制作讲义。<br><br>单程约四十分钟，先坐公交，再走十分钟。时间不算特别长，但路线经过繁忙路口，所以耗时难预测。<br><br>最不喜欢的是大部分时间在等。可能刚到站车就走了，到了店里即使提前下单，也可能排队。简单取货有时占了半个下午。<br><br>带着沉重讲义回家也不轻松，尤其天热或下雨时。我不介意探索新地方时走路，但这条重复路线没什么值得期待。<br><br>我仍然去，因为资料重要，店员也做得好。我正尝试把订单集中起来、减少往返。如果有可靠配送，我很愿意用，这样就更容易安排其他工作。",
      "p3": [
        {
          "q": "What problems does it cause for transportation when everyone commutes at the same time?",
          "a": "It creates congestion, crowded vehicles and pressure on stations and roads. Small delays can spread because so many people depend on the same routes at once. <span class=\"conn\">Where possible</span>, staggered starting times and better connections could help <mark class=\"idiom\">spread the demand(分散需求)</mark>. The aim is to make travel more reliable, not just add more space for traffic.",
          "t": "同时通勤会堵路、挤车、增加站点压力，小延误也易扩散。可错峰开始、改善衔接，分散需求，让交通更可靠。"
        },
        {
          "q": "What are the benefits of travelling abroad?",
          "a": "Travelling abroad can expose people to different routines, languages and ways of solving everyday problems. It may also challenge assumptions they haven't questioned before. <span class=\"conn\">However</span>, the benefit depends on how they travel. Talking to people and paying attention often teaches more than simply <mark class=\"idiom\">rushing from place to place(匆忙辗转各地)</mark>.",
          "t": "出国可接触不同生活、语言和做法，挑战原有假设。但取决于旅行方式，交流和观察通常比匆忙赶景点更有收获。"
        },
        {
          "q": "Which is better for knowing more about a country? Travelling or reading books about it?",
          "a": "They offer different kinds of understanding. Books provide context and perspectives beyond one person's short visit, while travel gives direct experiences of particular places. <span class=\"conn\">Ideally</span>, they support each other. Reading first can help someone ask better questions, and travelling may make the information feel more <mark class=\"idiom\">concrete and memorable(具体、难忘)</mark>.",
          "t": "书提供背景和多视角，旅行提供具体体验。最好互相支持：先读有助于提问，实际旅行又让信息更具体、更难忘。"
        },
        {
          "q": "How much time do you think people should spend on a trip abroad?",
          "a": "There isn't one ideal length. It depends on the destination, the purpose and the person's resources. A short trip can be worthwhile if expectations are realistic. <span class=\"conn\">But</span> trying to cover too many places quickly may leave little time to understand anything. I'd favour enough time to <mark class=\"idiom\">travel at a reasonable pace(以合理节奏旅行)</mark>.",
          "t": "没有固定时长，取决于目的地、目的和资源。短旅行也有价值，但快速覆盖太多地方会缺乏理解时间。我更赞成合理节奏。"
        },
        {
          "q": "Who prefers travelling abroad? The young or the old?",
          "a": "Both groups can enjoy it, but their opportunities and priorities may differ. Younger people might have more flexibility, while some older people have more free time after retiring. <span class=\"conn\">However</span>, finances, responsibilities and personal interests often matter more than age. I wouldn't assume one group is always more <mark class=\"idiom\">keen to explore(热衷探索)</mark>.",
          "t": "两组都可能喜欢，年轻人可能灵活，退休长者可能时间更多。但金钱、责任、兴趣常比年龄重要，不能一概而论。"
        },
        {
          "q": "Do Chinese people like travelling abroad?",
          "a": "Some do, because they enjoy new scenery, food or cultural experiences. Others prefer domestic travel or don't have the time and resources to go abroad. <span class=\"conn\">So</span>, the preference varies widely. I'd say travelling overseas appeals to many people, but it isn't a universal <mark class=\"idiom\">ambition(愿望)</mark> or the only enjoyable way to travel.",
          "t": "有人因风景、食物、文化喜欢出国，也有人偏好国内或缺少时间资源。因此差异很大，出国不是人人愿望，也不是唯一好旅行。"
        }
      ],
      "cat": "经历",
      "sourcePage": 16
    },
    {
      "id": "s26p2_21",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "⭐",
      "ztitle": "受欢迎的人",
      "describe": "Describe a popular person",
      "shouldsay": [
        "Who this person is",
        "What kind of person he or she is",
        "When you see him/her normally",
        "And explain why you think this person is popular"
      ],
      "a": "A popular person I know is a teacher called Mr Zhao, who worked at the language centre where I used to study. I normally saw him in class or in the corridor, but he also helped organise a few student activities.<br><br>He wasn't popular because he gave everyone easy work or avoided rules. In fact, he expected students to prepare properly and arrive on time. What made him different was the way he treated people. He learned our names, remembered our interests and never made someone feel foolish for asking a basic question.<br><br>His classes were lively because he connected the material with real situations. If we were learning how to express an opinion, he might ask us to discuss a small everyday problem rather than repeat sentences from a book. He also had a gentle sense of humour, which helped people <mark class=\"idiom\">feel at ease(感到自在)</mark>.<br><br>I remember one new student who was very quiet. Mr Zhao gave her time to think and invited her to join a small group instead of putting her on the spot in front of everyone. After a few weeks, she started participating much more confidently.<br><br>I think he was popular because he combined competence with kindness. Students could see that they were learning, and they felt respected at the same time. <span class=\"conn\">For me</span>, that's a much stronger reason to like someone than their appearance or online following. His popularity grew naturally from the way he <mark class=\"idiom\">brought out the best in people(激发人们最好的一面)</mark>.",
      "t": "我认识的一位受欢迎的人是赵老师。他在我以前就读的语言中心任教，我通常在课堂或走廊见到他，他也参与组织学生活动。<br><br>他不是靠任务轻松或不设规则来受欢迎，反而要求认真准备、准时到。他特别之处是待人的方式：记名字、记兴趣，不让学生因问基础问题而难堪。<br><br>课堂有活力，因为他把内容联系实际。学习表达观点时，会让我们讨论日常问题，而非照书重复。他温和的幽默也让人放松。<br><br>有位新生很安静，他没有让她当众承压，而是给思考时间，让她先参与小组。几周后，她自信了很多。<br><br>我觉得他受欢迎，是因为能力与善意并存。学生既看得到进步，也感到尊重。他的受欢迎来自激发他人的潜力，而不是外表或网络粉丝量。",
      "p3": [
        {
          "q": "Why do people want to be popular?",
          "a": "People may want acceptance, recognition or the opportunities that come with being well known. Popularity can make them feel that others value what they do. <span class=\"conn\">However</span>, chasing approval constantly can become exhausting. A few strong relationships may offer more meaningful support than trying to <mark class=\"idiom\">please everyone(取悦所有人)</mark>.",
          "t": "人们想被接纳、认可，也想获得知名度带来的机会。但不断追求赞同会累，几段稳固关系可能比取悦所有人更有意义。"
        },
        {
          "q": "Is it easier to become popular nowadays?",
          "a": "It's easier to reach a large audience through online platforms, but that doesn't mean lasting popularity is easy. Attention can disappear quickly, and many people compete for it. <span class=\"conn\">So</span>, someone may become visible overnight yet still need effort to <mark class=\"idiom\">build a genuine connection(建立真正联系)</mark> with the people who follow them.",
          "t": "网络更易触达大受众，但持久受欢迎不容易，注意力消失快、竞争多。短时间被看见之后，仍需建立真正联系。"
        },
        {
          "q": "What are the qualities of being a good teacher?",
          "a": "A good teacher needs subject knowledge, clear explanations and patience. They should also notice when students are confused and adapt rather than repeat the same explanation louder. <span class=\"conn\">For me</span>, fairness and useful feedback matter as well. The aim is to help learners <mark class=\"idiom\">make real progress(取得真实进步)</mark>, not simply entertain them.",
          "t": "好老师需要知识、清楚解释、耐心，能发现困惑并调整，也应公平、提供有用反馈。目标是学生进步，而非只娱乐。"
        },
        {
          "q": "Do you think good teachers are always popular among students?",
          "a": "Not always. A teacher may be effective but set demanding tasks that students don't enjoy immediately. Conversely, an entertaining teacher may be liked without helping much. <span class=\"conn\">Ideally</span>, respect and progress lead to popularity over time. I'd look beyond the first impression and ask what students are actually <mark class=\"idiom\">getting out of the class(从课堂中获得)</mark>.",
          "t": "不总是。有效教师可能要求高，娱乐性强的教师却未必帮助大。最好长期因尊重和进步受欢迎，应看实际学习收获。"
        },
        {
          "q": "Is it important for a teacher to be popular?",
          "a": "Being approachable matters because students are more likely to ask questions and participate. <span class=\"conn\">But</span> popularity shouldn't be the main target. A teacher still needs to make fair decisions and sometimes challenge learners. I'd value trust and respect more than being everyone's favourite or avoiding anything that might <mark class=\"idiom\">ruffle feathers(引起不满)</mark>.",
          "t": "容易接近能鼓励提问和参与，但受欢迎不应是主要目标。仍需公平决定、有时挑战学生。我更看重信任和尊重，而非避免一切不满。"
        },
        {
          "q": "Why are some students popular in school?",
          "a": "Some are popular because they're friendly, inclusive or good at bringing people together. Others become well known through sport, performance or another interest. <span class=\"conn\">However</span>, visibility and genuine friendship aren't identical. Students who <mark class=\"idiom\">make others feel welcome(让别人感到被接纳)</mark> may have a more positive influence than those who simply attract attention.",
          "t": "有人友善、包容、会组织，也有人因运动表演出名。但显眼不等于真实友谊，让别人感到被接纳的人可能更有积极影响。"
        }
      ],
      "cat": "人物",
      "sourcePage": 16
    },
    {
      "id": "s26p2_22",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🏅",
      "ztitle": "钦佩的运动员",
      "describe": "Describe a successful sportsperson you admire",
      "shouldsay": [
        "Who he/she is",
        "What you know about him/her",
        "What he/she is like in real life",
        "What achievement he/she has made"
      ],
      "a": "A successful sportsperson I admire is my friend Daniel, who is an amateur runner. We grew up together, and although he doesn't compete professionally, he has achieved something I find genuinely impressive: he won a local ten-kilometre race in his age group after several years of steady training.<br><br>I know quite a lot about his progress because we talk regularly. He started running simply to become more active, then gradually became interested in racing. He trained before work or at weekends and kept realistic goals instead of trying to improve every result immediately.<br><br>In real life, he's quite modest. He doesn't turn every conversation into a discussion of his achievements, and he's always happy to run slowly with beginners. He also volunteers at local events, so his interest in sport isn't only about receiving a medal.<br><br>What I admire most is his discipline. He plans his sessions, allows time to recover and accepts that some days won't go well. <span class=\"conn\">When</span> he finally won that race, he thanked the people who had trained with him rather than acting as if he'd done everything alone.<br><br>His success has meaning for me because I saw the effort behind it. He isn't a world-famous athlete, but he shows how sport can <mark class=\"idiom\">bring out determination(培养坚定意志)</mark> and build a community. He has encouraged me to <mark class=\"idiom\">set the bar higher(提高目标要求)</mark> for myself while still remembering that progress takes time.",
      "t": "我钦佩的成功运动员是朋友Daniel，一名业余跑者。我们一起长大。他不是职业选手，但通过几年稳定训练，赢得本地十公里赛年龄组冠军，这让我很敬佩。<br><br>我们常聊天，所以我了解他的进步。他起初只是想多运动，后来才对竞赛产生兴趣。他在上班前或周末训练，设现实目标，不急于每次都提高成绩。<br><br>生活中他很谦虚，不会每次都谈自己的成就，也愿意陪新手慢跑，还会在本地活动做志愿者，因此运动对他不只有奖牌。<br><br>我最欣赏他的自律：有计划、安排恢复、接受状态不佳的日子。获胜后，他感谢一起训练的人，而不是把功劳全归自己。<br><br>我亲眼见过背后的努力，所以这份成功有意义。他并非世界明星，却展示了运动如何培养意志、形成社群，也鼓励我提高目标，同时尊重进步所需的时间。",
      "p3": [
        {
          "q": "Why are there so few top athletes?",
          "a": "Reaching the top requires a rare combination of ability, training, opportunity and sustained commitment. Competition becomes increasingly strong as the level rises. <span class=\"conn\">Also</span>, not everyone has access to good coaching or support. Even excellent athletes may fall short, so success isn't just a matter of <mark class=\"idiom\">wanting it enough(足够渴望)</mark>.",
          "t": "顶尖需要能力、训练、机会和持续投入的罕见结合，级别越高竞争越强，资源也不均。优秀者也可能未达到顶端，不只看愿望。"
        },
        {
          "q": "What is the most popular sport in your country?",
          "a": "I'd name basketball or table tennis as sports with a lot of visibility, although I wouldn't claim one is the clear winner everywhere. People's choices depend on facilities and local habits. <span class=\"conn\">For example</span>, walking and casual running may be more common in daily life than watching a <mark class=\"idiom\">competitive match(竞技比赛)</mark> suggests.",
          "t": "篮球或乒乓球曝光高，但不能说全国哪项绝对第一。选择受设施与习惯影响，日常散步、跑步可能比观看竞技赛事显示的更常见。"
        },
        {
          "q": "Is it easy to identify children’s talents?",
          "a": "Not always. Early performance can reflect experience or confidence as much as underlying ability. Children also develop at different rates. <span class=\"conn\">So</span>, I'd give them varied opportunities and observe over time rather than attach a fixed label too soon. Enjoyment and willingness to practise can be just as <mark class=\"idiom\">worth noticing(值得留意)</mark>.",
          "t": "不容易，早期表现可能反映经验或自信，发展速度也不同。应提供多样机会、长期观察，别过早定性，兴趣与练习意愿也值得关注。"
        },
        {
          "q": "Is talent important in sports?",
          "a": "Talent can help, especially at a high competitive level, but it needs training and a suitable environment to develop. <span class=\"conn\">At the same time</span>, effort matters even for someone who is naturally gifted. I'd avoid presenting talent as an excuse either to stop practising or to <mark class=\"idiom\">give up before trying(未尝试就放弃)</mark>.",
          "t": "天赋有帮助，尤其高级竞技，但需训练与环境发展。努力同样重要，不应拿天赋当停止练习或未试先弃的借口。"
        },
        {
          "q": "What qualities should an athlete have?",
          "a": "Discipline, resilience and the ability to learn from feedback are important. Athletes also need cooperation, even in sports that look individual, because coaches and support teams contribute. <span class=\"conn\">However</span>, determination should be balanced with sensible judgement. Knowing when to adjust a plan is part of <mark class=\"idiom\">long-term commitment(长期投入)</mark>, rather than a sign of weakness.",
          "t": "自律、韧性、接受反馈、合作都重要。即使个人项目也依赖教练团队。决心应配合理性判断，适时调整是长期投入的一部分。"
        },
        {
          "q": "Should students have physical education and do sports at school?",
          "a": "Yes, schools should give students opportunities to move, learn basic skills and enjoy different activities. <span class=\"conn\">But</span> participation shouldn't depend only on being good at competitive sport. A range of options can include more children and help them build confidence. The aim should be positive experience and <mark class=\"idiom\">lasting interest(长期兴趣)</mark>, rather than selecting a few winners.",
          "t": "应该，但参与不应只属于竞技能力强的学生。多种选择可让更多孩子建立信心，目标是积极体验和长期兴趣，而非只挑赢家。"
        }
      ],
      "cat": "人物",
      "sourcePage": 17
    },
    {
      "id": "s26p2_23",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "📚",
      "ztitle": "喜欢的公共建筑",
      "describe": "Describe a public building you enjoy visiting (e.g. a library, a shopping mall, a sports hall, etc.)",
      "shouldsay": [
        "Where it is",
        "How you knew it",
        "What it looks like",
        "And explain why you enjoy visiting it"
      ],
      "a": "A public building I enjoy visiting is the central library in my city. It's near a large park, and I first discovered it when a friend invited me to a weekend talk there about travel writing.<br><br>From outside, the building looks modern but fairly simple. It has a wide entrance, large windows and pale walls. Inside, there's a bright central area, with reading rooms on different floors and clear signs that make it easy to find your way around. I especially like the seats beside the windows, where you can see the trees outside.<br><br>I usually go there once or twice a month. Sometimes I borrow a book, but often I just bring my laptop and spend an hour reading or preparing work. There are quiet study areas as well as spaces where people can talk, so different visitors don't have to <mark class=\"idiom\">get in each other's way(互相妨碍)</mark>.<br><br>What I enjoy most is the atmosphere. Nobody expects me to buy a drink or leave after a certain time. I can concentrate, browse something unexpected and take a break without feeling rushed. The staff are helpful if I need to locate a particular book.<br><br><span class=\"conn\">For me</span>, the library is more than a place that stores books. It's a shared space that makes learning accessible and gives people somewhere comfortable to spend time. I always leave feeling that I've had a useful, peaceful afternoon, which is why it has become one of my favourite places to <mark class=\"idiom\">drop into(顺便去)</mark>.",
      "t": "我喜欢去的公共建筑是城市中央图书馆。它在大公园附近，我第一次知道它，是朋友邀请我去参加旅行写作讲座。<br><br>外观现代简洁，有宽入口、大窗和浅色墙。内部中央区域明亮，各层有阅览室，标识清晰。我尤其喜欢窗边能看树的座位。<br><br>我通常每月去一两次，有时借书，更多时候带电脑阅读或备课。安静自习区与可交谈空间分开，因此不同需求的访客不互相妨碍。<br><br>我最喜欢那里的氛围。不必买饮料，也不用在规定时间离开。我可以专注、偶然发现有趣书籍，也能不慌不忙地休息，工作人员找书时也很有帮助。<br><br>对我来说，它不只是存书的地方，也是让学习更容易、让人舒服停留的共享空间。我离开时总觉得下午过得充实而平静，因此很喜欢顺便去。",
      "p3": [
        {
          "q": "Why do people visit historic buildings?",
          "a": "People may be interested in architecture, history or the stories connected with a building. Seeing it in person can make the past feel more tangible than a photograph does. <span class=\"conn\">Some</span> also visit for a quiet atmosphere or a sense of local identity. The building gives them a <mark class=\"idiom\">connection with the past(与过去的联系)</mark>.",
          "t": "人们可能想了解建筑、历史、相关故事，现场体验比照片更具体，也可能寻找安静氛围或地方认同，与过去建立联系。"
        },
        {
          "q": "Should modern buildings replace traditional buildings?",
          "a": "Sometimes replacement is necessary, but it shouldn't be automatic. Traditional buildings may have cultural value and can occasionally be adapted for new uses. <span class=\"conn\">However</span>, safety and practical needs matter too. I'd assess each case carefully rather than assume newer always means better or that everything old must <mark class=\"idiom\">stay exactly as it is(原样保留)</mark>.",
          "t": "有时需替换，但不应自动推倒。旧建筑有文化价值，可能改用途；也要考虑安全和需求。应具体评估，不假设新一定好或旧必须原样保留。"
        },
        {
          "q": "Is it better to live in an apartment than in a house?",
          "a": "It depends on location, household needs and preferences. Apartments may be more convenient in a city and involve less individual maintenance. Houses can offer more space and privacy. <span class=\"conn\">But</span> neither is always superior. I'd compare the practical experience of living there, not just the <mark class=\"idiom\">type of property(房产类型)</mark>.",
          "t": "取决于地点、家庭需求和偏好。公寓城市生活方便、维护少，独立房空间与隐私多。应比较实际居住体验，而非只看类型。"
        },
        {
          "q": "Is it important to protect historic buildings? Why?",
          "a": "Yes, important historic buildings help preserve evidence of the past and contribute to a place's identity. Once lost, their original features may be impossible to recreate. <span class=\"conn\">However</span>, protection needs a practical plan for maintenance and use. Simply leaving a building untouched doesn't necessarily <mark class=\"idiom\">keep it in good condition(让它保持良好状态)</mark>.",
          "t": "重要建筑保留历史证据和地方身份，原有特征失去后可能无法重建。但保护要有维护与用途计划，不动它不等于保存好。"
        },
        {
          "q": "Why is it hard to protect historic buildings?",
          "a": "Repairs can be expensive, and suitable materials or skills may be difficult to find. There can also be pressure to use the land differently. <span class=\"conn\">So</span>, protection requires ongoing cooperation between owners, specialists and public authorities. A one-time restoration isn't enough if nobody can <mark class=\"idiom\">look after it(持续照料它)</mark> afterwards.",
          "t": "维修贵，材料与技术可能难找，也有土地开发压力。需要业主、专家和管理机构持续合作，一次修复不够，之后仍需照料。"
        },
        {
          "q": "Why do some people prefer to live in the countryside?",
          "a": "Some prefer the space, quieter surroundings and closer access to nature. They may also value familiar community relationships. <span class=\"conn\">However</span>, rural life can involve longer journeys to work or services, so the choice has trade-offs. What feels peaceful to one person may feel isolated to another; it's about finding the right <mark class=\"idiom\">fit(适合自己的环境)</mark>.",
          "t": "有人喜欢空间、安静、自然和熟悉社区，但工作或服务距离可能远，有取舍。有人觉得平静，有人觉得孤立，需看是否适合自己。"
        }
      ],
      "cat": "地点",
      "sourcePage": 17
    },
    {
      "id": "s26p2_24",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🎉",
      "ztitle": "印象深刻的聚会",
      "describe": "Describe a party for a special event that impressed you a lot",
      "shouldsay": [
        "When and where it was held",
        "What the party was held for",
        "How many people attended it",
        "And explain why it impressed you a lot"
      ],
      "a": "A party for a special event that really impressed me was my grandmother's seventieth birthday celebration. We held it at my aunt's home last year, with around twenty people, mostly close relatives and a few of my grandmother's old friends.<br><br>It wasn't a huge or expensive party. We decorated the living room with family photographs, prepared some of her favourite dishes and arranged enough seats so everyone could talk comfortably. My cousin also put together a short slideshow using pictures from different stages of her life.<br><br>The most memorable moment came after dinner. Instead of giving formal speeches, several people shared a brief memory of her. An old friend talked about a trip they'd taken many years earlier, and one of my younger cousins described how she had taught him to cook. Some stories were funny, while others made the room go quiet for a moment.<br><br>My grandmother seemed especially pleased that everyone had made time to come. She kept moving around the room, asking about people's lives rather than focusing only on herself. That made the celebration feel warm and natural.<br><br>I was impressed because the party showed how much one person can mean to a whole family. The decorations and food were nice, but the real value was in <mark class=\"idiom\">bringing everyone together(把大家聚在一起)</mark>. It reminded me that a special event doesn't need to be extravagant to <mark class=\"idiom\">leave a lasting impression(留下持久印象)</mark>. Attention, effort and genuine affection can matter far more.",
      "t": "去年我们在阿姨家为奶奶庆祝七十岁生日，约二十人参加，主要是亲属和几位老朋友，聚会让我印象深刻。<br><br>它不大，也不昂贵。我们用家庭照片装饰客厅，做她喜欢的菜，准备足够座位，表亲还把不同人生阶段的照片做成幻灯片。<br><br>饭后最难忘。几个人各分享一段回忆，而不是正式演讲。老朋友讲年轻时一起旅行，小表弟讲奶奶教他做饭。有些故事好笑，有些让房间短暂安静。<br><br>奶奶最开心的是大家抽出时间来。她到处走动，关心每个人的生活，而不只让自己成为中心，因此聚会自然又温暖。<br><br>我被打动，是因为它展示一个人对整个家庭的意义。真正的价值是让大家相聚。特别活动无需奢华，也能留下长久印象；用心、努力和真情更重要。",
      "p3": [
        {
          "q": "When do people like to hold a party?",
          "a": "People often hold parties for birthdays, weddings, graduations or the completion of something important. A party gives them a chance to share happiness and thank others. <span class=\"conn\">Sometimes</span>, there isn't a formal occasion at all; people simply want to reconnect. The common purpose is usually to <mark class=\"idiom\">mark a moment together(一起纪念某个时刻)</mark>.",
          "t": "生日、婚礼、毕业或完成重要事情时常聚会，分享快乐、感谢他人。有时只是想重聚，目的通常是一起纪念一个时刻。"
        },
        {
          "q": "Do you think people nowadays prefer attending big parties or small gatherings with close friends? Why?",
          "a": "Preferences vary, but small gatherings can be easier to organise and allow deeper conversation. Big parties offer more energy and a chance to meet new people. <span class=\"conn\">For me</span>, the occasion matters more than a general trend. I'd choose the size that lets guests <mark class=\"idiom\">enjoy themselves comfortably(舒适地享受聚会)</mark>, rather than make it impressive for its own sake.",
          "t": "小聚好组织、聊得深入，大聚有活力、能认识新人。取决于场合，规模应让大家舒服享受，而非为了显得盛大。"
        },
        {
          "q": "Are there any differences between how young people and older people celebrate events with parties?",
          "a": "Younger people may choose louder music or more informal activities, while some older people prefer a meal and conversation. <span class=\"conn\">But</span> those are broad possibilities, not fixed rules. Family traditions and individual personality can matter more. A successful party takes the guests into account instead of relying on <mark class=\"idiom\">age-based assumptions(基于年龄的假设)</mark>.",
          "t": "年轻人可能喜欢音乐与随意活动，一些长者喜欢吃饭聊天，但不是固定规则。传统和性格更重要，应考虑实际宾客，而非年龄假设。"
        },
        {
          "q": "What special events are celebrated in your country?",
          "a": "People celebrate family occasions such as weddings and important birthdays, as well as festivals like the Spring Festival and the Mid-Autumn Festival. Schools and workplaces may mark achievements too. <span class=\"conn\">Although</span> the details differ, many celebrations create an opportunity to <mark class=\"idiom\">reaffirm relationships(巩固关系)</mark> and bring people together around shared traditions.",
          "t": "有婚礼、重要生日、春节、中秋等，学校工作场所也庆祝成就。方式虽不同，常都是巩固关系、围绕共同传统相聚。"
        },
        {
          "q": "Do you think it’s a waste of money for governments to celebrate national events?",
          "a": "Not necessarily. A proportionate celebration can create shared enjoyment and recognise something meaningful. <span class=\"conn\">However</span>, spending should be transparent and balanced against other public needs. I'd question extravagance that offers little lasting value. The issue is whether the event serves the community, rather than assuming all celebration is <mark class=\"idiom\">money well spent(花得值得)</mark>.",
          "t": "不一定。适度庆祝可带来共享快乐，但支出须透明、兼顾公共需求。应质疑低价值的奢华，看是否服务社区，而非所有庆祝都值得。"
        },
        {
          "q": "What festivals are the most important for people in your country?",
          "a": "The Spring Festival is especially important to many people because of family reunions and long-standing customs. The Mid-Autumn Festival is also meaningful for similar reasons. <span class=\"conn\">However</span>, personal importance varies with background and experience. Someone may value a smaller local festival just as much because it has a strong <mark class=\"idiom\">emotional connection(情感联系)</mark> for them.",
          "t": "春节因团圆和传统尤其重要，中秋也有类似意义。但个人重要性随背景和经历不同，本地小节庆也可能有强烈情感联系。"
        }
      ],
      "cat": "经历",
      "sourcePage": 18
    },
    {
      "id": "s26p2_25",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "🌿",
      "ztitle": "有健康习惯和作息的人",
      "describe": "Describe a person you know who has healthy habits and a healthy daily routine",
      "shouldsay": [
        "Who this person is",
        "How you got to know each other",
        "What he/she does to keep this lifestyle",
        "And explain how you feel about him/her"
      ],
      "a": "A person I know who has healthy habits is my colleague Emma. We became friends while working on a teaching project, and I gradually noticed that she had a much more balanced routine than I did.<br><br>She usually gets up at a similar time each morning, has breakfast and takes a short walk before work if she can. She prepares simple meals at home quite often and keeps a bottle of water on her desk. None of these habits is dramatic, but she follows them fairly consistently.<br><br>What I find most sensible is that she makes room for both activity and rest. She enjoys cycling at weekends, but she doesn't treat every free hour as a chance to work harder. In the evening, she tries to finish checking work messages at a reasonable time and does something relaxing, like reading or playing the guitar.<br><br><span class=\"conn\">Of course</span>, her routine isn't perfect. If we have an early deadline, she may stay up later, and she enjoys cake at a birthday party like everyone else. The difference is that she returns to her normal habits afterwards instead of deciding that one unusual day has ruined everything.<br><br>I admire this approach because it seems realistic. She isn't constantly giving other people advice or comparing routines. She simply makes choices that help her feel more settled. Seeing her has encouraged me to <mark class=\"idiom\">take better care of myself(更好地照顾自己)</mark> through small, manageable changes, rather than making ambitious promises I can't <mark class=\"idiom\">keep up(持续做到)</mark>.",
      "t": "同事Emma有健康习惯和均衡作息。我们在教学项目中成为朋友，我逐渐注意到她比我更能保持生活平衡。<br><br>她每天差不多时间起床、吃早餐，有空就上班前短暂散步。她常在家做简单饭菜，桌上也放着水。这些习惯不夸张，但能持续执行。<br><br>我觉得最合理的是，她既安排活动，也安排休息。周末喜欢骑车，却不会把所有空闲时间都变成工作。晚上尽量在合适时间停止查工作消息，然后读书或弹吉他。<br><br>她并非完美，遇到截止日期也会晚睡，生日聚会也吃蛋糕。但之后会恢复正常习惯，不会因为一天不同就全部放弃。<br><br>我欣赏这种现实的方式。她不强迫别人照做，只选择能让自己稳定的方法。她鼓励我通过可实现的小改变照顾自己，而不是许下无法坚持的大承诺。",
      "p3": [
        {
          "q": "Does the government play an important role in promoting healthy lifestyles in a community?",
          "a": "Yes, governments can make healthy choices easier through accessible parks, safe walking routes and clear public information. Community facilities can also support activities people enjoy. <span class=\"conn\">However</span>, promoting a lifestyle shouldn't just mean telling individuals to try harder. Practical conditions matter if people are expected to <mark class=\"idiom\">put advice into practice(把建议变成行动)</mark>.",
          "t": "政府可通过公园、安全步道和清晰信息，让健康选择更容易，也可提供活动设施。不应只要求个人努力，还须创造能行动的实际条件。"
        },
        {
          "q": "Do you think it is important to live in a community where people have healthy lifestyles?",
          "a": "It can help because local facilities and shared habits influence what feels easy or normal. For instance, a welcoming walking group may encourage someone to join. <span class=\"conn\">Still</span>, a community shouldn't become judgemental about personal routines. Support works better when people feel included and can <mark class=\"idiom\">start where they are(从自己的现状开始)</mark>.",
          "t": "设施和共同习惯能帮助，例如友好步行小组鼓励参与。但社区不应评判个人作息，应包容并让人从现状开始。"
        },
        {
          "q": "How can people relieve stress in daily life?",
          "a": "For ordinary daily pressure, people may find a short walk, a conversation or time away from work helpful. Choosing something manageable matters more than creating another demanding task. <span class=\"conn\">Also</span>, identifying what's causing the pressure can help them adjust expectations. Different people need different ways to <mark class=\"idiom\">unwind(放松下来)</mark>.",
          "t": "面对日常压力，短暂散步、聊天或离开工作可能有帮助。方法应可执行，而非增加任务，也可找出原因、调整期待；放松方式因人而异。"
        },
        {
          "q": "What effect does stress have on health?",
          "a": "Ongoing stress can affect how people feel and function, for example by making it harder to relax, sleep or concentrate. <span class=\"conn\">However</span>, its effects vary, and I wouldn't make assumptions about an individual's health from a brief conversation. In general, it's sensible to take persistent difficulties seriously rather than simply <mark class=\"idiom\">brush them aside(不当回事)</mark>.",
          "t": "持续压力可能影响放松、睡眠和专注，但因人而异，不能凭简短交谈判断健康。持续困难值得认真对待，而非忽略。"
        },
        {
          "q": "Which group pays more attention to health, young people or old people?",
          "a": "Older people may pay more attention because health affects their daily independence more visibly. Younger people can be very interested too, especially in sport or balanced routines. <span class=\"conn\">So</span>, I wouldn't divide the groups too sharply. Experience, responsibilities and personal priorities often matter more than age when someone chooses to <mark class=\"idiom\">look after themselves(照顾自己)</mark>.",
          "t": "长者可能更关注，因为健康更直接影响独立生活，年轻人也可能重视运动和作息。经历、责任和优先事项常比年龄重要。"
        }
      ],
      "cat": "人物",
      "sourcePage": 18
    },
    {
      "id": "s26p2_26",
      "tag": "本季新题",
      "region": "mainland",
      "emoji": "📖",
      "ztitle": "读起来开心的书",
      "describe": "Describe a book you enjoyed reading and that made you happy",
      "shouldsay": [
        "What kind of book it was",
        "What it was about",
        "Why you read it",
        "And explain why it made you happy"
      ],
      "a": "A book I enjoyed reading and that made me happy was Winnie-the-Pooh. It's a children's storybook about a bear and his friends, and I returned to it last year after finding an old copy while tidying a cupboard.<br><br>I had first read parts of it as a child, but I hadn't opened it for a long time. I decided to read it again because I wanted something gentle after several busy weeks. I wasn't looking for a complicated plot or a book that would teach me to become more productive.<br><br>The stories describe the characters' small adventures and misunderstandings. What I particularly enjoyed was the humour: the characters take their little problems very seriously, while the reader can see how simple the situation really is. The friendships also feel warm, even when the characters don't fully understand one another.<br><br>I read a few pages each evening rather than rushing through it. That made it a pleasant part of my day. Sometimes I found myself smiling at a sentence or remembering how I had imagined the characters when I was younger. It brought back a <mark class=\"idiom\">sense of childhood wonder(童年般的惊喜感)</mark>.<br><br>The book made me happy because it offered a quiet break from the pressure to achieve something all the time. It reminded me that kindness, companionship and small pleasures deserve attention too. I wouldn't say it solved any problems, but it <mark class=\"idiom\">lifted my spirits(让我振作、开心)</mark> in a very simple way, which was exactly what I needed.",
      "t": "让我读得开心的一本书是《小熊维尼》。它是关于小熊与朋友们的儿童故事书。去年整理柜子发现旧书后，我又读了一遍。<br><br>我小时候读过部分内容，但很久没翻。忙了几周后，我想找温和轻松的读物，而非复杂剧情或教我提高效率的书。<br><br>故事写角色们的小冒险和误会。我很喜欢其中的幽默：他们认真对待小问题，而读者看得出事情其实很简单。即使不能完全理解彼此，友谊仍很温暖。<br><br>我每晚只读几页，不急着读完，这成为一天中愉快的环节。有时一句话让我微笑，也让我想起小时候如何想象这些角色，重新感到童年的惊喜。<br><br>它让我暂时离开必须不断取得成就的压力，提醒我善意、陪伴和小乐趣也值得重视。虽然没解决实际问题，却简单地改善了心情，正是我需要的。",
      "p3": [
        {
          "q": "What kinds of books are popular in China?",
          "a": "Fiction, practical guides and books for children seem to have broad appeal, although reading tastes vary enormously. Some people prefer history or science writing, while others enjoy light stories after work. <span class=\"conn\">So</span>, I'd be cautious about naming one dominant category. Different readers look for different things, from useful information to a <mark class=\"idiom\">temporary escape(短暂逃离日常)</mark>.",
          "t": "小说、实用指南、儿童书受众广，但口味多样，也有人喜欢历史科学或轻松故事。不能归为单一类型，阅读需求包括信息和暂时放松。"
        },
        {
          "q": "Do you think people should read the original book before watching the movie?",
          "a": "They don't have to, but reading first can provide details and inner thoughts that a film leaves out. <span class=\"conn\">On the other hand</span>, a film may introduce someone to a book they wouldn't otherwise choose. I'd let people enjoy either order rather than turn reading into a <mark class=\"idiom\">prerequisite(前提条件)</mark> for watching.",
          "t": "不必，但先读能知道电影省略的细节与内心。电影也可吸引人去读原著，顺序可以自由，不应把阅读当观看门槛。"
        },
        {
          "q": "Are success books useful to everyone?",

          "t": "不是人人都适用。有些有用，有些仅凭个人经历、过度简化。读者应判断是否适合处境，把它作为思考材料，而非保证成功的路线。"

          "q": "Do you think people today read less than before? Why?",

          "t": "难判断，因为现在也读文章和消息。长书时间可能被娱乐占据，但不等于总阅读更少，应区分深入阅读和扫屏。"

          "t": "电影有完整视听体验、时长较明确，累时可能更省力。也有人爱书的节奏与想象自由，多是便利和偏好，而非天然优劣。"

      "describe": "Describe a time when you helped someone",
      "shouldsay": [
